<style>
#splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:radial-gradient(120% 90% at 20% 0%,#1b9a84 0%,#0b6a5a 48%,#08433c 100%);transition:opacity .45s ease}
#splash .sp-logo{width:132px;height:132px;border-radius:32px;box-shadow:0 18px 50px rgba(0,0,0,.35);animation:spIn .7s cubic-bezier(.2,.8,.2,1) both}
#splash .sp-brand{display:flex;flex-direction:column;align-items:center;opacity:0;transform:translateY(8px);transition:opacity .45s ease,transform .45s ease}
#splash .sp-name{font:700 30px/1.1 Onest,system-ui,sans-serif;color:#fff;letter-spacing:.5px}
#splash .sp-name b{color:#8be3cf;font-weight:700}
#splash .sp-by{font:500 14px/1.6 Onest,system-ui,sans-serif;color:#bfe6dd;margin-top:4px}
#splash .sp-bar{position:absolute;bottom:calc(56px + env(safe-area-inset-bottom,0px));width:96px;height:4px;border-radius:4px;background:rgba(255,255,255,.22);overflow:hidden}
#splash .sp-bar i{display:block;height:100%;width:100%;background:#8be3cf;border-radius:4px;transform:translateX(-100%);animation:spBar 1.7s ease forwards}
#splash.show-brand .sp-brand{opacity:1;transform:none}
#splash.hide{opacity:0;pointer-events:none}
@keyframes spIn{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:none}}
@keyframes spBar{to{transform:none}}
@media (prefers-reduced-motion:reduce){#splash .sp-logo{animation:none}#splash,#splash .sp-brand{transition:none}#splash .sp-bar i{animation:none;transform:none}}
</style>
<script>
(function(){var s=document.getElementById('splash');if(!s)return;
var rm=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function done(){s.classList.add('hide');setTimeout(function(){s.remove()},500)}
setTimeout(function(){s.classList.add('show-brand')},rm?0:900);
var t=setTimeout(done,rm?900:1900);
s.addEventListener('click',function(){clearTimeout(t);done()});})();
</script>
