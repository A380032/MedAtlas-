<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MedAtlas by ALVORA</title>
<meta name="description" content="1–3-kurs tibbiyot talabalari uchun qo'llanmalar, testlar va klinik simulyatorlar">
<meta name="theme-color" content="#15302f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MedAtlas by ALVORA">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="splash" aria-hidden="true">
  <img class="sp-logo" src="icons/icon-512.png" alt="">
  <div class="sp-brand"><span class="sp-name">MedAtlas</span><span class="sp-by">by ALVORA</span></div>
</div>
<style>
#splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:#eef4fb;transition:opacity .45s ease}
#splash .sp-logo{width:148px;height:148px;border-radius:34px;box-shadow:0 18px 50px rgba(30,70,140,.22);animation:spIn .7s cubic-bezier(.2,.8,.2,1) both}
#splash .sp-brand{display:flex;flex-direction:column;align-items:center;opacity:0;transform:translateY(8px);transition:opacity .45s ease,transform .45s ease}
#splash .sp-name{font:700 30px/1.1 Unbounded,system-ui,sans-serif;color:#15302f;letter-spacing:.5px}
#splash .sp-by{font:500 13px/1.6 Onest,system-ui,sans-serif;color:#4c6a8a;letter-spacing:3px;text-transform:uppercase}
#splash.show-brand .sp-brand{opacity:1;transform:none}
#splash.hide{opacity:0;pointer-events:none}
@keyframes spIn{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#splash .sp-logo{animation:none}#splash,#splash .sp-brand{transition:none}}
</style>
<script>
(function(){var s=document.getElementById('splash');if(!s)return;
var rm=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function done(){s.classList.add('hide');setTimeout(function(){s.remove()},500)}
setTimeout(function(){s.classList.add('show-brand')},rm?0:900);
var t=setTimeout(done,rm?900:1900);
s.addEventListener('click',function(){clearTimeout(t);done()});})();
</script>
<header class="topbar">
  <button class="icon-btn" id="backBtn" aria-label="Orqaga" hidden>
    <svg viewBox="0 0 24 24" width="22" height="22"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <h1 class="topbar-title" id="pageTitle">Qo'llanma</h1>
  <button class="icon-btn fs-btn" id="fsDown" aria-label="Matnni kichraytirish"><span>A−</span></button>
  <button class="icon-btn fs-btn" id="fsUp" aria-label="Matnni kattalashtirish"><span>A+</span></button>
  <button class="icon-btn" id="themeBtn" aria-label="Tungi rejim">
    <svg viewBox="0 0 24 24" width="21" height="21"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
  </button>
</header>

<main id="view" tabindex="-1"></main>

<nav class="tabbar" aria-label="Asosiy menyu">
  <a href="#/" data-tab="home">
    <svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
    <span>Bosh</span>
  </a>
  <a href="#/qidiruv" data-tab="search">

    <span>Qidiruv</span>
  </a>
  <a href="#/simulyatorlar" data-tab="sim">
    <svg viewBox="0 0 24 24"><path d="M6 3v6a5 5 0 0 0 10 0V3M11 14v2a4 4 0 0 0 8 0v-2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="19" cy="12" r="2" fill="none" stroke="currentColor" stroke-width="2"/></svg>
    <span>Simulyator</span>
  </a>
  <a href="#/kutubxona" data-tab="lib">
    <svg viewBox="0 0 24 24"><path d="M4 4h4v16H4zM9 4h4v16H9zM14.5 5.5l3.8-1 3.2 14.8-3.8 1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
    <span>Kutubxona</span>
  </a>
  <a href="#/saqlangan" data-tab="saved">
    <svg viewBox="0 0 24 24"><path d="M7 3h10v18l-5-4-5 4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
    <span>Saqlangan</span>
  </a>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="js/app.js"></script>
</body>
</html>
