<!doctype html>
<html lang="uz"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fiziologiya laboratoriyasi</title>
<meta name="description" content="Normal fiziologiya: 15 ta laboratoriya ishi bo'yicha virtual laboratoriya — asboblar bilan qadamma-qadam ishlash, o'lchash, hisoblash va natijani baholash">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --sunk:#E3E8ED; --ink:#15202B; --muted:#5A6B7B; --line:#CDD6DF;
  --accent:#1F5FA0; --accent-soft:#DCE8F5; --on-accent:#FFFFFF;
  --bad:#B03A32; --bad-soft:#F7E1DE; --good:#2A7A4A; --good-soft:#DDF0E3; --warn:#946200; --warn-soft:#F6ECD2;
  --bench:#D9DEE3; --bench2:#C9D0D7;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F151B; --surface:#17202A; --sunk:#0C1217; --ink:#E3EAF1; --muted:#97A7B7; --line:#2A3846;
  --accent:#6FA8E3; --accent-soft:#193049; --on-accent:#06131F;
  --bad:#EA8A80; --bad-soft:#3A1F1C; --good:#73C99A; --good-soft:#163222; --warn:#E3B651; --warn-soft:#352A12;
  --bench:#26313C; --bench2:#1E2832; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F151B; --surface:#17202A; --sunk:#0C1217; --ink:#E3EAF1; --muted:#97A7B7; --line:#2A3846;
  --accent:#6FA8E3; --accent-soft:#193049; --on-accent:#06131F;
  --bad:#EA8A80; --bad-soft:#3A1F1C; --good:#73C99A; --good-soft:#163222; --warn:#E3B651; --warn-soft:#352A12;
  --bench:#26313C; --bench2:#1E2832; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.55}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(1.6rem,4vw,2.3rem);font-weight:800}
h2{font-size:1.35rem;font-weight:800}
h3{font-size:1.02rem;font-weight:600}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-left,0px)) 40px max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono)}
.small{font-size:.86rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:7px 14px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:.93rem;line-height:1.2;text-align:center}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.sm{min-height:34px;padding:5px 10px;font-size:.86rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.on{background:var(--accent-soft);border-color:var(--accent);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
/* bosh sahifa */
.hero{padding:6px 0 14px}
.hero p{max-width:760px;margin-top:6px}
.grp{margin-top:18px}
.grp h2{font-size:1.05rem;margin-bottom:8px;color:var(--muted);font-family:var(--f-body);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.case{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;width:100%}
.case:hover{border-color:var(--accent)}
.case .no{flex:0 0 auto;width:38px;height:38px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-family:var(--f-mono)}
.case .t{font-weight:600;line-height:1.3}
.case .s{font-size:.84rem;color:var(--muted);margin-top:3px}
.case .sc{font-size:.8rem;margin-top:5px;font-weight:600}
.case .sc.ok{color:var(--good)} .case .sc.mid{color:var(--warn)}
/* holat sahifasi */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.top h1{font-size:clamp(1.2rem,3vw,1.6rem);flex:1 1 300px}
.subj{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:var(--r);padding:10px 14px;margin-bottom:12px}
.lay{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px;align-items:start}
@media (max-width:980px){.lay{grid-template-columns:minmax(0,1fr)}}
.stage{background:linear-gradient(180deg,var(--bench),var(--bench2));border:1px solid var(--line);border-radius:var(--r);padding:12px;min-width:0}
.stage .sv{display:block;width:100%;height:auto;background:#F4F6F8;border-radius:8px;border:1px solid #B9C3CC}
.stage canvas{display:block;width:100%;border-radius:8px;border:1px solid #B9C3CC;background:#fff;touch-action:manipulation}
.panel{display:flex;flex-direction:column;gap:12px;min-width:0}
.steps ol{margin:6px 0 0;padding:0;list-style:none;counter-reset:s}
.steps li{position:relative;padding:5px 0 5px 32px;font-size:.9rem;line-height:1.35;counter-increment:s}
.steps li::before{content:counter(s);position:absolute;left:0;top:4px;width:23px;height:23px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:.75rem;font-weight:600;color:var(--muted)}
.steps li.cur::before{border-color:var(--accent);color:var(--accent)}
.steps li.done{color:var(--muted)}
.steps li.done::before{content:"✓";background:var(--good);border-color:var(--good);color:#fff}
.log{max-height:220px;overflow:auto;font-size:.88rem;display:flex;flex-direction:column;gap:5px}
.log div{padding:6px 9px;border-radius:7px;background:var(--sunk);line-height:1.35}
.log .err{background:var(--bad-soft);color:var(--bad)}
.log .ok{background:var(--good-soft);color:var(--good)}
.log .pt{background:var(--warn-soft)}
.jr label{display:block;font-size:.88rem;margin:9px 0 3px;font-weight:500;line-height:1.3}
.jr .inp{display:flex;gap:6px;align-items:center}
.jr input,.jr select{width:100%;min-height:38px;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.jr input{max-width:150px;font-family:var(--f-mono)}
.jr .u{font-size:.85rem;color:var(--muted);white-space:nowrap}
.jr .fb{font-size:.82rem;margin-top:3px;line-height:1.35}
.jr .fb.ok{color:var(--good)} .jr .fb.no{color:var(--bad)}
.mc label{display:flex;gap:8px;align-items:flex-start;font-weight:400;margin:6px 0;padding:7px 9px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.mc input{width:auto;min-height:0;margin-top:4px}
.mc label.ok{border-color:var(--good);background:var(--good-soft)}
.mc label.no{border-color:var(--bad);background:var(--bad-soft)}
.res{border-radius:var(--r);padding:12px 14px;border:1px solid var(--line);background:var(--surface)}
.res .big{font-family:var(--f-display);font-size:1.6rem;font-weight:800}
.res.good{border-color:var(--good)} .res.mid{border-color:var(--warn)} .res.low{border-color:var(--bad)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.ctl .grpc{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:6px 8px}
.ctl .lbl{font-size:.8rem;color:var(--muted);font-weight:600;margin-right:2px}
.stp{display:inline-flex;align-items:center;gap:4px}
.stp .v{min-width:74px;text-align:center;font-family:var(--f-mono);font-weight:600;background:#0F1A12;color:#7CFF9A;border-radius:6px;padding:5px 8px;font-size:.95rem}
.stp button{min-width:36px;min-height:34px;border-radius:7px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.note{font-size:.84rem;color:var(--muted);margin-top:8px;line-height:1.4}
.clock{font-family:var(--f-mono);font-weight:600;background:#111;color:#FFB347;border-radius:6px;padding:5px 9px;min-width:84px;text-align:center}
.hl{outline:3px solid #F2B705;outline-offset:2px}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:9px;font-size:.9rem;z-index:50;max-width:min(92vw,520px);text-align:center}
.tbl{border-collapse:collapse;font-size:.86rem;width:100%}
.tbl td,.tbl th{border:1px solid var(--line);padding:4px 7px;text-align:left}
.tbl th{background:var(--sunk);font-weight:600}
svg text{font-family:var(--f-body)}
.clk{cursor:pointer}
.clk:hover{filter:brightness(1.08)}
</style>
</head><body>
<div class="wrap" id="app"></div>
<script>
"use strict";
/* ===== Yordamchilar ===== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const NS="http://www.w3.org/2000/svg";
function el(tag,attrs={},...kids){const e=document.createElement(tag);for(const k in attrs){if(k==="html")e.innerHTML=attrs[k];else if(k.startsWith("on"))e.addEventListener(k.slice(2),attrs[k]);else if(attrs[k]!==false&&attrs[k]!=null)e.setAttribute(k,attrs[k]===true?"":attrs[k]);}for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(c));}return e;}
function sv(tag,attrs={},parent){const e=document.createElementNS(NS,tag);for(const k in attrs){if(k==="text")e.textContent=attrs[k];else e.setAttribute(k,attrs[k]);}if(parent)parent.appendChild(e);return e;}
function svgRoot(w,h){const s=document.createElementNS(NS,"svg");s.setAttribute("viewBox",`0 0 ${w} ${h}`);s.setAttribute("class","sv");return s;}
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const fx=(x,d=1)=>(+x).toFixed(d).replace(".",",");
const num=s=>{if(s==null)return NaN;s=String(s).trim().replace(/\s/g,"").replace(",",".");if(s==="")return NaN;return Number(s);};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(t){const o=$(".toast");if(o)o.remove();const d=el("div",{class:"toast"},t);document.body.append(d);setTimeout(()=>d.remove(),2600);}
const store={get(k,d){try{const v=localStorage.getItem("tq:fzl:"+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem("tq:fzl:"+k,JSON.stringify(v));}catch(e){}}};

/* ===== Simulyatsiya soati (tezlashtirish bilan) ===== */
function makeClock(onTick){
  const c={t:0,speed:1,run:false,last:0,raf:0,
    start(){if(c.run)return;c.run=true;c.last=performance.now();c.raf=requestAnimationFrame(c.loop);},
    stop(){c.run=false;cancelAnimationFrame(c.raf);},
    loop(now){if(!c.run)return;const dt=Math.min(0.25,(now-c.last)/1000)*c.speed*(window.__TS||1);c.last=now;c.t+=dt;onTick&&onTick(c.t,dt);if(c.run)c.raf=requestAnimationFrame(c.loop);},
    reset(){c.stop();c.t=0;}};
  return c;
}
const mmss=t=>{t=Math.max(0,Math.floor(t));return String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0");};

/* ===== Stepper (asbob tugmasi) ===== */
function stepper({label,val,min,max,steps=[1],fmt=v=>v,onChange}){
  const box=el("span",{class:"stp"});const v=el("span",{class:"v"});
  let cur=val;const show=()=>v.textContent=fmt(cur);
  const mk=(d,t)=>el("button",{type:"button","aria-label":label+" "+t,onclick:()=>{const n=Math.round((cur+d)*1e6)/1e6;if(n<min-1e-9||n>max+1e-9)return;cur=n;show();onChange&&onChange(cur);}},t);
  const big=steps[1],sm=steps[0];
  if(big)box.append(mk(-big,"«"));box.append(mk(-sm,"−"),v,mk(sm,"+"));if(big)box.append(mk(big,"»"));
  show();
  box.get=()=>cur;box.set=x=>{cur=x;show();};
  return box;
}
function ctlGroup(label,...kids){return el("div",{class:"grpc"},el("span",{class:"lbl"},label),...kids);}

/* ===== Asosiy dvigatel ===== */
const CASES=[];
const GROUPS=["Qo'zg'aluvchan to'qimalar","Qon fiziologiyasi","Yurak va qon tomirlar","Nafas fiziologiyasi","Analizatorlar va oliy nerv faoliyati"];
const app=$("#app");
let CUR=null; // joriy holat konteksti

function home(){
  if(CUR&&CUR.cleanup)CUR.cleanup();CUR=null;const ot=$(".toast");if(ot)ot.remove();
  app.innerHTML="";
  const best=store.get("best",{});
  const done=CASES.filter(c=>best[c.id]!=null).length;
  app.append(el("div",{class:"hero"},
    el("h1",{},"Fiziologiya laboratoriyasi"),
    el("p",{class:"muted"},"Normal fiziologiya qo'llanmasidagi laboratoriya ishlari asosida 15 ta virtual holat. Har birida asboblar bilan bosqichma-bosqich ishlaysiz, o'lchaysiz, hisoblaysiz va natijani baholaysiz. Tartib buzilsa yoki noto'g'ri ishlansa, laboratoriya daftariga xato sifatida yoziladi."),
    el("p",{class:"small",style:"margin-top:8px"},`Bajarilgan: ${done} / ${CASES.length}`)));
  GROUPS.forEach((g,gi)=>{
    const list=CASES.filter(c=>c.grp===gi);if(!list.length)return;
    const grid=el("div",{class:"cases"});
    list.forEach(c=>{const b=best[c.id];
      grid.append(el("button",{class:"case",type:"button",onclick:()=>{location.hash="#"+c.id;}},
        el("span",{class:"no"},String(c.no).padStart(2,"0")),
        el("span",{},el("div",{class:"t"},c.title),el("div",{class:"s"},c.short),
          b!=null?el("div",{class:"sc "+(b>=85?"ok":"mid")},`Eng yaxshi natija: ${b} %`):null)));});
    app.append(el("section",{class:"grp"},el("h2",{},g),grid));
  });
  window.scrollTo(0,0);
}

function openCase(c){
  if(CUR&&CUR.cleanup)CUR.cleanup();const ot=$(".toast");if(ot)ot.remove();
  app.innerHTML="";
  const P=c.gen();
  const ctx={c,P,rec:{},errs:[],stepDone:c.steps.map(()=>false),cleanups:[],checked:false};
  CUR=ctx;
  ctx.cleanup=()=>{ctx.cleanups.forEach(f=>{try{f();}catch(e){}});ctx.cleanups=[];};
  const stepsOl=el("ol");
  const logBox=el("div",{class:"log","aria-live":"polite"});
  const stage=el("div",{class:"stage"});
  const jr=el("div",{class:"card jr"});
  const resBox=el("div");
  ctx.stage=stage;
  ctx.msg=(t,k="")=>{const d=el("div",{class:k},t);logBox.append(d);logBox.scrollTop=logBox.scrollHeight;};
  ctx.say=t=>ctx.msg("🗣 "+t,"pt");
  ctx.err=t=>{if(ctx.checked)return;ctx.errs.push(t);ctx.msg("✗ "+t,"err");toast(t);};
  ctx.ok=t=>ctx.msg("✓ "+t,"ok");
  ctx.renderSteps=()=>{stepsOl.innerHTML="";const cur=ctx.stepDone.indexOf(false);
    c.steps.forEach((s,i)=>stepsOl.append(el("li",{class:ctx.stepDone[i]?"done":(i===cur?"cur":"")},s)));};
  ctx.done=i=>{if(!ctx.stepDone[i]){ctx.stepDone[i]=true;ctx.renderSteps();}};
  ctx.isDone=i=>ctx.stepDone[i];
  ctx.need=(i,silent)=>{for(let k=0;k<i;k++)if(!ctx.stepDone[k]&&!(c.optional||[]).includes(k)){if(!silent)ctx.err(`Avval ${k+1}-bosqichni bajaring: «${c.steps[k]}»`);return false;}return true;};
  ctx.onClean=f=>ctx.cleanups.push(f);

  app.append(el("div",{class:"top"},
    el("button",{class:"btn sm",type:"button",onclick:()=>{location.hash="";}},"← Holatlar"),
    el("h1",{},`${c.no}. ${c.title}`),
    el("button",{class:"btn sm",type:"button",onclick:()=>openCase(c)},"↻ Yangi tekshiriluvchi")));
  app.append(el("div",{class:"subj",html:c.subj(P)}));
  const lay=el("div",{class:"lay"});
  const panel=el("div",{class:"panel"},
    el("div",{class:"card steps"},el("h3",{},"Ish tartibi"),stepsOl),
    el("div",{class:"card"},el("h3",{},"Laboratoriya daftari"),logBox),
    jr,resBox);
  lay.append(stage,panel);app.append(lay);
  ctx.renderSteps();
  c.build(ctx);
  buildJournal(ctx,jr,resBox);
  window.scrollTo(0,0);
}

function buildJournal(ctx,jr,resBox){
  const c=ctx.c;
  jr.append(el("h3",{},"Natijalar bayonnomasi"));
  const fields=c.journal(ctx);
  ctx.fields=fields;
  fields.forEach(f=>{
    let inp;
    if(f.type==="sel"){inp=el("select",{id:"f_"+f.id},el("option",{value:""},"— tanlang —"),...f.options.map((o,i)=>el("option",{value:String(i)},o)));}
    else inp=el("input",{id:"f_"+f.id,inputmode:"decimal",autocomplete:"off",placeholder:f.ph||""});
    f.inp=inp;f.fb=el("div",{class:"fb"});
    jr.append(el("label",{for:"f_"+f.id},f.label),el("div",{class:"inp"},inp,f.unit?el("span",{class:"u"},f.unit):null),f.fb);
  });
  const mc=c.mc(ctx);ctx.mcq=mc;
  const mcBox=el("div",{class:"mc"});
  mcBox.append(el("label",{style:"border:0;padding:0;margin-top:12px;font-weight:600;cursor:default"},mc.q));
  mc.opts.forEach((o,i)=>{const l=el("label",{},el("input",{type:"radio",name:"mc",value:String(i)}),el("span",{},o));mcBox.append(l);});
  jr.append(mcBox);
  const btn=el("button",{class:"btn pri",type:"button",style:"margin-top:12px;width:100%"},"Natijani tekshirish");
  jr.append(btn);
  btn.onclick=()=>{
    if(ctx.checked)return;
    const empty=fields.filter(f=>f.inp.value==="");
    const mcSel=$("input[name=mc]:checked",mcBox);
    if(empty.length||!mcSel){toast("Barcha maydonlarni to'ldiring va xulosani tanlang");return;}
    // bajarilmagan bosqichlar
    const miss=c.steps.map((s,i)=>(!ctx.stepDone[i]&&!(c.optional||[]).includes(i)&&!(c.noJournalStep===i))?s:null).filter(Boolean);
    let got=0,tot=fields.length+1;
    fields.forEach(f=>{const v=f.type==="sel"?Number(f.inp.value):num(f.inp.value);
      let r;try{r=f.check(v,ctx);}catch(e){r=[false,"tekshirib bo'lmadi"];}
      const [ok,right]=r;if(ok)got++;
      f.fb.className="fb "+(ok?"ok":"no");f.fb.textContent=(ok?"✓ To'g'ri. ":"✗ Noto'g'ri. ")+(right||"");f.inp.disabled=true;});
    const sel=Number(mcSel.value);
    $$("label",mcBox).slice(1).forEach((l,i)=>{if(i===mc.ans)l.classList.add("ok");else if(i===sel)l.classList.add("no");$("input",l).disabled=true;});
    if(sel===mc.ans)got++;
    ctx.checked=true;
    miss.forEach(s=>ctx.errs.push("Bajarilmagan bosqich: «"+s+"»"));
    if(c.extraErrs)c.extraErrs(ctx).forEach(e=>ctx.errs.push(e));
    if(c.after)try{c.after(ctx);}catch(e){}
    const pen=Math.min(0.5,0.08*ctx.errs.length);
    const pct=Math.max(0,Math.round(100*(got/tot)*(1-pen)));
    const best=store.get("best",{});if(best[c.id]==null||pct>best[c.id]){best[c.id]=pct;store.set("best",best);}
    btn.disabled=true;
    const cls=pct>=85?"good":pct>=60?"mid":"low";
    resBox.innerHTML="";
    resBox.append(el("div",{class:"res "+cls},
      el("div",{class:"big"},pct+" %"),
      el("div",{class:"small"},`To'g'ri javoblar: ${got} / ${tot}. Ish tartibidagi xatolar: ${ctx.errs.length}${ctx.errs.length?" (har biri natijani 8 % ga kamaytiradi, ko'pi bilan 50 %)":""}.`),
      ctx.errs.length?el("ul",{class:"small",style:"margin:8px 0 0;padding-left:18px"},...ctx.errs.map(e=>el("li",{},e))):null,
      el("div",{class:"small",style:"margin-top:10px",html:"<b>Izoh.</b> "+mc.why}),
      c.explain?el("div",{class:"small",style:"margin-top:8px",html:c.explain(ctx)}):null,

/* ===== 2-holat: yakka qisqarish va tetanus ===== */
const TET_F=[1,5,10,15,20,30,40,50,100,150];
function tetModel(P,f,dur=2,rec=2.6){
  const dt=0.001,n=Math.round(rec/dt),y=new Float32Array(n);
  const L=P.L/1000,C=P.C/1000,Rr=P.R/1000;
  const tw=t=>{if(t<L)return 0;t-=L;if(t<C)return 0.5*(1-Math.cos(Math.PI*t/C));t-=C;if(t<Rr)return 0.5*(1+Math.cos(Math.PI*t/Rr));return 0;};
  const pulses=[];const iv=1/f;for(let t=0.1;t<0.1+dur-1e-9;t+=iv)pulses.push(t);
  if(f===1)pulses.splice(2);
  const cc=1.958,Ym=50;
  for(let i=0;i<n;i++){const t=i*dt;let S=0;for(let k=0;k<pulses.length;k++){const tp=pulses[k];if(tp>t)break;if(t-tp>L+C+Rr)continue;let w=1;if(f>=100&&tp>0.15)w=0.12;S+=w*tw(t-tp);}y[i]=Ym*(1-Math.exp(-S/cc));}
  // to'lqinlanish (oxirgi 0,6 s)
  let mx=0,mn=1e9;for(let i=Math.round((0.1+dur-0.6)/dt);i<Math.round((0.1+dur)/dt);i++){mx=Math.max(mx,y[i]);mn=Math.min(mn,y[i]);}
  const r=mx>0?(mx-mn)/mx:1;
  let cls=r>0.9?"alohida":r>0.06?"tishli":"silliq";if(f>=100)cls="pessimum";
  return {y,pulses,r,cls,dt};
}

function goryCells(n1){
  const S=520,r=12,cells=[];const kTL=ri(5,8),kBR=ri(5,8),kOut=ri(10,16),kIn=n1-kTL;
  const ok=(x,y)=>cells.every(c=>(c.x-x)**2+(c.y-y)**2>=(2.25*r)**2);
  const classify=(x,y)=>{const m=3,inY=y>=r+m&&y<=S-r-m,inX=x>=r+m&&x<=S-r-m;
    if(inX&&inY)return"in";
    if(Math.abs(x)<=r-m&&inY)return"tl";if(Math.abs(y)<=r-m&&inX)return"tl";
    if(Math.abs(x-S)<=r-m&&inY)return"br";if(Math.abs(y-S)<=r-m&&inX)return"br";
    if((x<=-r-2||x>=S+r+2||y<=-r-2||y>=S+r+2)&&x>-34&&x<S+34&&y>-34&&y<S+34)return"out";return null;};
  const want={in:kIn,tl:kTL,br:kBR,out:kOut},have={in:0,tl:0,br:0,out:0};
  let guard=0;
  while(guard++<200000&&Object.keys(want).some(k=>have[k]<want[k])){
    // kerakli toifaga mos nuqta tanlash
    const need=Object.keys(want).filter(k=>have[k]<want[k]);const k=pick(need);let x,y;
    if(k==="in"){x=rnd(r+3,S-r-3);y=rnd(r+3,S-r-3);}
    else if(k==="tl"||k==="br"){const side=pick([0,1]);const a=rnd(r+3,S-r-3),o=rnd(-(r-3),r-3)+(k==="br"?S:0);if(side){x=o;y=a;}else{x=a;y=o;}}
    else{const side=ri(0,3);const a=rnd(-30,S+30);const o=side<2?rnd(-33,-r-2):rnd(S+r+2,S+33);if(side%2){x=o;y=a;}else{x=a;y=o;}}
    if(classify(x,y)!==k||!ok(x,y))continue;cells.push({x,y,k,id:cells.length,cnt:k==="in"||k==="tl"});have[k]++;}
  return {cells,S,r,true1:cells.filter(c=>c.cnt).length};
}

  o.connect(f);f.connect(g);g.connect(a.destination);o.start(t);o.stop(t+0.2);

  const n=a.createBufferSource(),b=a.createBuffer(1,a.sampleRate*0.03,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
  const gn=a.createGain();gn.gain.value=(muff?0.05:0.18)*vol;const fn=a.createBiquadFilter();fn.type="bandpass";fn.frequency.value=muff?200:600;n.buffer=b;n.connect(fn);fn.connect(gn);gn.connect(a.destination);n.start(t);}

  return v;
}

    function next(){clearTimeout(timer);setLamp(null);spk.textContent="🔈";if(!queue.length){finish();return;}cur=queue.shift();state="wait";
      timer=setTimeout(fire,rnd(1500,4000));}
    function fire(){state="on";t0=performance.now();if(cur==="snd"){beep(1000,0.15,0.35);spk.textContent="🔊";}else setLamp(cur==="white"?"#FFF7C2":cur==="red"?"#FF3B30":"#34C759");
      status.textContent="";if(cur==="green")timer=setTimeout(()=>{state="wait";R.C.push({g:true,ok:true});ctx.msg("Yashil signal — to'g'ri, bosilmadi.");next();},900);
      else timer=setTimeout(()=>{if(state==="on"){ctx.msg("Javob 1,5 s ichida bo'lmadi — urinish takrorlanadi.","pt");queue.unshift(cur);next();}},1500);}
    function press(e){if(e)e.preventDefault();if(state==="idle")return;const now=performance.now();
      if(state==="wait"){R.fs++;ctx.msg("Signal hali bermagan edi — oldindan bosish (fal'start). Urinish qayta beriladi.","err");queue.unshift(cur);next();return;}
      if(state==="on"){const rt=Math.round(now-t0);clearTimeout(timer);
        if(cur==="green"){R.cerr++;R.C.push({g:true,ok:false});ctx.msg("Yashil signalga bosildi — differensirovka xatosi.","err");}
        else{(mode==="L"?R.L:mode==="S"?R.S:R.C).push(mode==="C"?{g:false,rt}:rt);status.textContent=rt+" ms";}
        state="gap";setTimeout(next,700);}}
    function finish(){state="idle";status.textContent="Seriya tugadi";ctx.done(mode==="L"?0:mode==="S"?1:2);showTbl();}
    function showTbl(){tbl.innerHTML="";const row=(nm,arr)=>el("tr",{},el("th",{},nm),...arr.map(v=>el("td",{class:"mono"},String(v))));
      const cr=R.C.filter(x=>!x.g).map(x=>x.rt);
      tbl.append(el("table",{class:"tbl"},R.L.length?row("Yorug'lik, ms",R.L):null,R.S.length?row("Tovush, ms",R.S):null,cr.length?row("Tanlov (qizil), ms",cr):null),
        el("p",{class:"note"},`Tanlov seriyasida yashil signalga bosishlar (xatolar): ${R.C.length?R.cerr:"—"}. O'rtacha qiymatlarni o'zingiz hisoblang.`));}
    key.addEventListener("pointerdown",press);
    const kd=e=>{if(e.code==="Space"&&CUR===ctx){press(e);}};document.addEventListener("keydown",kd);ctx.onClean(()=>{document.removeEventListener("keydown",kd);clearTimeout(timer);});
    ctx.stage.append(el("div",{class:"ctl"},ctlGroup("Seriya",el("button",{class:"btn sm",type:"button",onclick:()=>start("L")},"1. Yorug'lik (10)"),el("button",{class:"btn sm",type:"button",onclick:()=>start("S")},"2. Tovush (10)"),el("button",{class:"btn sm",type:"button",onclick:()=>start("C")},"3. Tanlov (15)"))),tbl,
      el("p",{class:"note"},"Brauzer va ekran o'zining kechikishini (10–40 ms) qo'shadi, shuning uchun natija laboratoriya asbobidagidan biroz uzunroq chiqishi mumkin."));
  },
  journal:ctx=>{const R=ctx.rec;const m=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:NaN;const cr=()=>R.C.filter(x=>!x.g).map(x=>x.rt);return[
    {id:"l",label:"Yorug'likka o'rtacha reaksiya vaqti",unit:"ms",check:v=>[R.L.length===10&&near(v,m(R.L),5),R.L.length?"O'rtacha: "+Math.round(m(R.L))+" ms":"Seriya bajarilmagan"]},
    {id:"s",label:"Tovushga o'rtacha reaksiya vaqti",unit:"ms",check:v=>[R.S.length===10&&near(v,m(R.S),5),R.S.length?"O'rtacha: "+Math.round(m(R.S))+" ms":"Seriya bajarilmagan"]},
    {id:"c",label:"Tanlov reaksiyasining o'rtacha vaqti (qizil signallar)",unit:"ms",check:v=>[cr().length>0&&near(v,m(cr()),5),cr().length?"O'rtacha: "+Math.round(m(cr()))+" ms":"Seriya bajarilmagan"]},
    {id:"e",label:"Tanlov seriyasidagi differensirovka xatolari soni",unit:"ta",check:v=>[R.C.length>0&&v===R.cerr,"Xatolar: "+R.cerr]}];},
  mc:()=>({q:"Nima uchun tanlov reaksiyasi vaqti oddiy reaksiyadan uzun?",opts:["Po'stloqda signallarni farqlash (differensirovka — ichki tormozlanish) va javobni tanlash qo'shimcha markaziy vaqt talab qiladi","Qizil chiroq ko'zning retseptorlariga sekinroq ta'sir qiladi","Tanlov reaksiyasida muskullar charchagan bo'ladi","Reflektor yoyning efferent qismi uzunroq bo'ladi"],ans:0,
    why:"Reaksiya vaqtining asosiy qismi markaziy kechikish — signalni idrok etish, tahlil qilish va harakat dasturini tanlash. Oddiy reaksiya me'yorda yorug'likka ≈ 180–220 ms, tovushga ≈ 140–180 ms (eshitish yo'li qisqa va tez). Tanlov reaksiyasida ikki signalni farqlash (differensirovka) va javobni tormozlash kerak — vaqt uzayadi, xatolar ONF tipi, charchoq va diqqatga bog'liq."}),
  explain:ctx=>{const R=ctx.rec;return `Fal'startlar soni: ${R.fs}.`;}
});

window.addEventListener("hashchange",route);
try{const th=localStorage.getItem("tq:theme");}catch(e){}
route();
window.__cur=()=>CUR;

</script>
