        inp.onchange=()=>{
          $$("label",mcb).forEach((l,k)=>{if(k===opt.ask.ans)l.classList.add("ok");else if(k===i)l.classList.add("no");$("input",l).disabled=true;});
          if(i!==opt.ask.ans)ctx.err("Immunoblot natijasi noto'g'ri baholandi");else ctx.ok("Immunoblot to'g'ri talqin qilindi.");
          mcb.append(el("div",{class:"why",html:md(opt.ask.why)}));
          ctx.done(base+1);setTimeout(next,320);};});
      g.append(mcb);box.append(g);};
  }};}

/* ---------- OT-PZR (real vaqt rejimida) ---------- */
/* opt:{target, ct, ic, neg:false, ask} */
function pcrInst(opt){
  return {steps:[`Namunadan nuklein kislotani ajratib olish`,
                 `Reaksiya aralashmasini tayyorlash va nazoratlarni qo'yish`,
                 `Amplifikatsiya va egri chiziqlarni o'qish`,
                 `Ct bo'yicha natijani talqin qilish`],
  doing:"OT-PZR qo'yamiz. Virus RNK si teskari transkriptaza bilan DNK ga o'giriladi, so'ng har siklda ikki baravar ko'payadi; flyuoressensiya chegaradan o'tgan sikl raqami (Ct) boshlang'ich nusxa soniga teskari proporsional.",
  mount(ctx,box,base,next){
    const st={ext:false,mix:false,ctrl:0,run:false};
    box.append(el("h3",{},"Real vaqt rejimidagi OT-PZR"));
    const holder=el("div");box.append(holder);
    const curves=()=>{
      const W=420,H=230;let s=`<rect width="${W}" height="${H}" fill="#0E1512"/>`;
      s+=`<line x1="46" y1="12" x2="46" y2="190" stroke="#3A4A46" stroke-width="1.5"/>`;
      s+=`<line x1="46" y1="190" x2="404" y2="190" stroke="#3A4A46" stroke-width="1.5"/>`;
      for(let c=0;c<=40;c+=10)s+=`<text x="${46+c*8.9}" y="206" font-size="10" fill="#7E948F" text-anchor="middle">${c}</text>`;
      s+=`<text x="225" y="222" font-size="10.5" fill="#7E948F" text-anchor="middle">sikl</text>`;
      s+=`<text x="16" y="100" font-size="10.5" fill="#7E948F" transform="rotate(-90 16,100)" text-anchor="middle">flyuoressensiya</text>`;
      s+=`<line x1="46" y1="130" x2="404" y2="130" stroke="#C8372D" stroke-width="1.2" stroke-dasharray="5 4"/>`;
      s+=`<text x="398" y="126" font-size="9.5" fill="#C8372D" text-anchor="end">chegara</text>`;
      if(!st.run)return svgEl(s,W,H);
      const curve=(ct,col,lbl,dash)=>{
        if(ct==null)return "";
        let d="";
        for(let c=0;c<=40;c++){
          const x=46+c*8.9;
          const y=190-168/(1+Math.exp(-(c-ct-3.2)/2.1));
          d+=(c?"L":"M")+x.toFixed(1)+","+y.toFixed(1);}
        return `<path d="${d}" fill="none" stroke="${col}" stroke-width="2.2" ${dash?'stroke-dasharray="4 3"':""}/>`
          +`<text x="${(46+(ct+6)*8.9).toFixed(0)}" y="${lbl==="IC"?"60":"44"}" font-size="10" fill="${col}">${lbl}${ct?" Ct "+ct.toFixed(1):""}</text>`;};
      s+=curve(opt.neg?null:opt.ct,"#5FC0AF",opt.target);
      s+=curve(opt.ic??28,"#E3B651","IC",true);
      s+=curve(18,"#6FA8E3","K+",true);
      if(opt.neg)s+=`<text x="225" y="100" font-size="12" fill="#8FA5A0" text-anchor="middle">bemor namunasi: chegaradan o'tmadi</text>`;
      return svgEl(s,W,H);};
    const redraw=()=>{holder.innerHTML="";holder.append(curves());};redraw();
    const bExt=el("button",{class:"btn sm",type:"button"},"Nuklein kislotani ajratib olish");
    const bMix=el("button",{class:"btn sm",type:"button",disabled:true},"Reaksiya aralashmasi + praymer/zond");
    const bCtrl=el("button",{class:"btn sm",type:"button",disabled:true},"Nazoratlarni qo'yish (K+, K−, IC)");
    const bRun=el("button",{class:"btn sm pri",type:"button",disabled:true},"Amplifikatsiyani boshlash (40 sikl)");
    box.append(el("div",{class:"ctl"},bExt,bMix),el("div",{class:"ctl"},bCtrl,bRun));
    bExt.onclick=()=>{st.ext=true;bExt.disabled=true;bMix.disabled=false;
      ctx.info("Namunadan RNK ajratib olindi (ichki nazorat namunaga ajratishdan oldin qo'shildi).");ctx.done(base);};
    bMix.onclick=()=>{st.mix=true;bMix.disabled=true;bCtrl.disabled=false;
      ctx.info("Mastermiks, teskari transkriptaza, praymerlar va flyuoressent zond qo'shildi.");};
    bCtrl.onclick=()=>{st.ctrl=1;bCtrl.disabled=true;bRun.disabled=false;
      ctx.ok("Musbat (K+), manfiy (K−) va ichki nazorat (IC) qo'yildi.");ctx.done(base+1);};
    bRun.onclick=()=>{
      if(!st.ctrl)ctx.err("Nazoratlarsiz ishga tushirildi: natijaning ishonchliligini baholab bo'lmaydi");
      bRun.disabled=true;
      const T=timerBox(ctx,{label:"Amplifikatsiya",target:45,speed:10});
      box.append(el("div",{class:"ctl"},T.el));
      T.onStop=()=>{st.run=true;redraw();ctx.done(base+2);
        ctx.msg(`<b>K+</b> Ct 18,0 · <b>K−</b> signal yo'q · <b>IC</b> Ct ${fx(opt.ic??28,1)}`);
        ctx.msg(opt.neg?`<b>Bemor namunasi:</b> ${opt.target} — signal yo'q`
          :`<b>Bemor namunasi:</b> ${opt.target} — Ct = ${fx(opt.ct,1)}`);
        ctx.rec.pcr={ct:opt.neg?null:opt.ct};
        ask();};
      T.start();
      const iv=setInterval(()=>{if(T.reached&&!T.stopped){clearInterval(iv);T.stop();}},300);
      ctx.onClean(()=>clearInterval(iv));};
    function ask(){
      const g=el("div",{class:"gate",style:"margin-top:10px"});
      g.append(el("div",{class:"q",html:md(opt.ask.q)}));
      const mcb=el("div",{class:"mc",style:"margin-top:4px"});
      opt.ask.opts.forEach((o,i)=>{
        const inp=el("input",{type:"radio",name:"pc"+base,value:String(i)});
        mcb.append(el("label",{},inp,el("span",{html:md(o)})));
        inp.onchange=()=>{
          $$("label",mcb).forEach((l,k)=>{if(k===opt.ask.ans)l.classList.add("ok");else if(k===i)l.classList.add("no");$("input",l).disabled=true;});
          if(i!==opt.ask.ans)ctx.err("PZR natijasi noto'g'ri talqin qilindi");else ctx.ok("PZR natijasi to'g'ri talqin qilindi.");
          mcb.append(el("div",{class:"why",html:md(opt.ask.why)}));
          ctx.done(base+3);setTimeout(next,320);};});
      g.append(mcb);box.append(g);}
  }};}

/* ---------- Agglyutinatsiya (Vidal / buyum oynasida serotiplash) ---------- */
/* opt:{kind:"tube"|"slide", rows:[{n,titer,dil:[...]}], ask} */
function aggInst(opt){
  return {steps:[opt.kind==="slide"?`Diagnostik zardoblar bilan buyum oynasida agglyutinatsiya`:`Ketma-ket suyultirish va agglyutinatsiya reaksiyasini qo'yish`,
                 `Titrni aniqlash va talqin qilish`],
  doing:opt.doing||"Serologik identifikatsiya qilamiz: ma'lum antigen (diagnostikum) yoki ma'lum antitelo (diagnostik zardob) bilan juftini aniqlaymiz. Agglyutinatsiya — zarrachalarning bog'lanib cho'kishi.",
  mount(ctx,box,base,next){
    box.append(el("h3",{},opt.kind==="slide"?"Buyum oynasida agglyutinatsiya":"Vidal reaksiyasi (probirkada)"));
    if(opt.ref)box.append(photo(opt.ref,opt.refCap));
    const holder=el("div");box.append(holder);
    let run=false;
    const dils=opt.dils||["1:50","1:100","1:200","1:400","1:800","1:1600","NZ"];
    const draw=()=>{
      if(opt.kind==="slide"){

/* opt:{thickKey,thinKey,ask,ask2,count:{target,why}} */
function filmInst(opt){
  return {steps:[`Qalin tomchi va yupqa surtma tayyorlash`,
                 `Romanovskiy–Gimza bilan bo'yash`,
                 `Mikroskopiya: parazitni topish va turini aniqlash`,
                 `Parazitemiya darajasini hisoblash`],
  doing:"Bezgak tashxisining oltin standarti — qalin tomchi va yupqa surtma. Qalin tomchi parazitni **topish** uchun (eritrotsitlar gemolizlanadi, ko'p qon ko'riladi), yupqa surtma esa **turini aniqlash** uchun kerak (hujayra tuzilishi saqlanadi).",
  mount(ctx,box,base,next){
    const st={thick:false,thin:false,fixErr:false,stained:false};
    box.append(el("h3",{},"Qalin tomchi va yupqa surtma"));
    const info=el("div",{class:"small muted",style:"margin-bottom:8px"},
      "Barmoq uchidan olingan qondan ikkita preparat tayyorlanadi.");
    box.append(info);
    const b1=el("button",{class:"btn sm",type:"button"},"Qalin tomchi tayyorlash");
    const b2=el("button",{class:"btn sm",type:"button"},"Yupqa surtma tayyorlash");
    box.append(el("div",{class:"ctl"},b1,b2));
    const fixRow=el("div",{class:"ctl",hidden:true});box.append(fixRow);
    const bFixThin=el("button",{class:"btn sm",type:"button"},"Yupqa surtmani metanol bilan fiksatsiya qilish");
    const bFixThick=el("button",{class:"btn sm",type:"button"},"Qalin tomchini metanol bilan fiksatsiya qilish");
    fixRow.append(bFixThin,bFixThick);
    b1.onclick=()=>{st.thick=true;b1.disabled=true;ctx.info("Qalin tomchi: 2–3 tomchi qon oyna ustida tanga kattaligida yoyildi va quritildi.");chk();};
    b2.onclick=()=>{st.thin=true;b2.disabled=true;ctx.info("Yupqa surtma: shlifli oyna bilan 45° burchak ostida bir qavatli surtma tayyorlandi.");chk();};
    function chk(){if(st.thick&&st.thin){ctx.done(base);fixRow.hidden=false;}}
    bFixThin.onclick=()=>{bFixThin.disabled=true;ctx.ok("Yupqa surtma metanol bilan fiksatsiya qilindi — eritrotsitlar saqlanadi, turini aniqlash mumkin.");stainOn();};
    bFixThick.onclick=()=>{bFixThick.disabled=true;st.fixErr=true;
      ctx.err("Qalin tomchi fiksatsiya qilindi: eritrotsitlar gemolizlanmaydi va bo'yalgan fon parazitni berkitadi — qalin tomchi hech qachon fiksatsiya qilinmaydi");};
    function stainOn(){stBox.hidden=false;}
    const stBox=el("div",{hidden:true,style:"margin-top:10px"});box.append(stBox);
    const bStain=el("button",{class:"btn sm pri",type:"button"},"Romanovskiy–Gimza bilan 30–45 daq bo'yash");
    stBox.append(el("div",{class:"ctl"},bStain));
    bStain.onclick=()=>{bStain.disabled=true;st.stained=true;ctx.done(base+1);
      ctx.ok("Ikkala preparat Gimza bo'yog'i bilan bo'yaldi: parazit yadrosi qizil-binafsha, sitoplazmasi ko'k.");
      mic();};
    function mic(){
      const wrap=el("div",{style:"margin-top:12px"});box.append(wrap);
      wrap.append(el("h3",{},"Mikroskopiya"));
      const tabs=el("div",{class:"chips"});
      const area=el("div",{style:"margin-top:8px"});
      /* ikkala preparat bir marta yaratiladi va yashirib-ko'rsatiladi —
         shunda almashganda moy va ob'ektiv holati saqlanadi */
      const views={};
      const mk=which=>{
        const M=microscope(ctx,{key:which==="thick"?opt.thickKey:opt.thinKey,
          hint:which==="thick"?"Qalin tomchi: parazitni qidiring":"Yupqa surtma: eritrotsit ichidagi shakllarni ko'ring",
          onObj(o,oiled){if(o===100&&oiled&&!ctx.isDone(base+2)){ctx.done(base+2);askQ();}}});
        area.append(M.el);return M;};
      const show=which=>{
        if(!views[which])views[which]=mk(which);
        Object.keys(views).forEach(k=>views[k].el.hidden=(k!==which));};
      [["thick","Qalin tomchi"],["thin","Yupqa surtma"]].forEach(([k,n],i)=>{
        const b=el("button",{class:"chip"+(i===0?" on":""),type:"button"},n);
        b.onclick=()=>{$$(".chip",tabs).forEach(x=>x.classList.remove("on"));b.classList.add("on");show(k);};
        tabs.append(b);});
      wrap.append(tabs,area);show("thick");
      let asked=false;
      function askQ(){
        if(asked)return;asked=true;
        const qs=[opt.ask,opt.ask2].filter(Boolean);let qi=0;
        const put=()=>{
          if(qi>=qs.length){doCount();return;}
          const q=qs[qi++];
          const g=el("div",{class:"gate",style:"margin-top:10px"});
          g.append(el("div",{class:"q",html:md(q.q)}));
          const mcb=el("div",{class:"mc",style:"margin-top:4px"});
          q.opts.forEach((o,i)=>{
            const inp=el("input",{type:"radio",name:"fl"+base+"_"+qi,value:String(i)});
            mcb.append(el("label",{},inp,el("span",{html:md(o)})));
            inp.onchange=()=>{
              $$("label",mcb).forEach((l,k)=>{if(k===q.ans)l.classList.add("ok");else if(k===i)l.classList.add("no");$("input",l).disabled=true;});
              if(i!==q.ans)ctx.err("Mikroskopik manzara noto'g'ri baholandi");else ctx.ok(q.okMsg||"To'g'ri aniqlandi.");
              mcb.append(el("div",{class:"why",html:md(q.why)}));
              setTimeout(put,300);};});
          g.append(mcb);wrap.append(g);};
        put();}
      function doCount(){
        if(!opt.count){ctx.done(base+3);setTimeout(next,300);return;}
        const g=el("div",{class:"gate",style:"margin-top:10px"});
        g.append(el("div",{class:"q",html:md(opt.count.q)}));
        const inp=el("input",{inputmode:"decimal",placeholder:"%",style:"min-height:40px;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface);max-width:150px;font-family:var(--f-mono)"});
        const b=el("button",{class:"btn sm pri",type:"button"},"Hisoblash");
        const fb=el("div",{class:"fb small",style:"margin-top:6px"});
        g.append(el("div",{class:"ctl"},inp,el("span",{class:"u small muted"},"%"),b),fb);
        wrap.append(g);
        b.onclick=()=>{const v=num(inp.value);if(!Number.isFinite(v)){toast("Son kiriting");return;}
          const okq=near(v,opt.count.target,0.25,0.3);
          if(!okq)ctx.err("Parazitemiya noto'g'ri hisoblandi");else ctx.ok("Parazitemiya to'g'ri hisoblandi.");
          fb.className="fb small "+(okq?"ok":"no");
          fb.innerHTML=(okq?"✓ To'g'ri. ":"✗ Noto'g'ri. ")+md(opt.count.why);
          inp.disabled=b.disabled=true;ctx.rec.parasitemia=opt.count.target;
          ctx.done(base+3);setTimeout(next,350);};}
    }
  }};}

  return {steps:ST,
  doing:opt.doing||"Immunogramma — immunitet tizimining asosiy bo'g'inlarini birdaniga baholaydigan tahlil: hujayraviy (T-, B-, NK-hujayralar, CD-markyorlar), gumoral (immunoglobulinlar) va fagotsitar bo'g'in.",
  mount(ctx,box,base,next){

    b.onclick=()=>{b.disabled=true;ctx.done(base);
      area.append(table(["Ko'rsatkich","Natija","Me'yor"],opt.rows.map(r=>
        [r[0],{h:r[1],cls:r[3]||""},r[2]])));
      opt.rows.filter(r=>r[3]).forEach(r=>ctx.msg(`<b>${r[0]}:</b> ${r[1]} (me'yor ${r[2]})`));
      ctx.rec.immuno=opt.rows;
      let qi=0;
      const put=()=>{
        if(qi>=opt.asks.length){ctx.done(base+1);setTimeout(next,300);return;}
        const q=opt.asks[qi++];
        const g=el("div",{class:"gate",style:"margin-top:10px"});
        g.append(el("div",{class:"q",html:md(q.q)}));
        const mcb=el("div",{class:"mc",style:"margin-top:4px"});
        q.opts.forEach((o,i)=>{
          const inp=el("input",{type:"radio",name:"im"+base+"_"+qi,value:String(i)});
          mcb.append(el("label",{},inp,el("span",{html:md(o)})));
          inp.onchange=()=>{
            $$("label",mcb).forEach((l,k)=>{if(k===q.ans)l.classList.add("ok");else if(k===i)l.classList.add("no");$("input",l).disabled=true;});
            if(i!==q.ans)ctx.err("Immunogramma noto'g'ri talqin qilindi");else ctx.ok("To'g'ri talqin qilindi.");
            mcb.append(el("div",{class:"why",html:md(q.why)}));
            setTimeout(put,300);};});
        g.append(mcb);area.append(g);};
      put();};
  }};}
