<!doctype html>
<html lang="uz"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mikrobiologiya laboratoriyasi</title>
<meta name="description" content="Mikrobiologiya, virusologiya va immunologiya: 20 ta laboratoriya-klinik holat — bemor va nazariya, bo'yash va mikroskopiya, ekish, identifikatsiya, antibiotikogramma va serologik tasdiq">
<style>
:root{
  --bg:#EEF3F2; --surface:#FFFFFF; --sunk:#E1EAE8; --ink:#12201D; --muted:#556966; --line:#C9D7D4;
  --accent:#246B61; --accent-soft:#D7EAE6; --on-accent:#FFFFFF;
  --bad:#B03A32; --bad-soft:#F7E1DE; --good:#2A7A4A; --good-soft:#DDF0E3; --warn:#8A6200; --warn-soft:#F6ECD2;
  --info:#1F5FA0; --info-soft:#DCE8F5;
  --bench:#D7DEDC; --bench2:#C5D0CD;
  --f-display:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  --f-mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1513; --surface:#17211F; --sunk:#0B110F; --ink:#E1EBE8; --muted:#92A6A2; --line:#2A3A37;
  --accent:#5FC0AF; --accent-soft:#163029; --on-accent:#04140F;
  --bad:#EA8A80; --bad-soft:#3A1F1C; --good:#73C99A; --good-soft:#163222; --warn:#E3B651; --warn-soft:#352A12;
  --info:#6FA8E3; --info-soft:#193049;
  --bench:#232E2C; --bench2:#1B2524; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1513; --surface:#17211F; --sunk:#0B110F; --ink:#E1EBE8; --muted:#92A6A2; --line:#2A3A37;
  --accent:#5FC0AF; --accent-soft:#163029; --on-accent:#04140F;
  --bad:#EA8A80; --bad-soft:#3A1F1C; --good:#73C99A; --good-soft:#163222; --warn:#E3B651; --warn-soft:#352A12;
  --info:#6FA8E3; --info-soft:#193049;
  --bench:#232E2C; --bench2:#1B2524; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.55;
  -webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--f-display);line-height:1.18;margin:0;text-wrap:balance}
h1{font-size:clamp(1.5rem,4vw,2.1rem);font-weight:750}
h2{font-size:1.26rem;font-weight:750}
h3{font-size:1rem;font-weight:650}
p{margin:0}
sub,sup{line-height:0}
i.sp{font-style:italic}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:14px max(14px,env(safe-area-inset-left,0px)) 44px max(14px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono)}
.small{font-size:.86rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:7px 14px;border-radius:9px;
  border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:.93rem;line-height:1.2;text-align:center}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.sm{min-height:36px;padding:5px 10px;font-size:.86rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.on{background:var(--accent-soft);border-color:var(--accent);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}

/* ---------- bosh sahifa ---------- */
.hero{padding:6px 0 12px}
.hero p{max-width:800px;margin-top:6px}
.flow{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.flow span{font-size:.82rem;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:3px 11px}
.grp{margin-top:20px}
.grp h2{font-size:1rem;margin-bottom:8px;color:var(--muted);font-family:var(--f-body);font-weight:600;
  text-transform:uppercase;letter-spacing:.04em}
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(282px,1fr));gap:10px}
.case{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:12px;width:100%}
.case:hover{border-color:var(--accent)}
.case .no{flex:0 0 auto;width:38px;height:38px;border-radius:9px;background:var(--accent-soft);color:var(--accent);
  display:grid;place-items:center;font-weight:700;font-family:var(--f-mono)}
.case .t{font-weight:600;line-height:1.3}
.case .s{font-size:.84rem;color:var(--muted);margin-top:3px;line-height:1.35}
.case .tp{font-size:.76rem;color:var(--muted);margin-top:4px;font-family:var(--f-mono)}
.case .sc{font-size:.8rem;margin-top:5px;font-weight:600}
.case .sc.ok{color:var(--good)} .case .sc.mid{color:var(--warn)}

/* ---------- holat sahifasi ---------- */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.top h1{font-size:clamp(1.1rem,3vw,1.5rem);flex:1 1 260px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{flex:1 1 150px;display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:9px;border:1px solid var(--line);
  background:var(--surface);font-size:.9rem;text-align:left;min-height:46px}
.tab b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--sunk);
  font-size:.8rem;flex:0 0 auto}
.tab.cur{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.tab.cur b{background:var(--accent);color:var(--on-accent)}
.tab.ok b{background:var(--good);color:#fff}
.tab:disabled{opacity:.5;cursor:not-allowed}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;max-width:920px}
.sheet h2{margin:2px 0 10px}
.sheet h3{margin:16px 0 6px;color:var(--accent)}
.sheet p{margin:6px 0}
.sheet ul,.sheet ol{margin:6px 0;padding-left:21px}
.sheet li{margin:3px 0}
.pt-grid{display:grid;grid-template-columns:138px 1fr;gap:4px 12px;font-size:.93rem}
.pt-grid dt{color:var(--muted);font-weight:500}
.pt-grid dd{margin:0}
@media (max-width:560px){.pt-grid{grid-template-columns:1fr}.pt-grid dt{margin-top:7px}}
.task{background:var(--info-soft);border-radius:9px;padding:10px 13px;margin-top:12px}
.task b{color:var(--info)}
.eq{font-family:var(--f-mono);font-size:.85rem;background:var(--sunk);border-radius:8px;padding:8px 10px;margin:6px 0;
  overflow-x:auto;white-space:pre-wrap;line-height:1.5}
.tip{border-left:4px solid var(--warn);background:var(--warn-soft);padding:8px 12px;border-radius:0 8px 8px 0;margin:10px 0;font-size:.92rem}
.gate{margin-top:14px;padding:12px 13px;border-radius:9px;border:1px dashed var(--accent);background:var(--accent-soft)}
.next-bar{display:flex;justify-content:flex-end;margin-top:12px;gap:8px;flex-wrap:wrap}

/* ---------- rasm (haqiqiy mikrofotosurat) ---------- */
.ph{margin:10px 0;border:1px solid var(--line);border-radius:9px;background:var(--surface);overflow:hidden}
.ph img{display:block;width:100%;height:auto;background:#0d0d0d}
.ph .cap{font-size:.79rem;color:var(--muted);padding:6px 10px;border-top:1px solid var(--line);line-height:1.4}
.ph .src{font-size:.72rem;opacity:.85}
.ph2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:620px){.ph2{grid-template-columns:1fr}}
.kit{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px;margin:8px 0}
.kit .it{border:1px solid var(--line);border-radius:9px;padding:8px;background:var(--sunk);font-size:.84rem;line-height:1.35}
.kit .it b{display:block;font-size:.88rem;margin-bottom:2px}

/* ---------- laboratoriya ---------- */
.lay{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px;align-items:start}
@media (max-width:980px){.lay{grid-template-columns:minmax(0,1fr)}}
.stage{background:linear-gradient(180deg,var(--bench),var(--bench2));border:1px solid var(--line);border-radius:var(--r);
  padding:12px;min-width:0}
.stage h3{margin:0 0 8px}
.stage .sv{display:block;width:100%;height:auto;background:#F4F6F5;border-radius:8px;border:1px solid #B7C2BF}
.panel{display:flex;flex-direction:column;gap:12px;min-width:0}
.steps ol{margin:6px 0 0;padding:0;list-style:none;counter-reset:s}
.steps li{position:relative;padding:5px 0 5px 31px;font-size:.88rem;line-height:1.35;counter-increment:s}
.steps li::before{content:counter(s);position:absolute;left:0;top:4px;width:23px;height:23px;border-radius:50%;
  border:1.5px solid var(--line);display:grid;place-items:center;font-size:.74rem;font-weight:600;color:var(--muted)}
.steps li.cur::before{border-color:var(--accent);color:var(--accent)}
.steps li.cur{font-weight:600}
.steps li.done{color:var(--muted)}
.steps li.done::before{content:"\2713";background:var(--good);border-color:var(--good);color:#fff}
.log{max-height:240px;overflow:auto;font-size:.86rem;display:flex;flex-direction:column;gap:5px}
.log div{padding:6px 9px;border-radius:7px;background:var(--sunk);line-height:1.38}
.log .err{background:var(--bad-soft);color:var(--bad)}
.log .ok{background:var(--good-soft);color:var(--good)}
.log .pt{background:var(--warn-soft)}
.why{font-size:.85rem;margin-top:6px;padding:8px 10px;border-radius:8px;background:var(--sunk);line-height:1.4}
.why b{color:var(--accent)}
.doing{background:var(--info-soft);border-radius:8px;padding:8px 11px;margin:0 0 9px;font-size:.88rem;line-height:1.4}
.doing b{color:var(--info)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.ctl .grpc{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--line);
  border-radius:9px;padding:6px 8px}
.ctl .lbl{font-size:.8rem;color:var(--muted);font-weight:600;margin-right:2px}
.stp{display:inline-flex;align-items:center;gap:4px}
.stp .v{min-width:86px;text-align:center;font-family:var(--f-mono);font-weight:600;background:#10180F;color:#7CFF9A;
  border-radius:6px;padding:5px 8px;font-size:.94rem}
.stp button{min-width:38px;min-height:36px;border-radius:7px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:.86rem;min-height:38px}
.chip.on{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.chip.dim{opacity:.5}
.clock{font-family:var(--f-mono);font-weight:600;background:#111;color:#FFB347;border-radius:6px;padding:5px 9px;
  min-width:84px;text-align:center}
.lcd{font-family:var(--f-mono);background:#C9D7B5;color:#1D2A12;border-radius:6px;padding:8px 10px;font-size:.84rem;
  line-height:1.45;min-height:64px;border:2px solid #7E8B6C;white-space:pre-wrap;overflow-x:auto}
.note{font-size:.84rem;color:var(--muted);margin-top:8px;line-height:1.4}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;
  border-radius:9px;font-size:.9rem;z-index:50;max-width:min(92vw,520px);text-align:center}

/* ---------- mikroskop ---------- */
.scope{background:#11161A;border-radius:10px;padding:10px;border:1px solid #2A343A}
.field{position:relative;width:100%;aspect-ratio:1/1;max-height:460px;margin:0 auto;border-radius:50%;overflow:hidden;
  background:#05070A;box-shadow:inset 0 0 40px rgba(0,0,0,.85)}
.field img{position:absolute;left:50%;top:50%;transform-origin:center;will-change:transform;
  image-rendering:auto;user-select:none;-webkit-user-drag:none}
.field .vig{position:absolute;inset:0;border-radius:50%;pointer-events:none;
  box-shadow:inset 0 0 44px 14px rgba(0,0,0,.72)}
.field .blur{position:absolute;inset:0;backdrop-filter:blur(var(--bl,0px));pointer-events:none;border-radius:50%}
.field .hint{position:absolute;left:0;right:0;bottom:12px;text-align:center;color:#9FB3AE;font-size:.8rem;
  pointer-events:none;text-shadow:0 1px 3px #000}
.field.drag{cursor:grab;touch-action:none}
.scope .bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:9px;color:#CFE0DC;font-size:.84rem}
.scope .bar .lbl{color:#8FA5A0;font-weight:600}
.obj{display:flex;gap:5px;flex-wrap:wrap}
.obj button{min-height:36px;padding:5px 9px;border-radius:7px;border:1px solid #39474D;background:#1B2328;color:#CFE0DC;
  font-size:.84rem;font-weight:600}
.obj button.on{background:#2E6F63;border-color:#49A392;color:#fff}
.obj button.oil{border-style:dashed}

/* ---------- jadval ---------- */
.tbl{border-collapse:collapse;font-size:.86rem;width:100%}
.tbl td,.tbl th{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
.tbl th{background:var(--sunk);font-weight:600}
.tbl td.hi{color:var(--bad);font-weight:600}
.tbl td.lo{color:var(--info);font-weight:600}
.tbl td.pos{color:var(--good);font-weight:600}
.tblw{overflow-x:auto;-webkit-overflow-scrolling:touch}
svg text{font-family:var(--f-body)}
.clk{cursor:pointer}
.clk:hover{filter:brightness(1.08)}
.sel-ring{stroke:#F2B705!important;stroke-width:3!important}

/* ---------- bayonnoma / natija ---------- */
.jr label{display:block;font-size:.88rem;margin:9px 0 3px;font-weight:500;line-height:1.3}
.jr .inp{display:flex;gap:6px;align-items:center}
.jr input,.jr select{width:100%;min-height:40px;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.jr input{max-width:170px;font-family:var(--f-mono)}
.jr .u{font-size:.85rem;color:var(--muted);white-space:nowrap}
.jr .fb{font-size:.82rem;margin-top:3px;line-height:1.35}
.jr .fb.ok{color:var(--good)} .jr .fb.no{color:var(--bad)}
.mc{margin-top:14px}
.mc .q{font-weight:600;margin-bottom:4px;line-height:1.35}
.mc label{display:flex;gap:8px;align-items:flex-start;font-weight:400;margin:6px 0;padding:8px 9px;border:1px solid var(--line);
  border-radius:8px;cursor:pointer;font-size:.92rem;line-height:1.35}
.mc input{width:auto;min-height:0;margin-top:3px}
.mc label.ok{border-color:var(--good);background:var(--good-soft)}
.mc label.no{border-color:var(--bad);background:var(--bad-soft)}
.res{border-radius:var(--r);padding:12px 14px;border:1px solid var(--line);background:var(--surface)}
.res .big{font-family:var(--f-display);font-size:1.6rem;font-weight:800}
.res.good{border-color:var(--good)} .res.mid{border-color:var(--warn)} .res.low{border-color:var(--bad)}
.dx{border-left:4px solid var(--accent);background:var(--accent-soft);padding:10px 13px;border-radius:0 9px 9px 0;margin:10px 0}
.dx b{color:var(--accent)}
</style>
</head><body>
<div class="wrap" id="app"></div>
<script>
"use strict";
/* ===== Yordamchilar ===== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const NS="http://www.w3.org/2000/svg";
function el(tag,attrs={},...kids){const e=document.createElement(tag);
  for(const k in attrs){if(k==="html")e.innerHTML=attrs[k];
    else if(k.startsWith("on"))e.addEventListener(k.slice(2),attrs[k]);
    else if(attrs[k]!==false&&attrs[k]!=null)e.setAttribute(k,attrs[k]===true?"":attrs[k]);}
  for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(c));}
  return e;}
function svgEl(html,w,h,cls="sv"){const d=document.createElement("div");
  d.innerHTML=`<svg xmlns="${NS}" viewBox="0 0 ${w} ${h}" class="${cls}">${html}</svg>`;return d.firstChild;}
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const r1=(x,d=1)=>Math.round(x*10**d)/10**d;
const fx=(x,d=1)=>(+x).toFixed(d).replace(".",",");
const num=s=>{if(s==null)return NaN;s=String(s).trim().replace(/\s/g,"").replace(",",".");if(s==="")return NaN;return Number(s);};
const near=(v,t,rel=0.03,abs=0)=>Number.isFinite(v)&&Math.abs(v-t)<=Math.max(Math.abs(t)*rel,abs);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const md=s=>String(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/__(.+?)__/g,'<i class="sp">$1</i>');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const mmss=t=>{t=Math.max(0,Math.floor(t));return String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0");};
function toast(t){const o=$(".toast");if(o)o.remove();const d=el("div",{class:"toast"},t);document.body.append(d);setTimeout(()=>d.remove(),2800);}
const store={get(k,d){try{const v=localStorage.getItem("tq:mkb:"+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},
  set(k,v){try{localStorage.setItem("tq:mkb:"+k,JSON.stringify(v));}catch(e){}}};

/* ===== Rasmlar ===== */
/* IMG — generatsiya qilingan ro'yxat (img.js): kalit -> {f,cap,src,page} */
const IMGDIR="../data/img/mkbsim/", IMGDIR_BOOK="../data/img/mkb/";
/* r.d==="kitob" — qo'llanmaning o'z rasmi (data/img/mkb/) */
const srcOf=r=>(r.d==="kitob"?IMGDIR_BOOK:IMGDIR)+r.f;
function imgSrc(k){const r=IMG[k];return r?srcOf(r):"";}
/* Haqiqiy mikrofotosurat / plastinka rasmi */
function photo(k,cap,opt={}){
  const r=IMG[k];
  const box=el("figure",{class:"ph",style:"margin:10px 0"});
  if(!r){box.append(el("div",{class:"cap"},"[rasm topilmadi: "+k+"]"));return box;}
  const im=el("img",{src:srcOf(r),alt:cap||r.cap||"",loading:"lazy",decoding:"async"});
  if(opt.h)im.style.maxHeight=opt.h+"px",im.style.objectFit="cover";
  box.append(im);
  box.append(el("figcaption",{class:"cap",html:md(cap||r.cap||"")+(r.src?` <span class="src">${esc(r.src)}</span>`:"")}));
  return box;}
function photoPair(a,b,ca,cb){return el("div",{class:"ph2"},photo(a,ca),photo(b,cb));}
/* Jihozlar / reaktivlar ro'yxati */
function kit(items){
  return el("div",{class:"kit"},...items.map(i=>el("div",{class:"it",html:`<b>${esc(i.n)}</b>${md(i.d||"")}`})));}

/* ===== Umumiy UI bo'laklari ===== */
function ctlGroup(label,...kids){return el("div",{class:"grpc"},label?el("span",{class:"lbl"},label):null,...kids);}
function table(head,rows,cls="tbl"){
  return el("div",{class:"tblw"},el("table",{class:cls},
    head?el("thead",{},el("tr",{},...head.map(h=>el("th",{html:md(h)})))):null,
    el("tbody",{},...rows.map(r=>el("tr",{},...r.map(c=>{
      if(c&&typeof c==="object"&&!c.nodeType)return el("td",{class:c.cls||"",html:md(c.h)});
      return el("td",{html:c==null?"":md(String(c))});}))))));}
function stepper({label,val,vals,fmt=v=>v,onChange}){
  let i=Math.max(0,vals.indexOf(val));
  const v=el("span",{class:"v"});const show=()=>v.textContent=fmt(vals[i]);
  const mk=(d,t)=>el("button",{type:"button","aria-label":label+" "+t,onclick:()=>{const n=i+d;if(n<0||n>=vals.length)return;i=n;show();onChange&&onChange(vals[i]);}},t);
  const box=el("span",{class:"stp"},mk(-1,"−"),v,mk(1,"+"));show();
  box.get=()=>vals[i];box.set=x=>{const k=vals.indexOf(x);if(k>=0){i=k;show();}};
  return box;}
function makeClock(onTick){
  const c={t:0,speed:1,run:false,last:0,raf:0,
    start(){if(c.run)return;c.run=true;c.last=performance.now();c.raf=requestAnimationFrame(c.loop);},

    loop(now){if(!c.run)return;const dt=Math.min(0.25,(now-c.last)/1000)*c.speed*(window.__TS||1);c.last=now;c.t+=dt;

/* Inkubatsiya taymeri: target — simulyatsiya soniyalarida */

  const T={el:box,clk,get t(){return clk.t;},get reached(){return reached;},started:false,stopped:false,onStart:null,onStop:null,
    start(){if(T.started)return;T.started=true;bStart.disabled=true;bStop.disabled=false;clk.start();T.onStart&&T.onStart();},
    stop(){if(!T.started||T.stopped)return;T.stopped=true;clk.stop();bStop.disabled=true;T.onStop&&T.onStop(clk.t);}};

/* ===== Mikroskop: haqiqiy surat ustida immersion ko'rish ===== */
/* opt: {key, zoomAt:{10:1,40:2.6,100:6}, needOil:true, startObj:10, hint, found(objective) } */
function microscope(ctx,opt){
  const key=opt.key, r=IMG[key]||{};
  const objs=opt.objs||[10,40,100];
  const zoom=opt.zoom||{10:1,40:2,100:3.4};
  let cur=opt.startObj||10, oiled=false, px=0, py=0;
  const im=el("img",{src:r.f?srcOf(r):"",alt:opt.alt||r.cap||"mikroskopiya"});
  const vig=el("div",{class:"vig"});
  const hint=el("div",{class:"hint"},opt.hint||"Ko'rish maydonini surib ko'ring");
  const field=el("div",{class:"field drag"},im,vig,hint);
  const place=()=>{
    const z=zoom[cur]||1;
    const soft=(cur===100&&!oiled)?"blur(5px) brightness(.8)":(cur===40?"blur(.3px)":"none");
    im.style.filter=soft;
    im.style.width=(100*z)+"%";
    im.style.transform=`translate(calc(-50% + ${px}px), calc(-50% + ${py}px))`;
    hint.textContent=(cur===100&&!oiled)
      ?"Tasvir xira: immersion ob'ektiv moysiz ishlamaydi"
      :(opt.hint||"Ko'rish maydonini surib ko'ring");};
  // sudrash (sensorli ekranda ham)
  let drag=null;
  const lim=()=>{const z=zoom[cur]||1;const m=field.clientWidth*(z-1)/2;px=clamp(px,-m,m);py=clamp(py,-m,m);};
  const down=e=>{drag={x:(e.touches?e.touches[0].clientX:e.clientX)-px,y:(e.touches?e.touches[0].clientY:e.clientY)-py};};
  const move=e=>{if(!drag)return;
    const cx=e.touches?e.touches[0].clientX:e.clientX, cy=e.touches?e.touches[0].clientY:e.clientY;
    px=cx-drag.x;py=cy-drag.y;lim();place();if(e.cancelable)e.preventDefault();};
  const up=()=>{drag=null;};
  field.addEventListener("mousedown",down);field.addEventListener("touchstart",down,{passive:true});
  window.addEventListener("mousemove",move);field.addEventListener("touchmove",move,{passive:false});
  window.addEventListener("mouseup",up);field.addEventListener("touchend",up);
  ctx.onClean(()=>{window.removeEventListener("mousemove",move);window.removeEventListener("mouseup",up);});
  // boshqaruv
  const objBox=el("div",{class:"obj"});
  const btns={};
  objs.forEach(o=>{const b=el("button",{type:"button",class:o===cur?"on":""},"×"+o);
    b.onclick=()=>{cur=o;px=py=0;Object.values(btns).forEach(x=>x.classList.remove("on"));b.classList.add("on");place();
      if(o===100&&!oiled)ctx.err&&ctx.err("Immersion ob'ektiv (×100) moysiz ishlatildi: tasvir xira, ob'ektiv va preparat shikastlanishi mumkin");
      opt.onObj&&opt.onObj(o,oiled);};
    btns[o]=b;objBox.append(b);});
  const oilB=el("button",{type:"button",class:"oil"},"💧 Immersion moy");
  oilB.onclick=()=>{if(oiled)return;oiled=true;oilB.classList.add("on");oilB.textContent="✓ Moy tomizildi";
    place();opt.onOil&&opt.onOil();
    /* moy ×100 tanlangandan keyin tomizilgan bo'lsa ham ish davom etsin */
    opt.onObj&&opt.onObj(cur,true);};
  const bar=el("div",{class:"bar"},el("span",{class:"lbl"},"Ob'ektiv"),objBox,oilB,
    opt.extra||null);
  const box=el("div",{class:"scope"},field,bar,
    r.src?el("div",{class:"small",style:"color:#8FA5A0;margin-top:6px;font-size:.76rem"},"Manba: "+r.src):null);
  setTimeout(place,0);
  return {el:box,get obj(){return cur;},get oiled(){return oiled;},setObj(o){btns[o]&&btns[o].click();}};}

function buildLab(ctx,sec){
  ctx.labBuilt=true;
  const {c,P}=ctx;
  const insts=c.lab(P,ctx);
  ctx.steps=[];insts.forEach(I=>{I.base=ctx.steps.length;ctx.steps.push(...I.steps);});
  ctx.stepDone=ctx.steps.map(()=>false);

  const finBox=el("div");
  ctx.msg=(t,k="")=>{const d=el("div",{class:k,html:t});logBox.append(d);logBox.scrollTop=logBox.scrollHeight;};
  ctx.err=t=>{if(ctx.checked)return;ctx.errs.push(t);ctx.msg("✗ "+t,"err");toast(t);};
  ctx.ok=t=>ctx.msg("✓ "+t,"ok");
  ctx.info=t=>ctx.msg(t,"pt");
  ctx.renderSteps=()=>{stepsOl.innerHTML="";const cur=ctx.stepDone.indexOf(false);
    ctx.steps.forEach((s,i)=>stepsOl.append(el("li",{class:ctx.stepDone[i]?"done":(i===cur?"cur":""),html:md(s)})));};
  ctx.done=i=>{if(!ctx.stepDone[i]){ctx.stepDone[i]=true;ctx.renderSteps();}};
  ctx.isDone=i=>ctx.stepDone[i];
  ctx.need=(i,silent)=>{for(let k=0;k<i;k++)if(!ctx.stepDone[k]){if(!silent)ctx.err(`Avval «${ctx.steps[k].replace(/\*\*/g,"")}» bosqichini bajaring`);return false;}return true;};
  const lay=el("div",{class:"lay"});

    el("div",{class:"card"},el("h3",{},"Laboratoriya daftari"),logBox),finBox);
  lay.append(stage,panel);sec.append(lay);
  ctx.renderSteps();
  let k=0;
  const mountNext=()=>{
    if(k>=insts.length){

        el("h3",{},"Laboratoriya ishi yakunlandi"),

          ?`Bajarilmagan bosqichlar: ${miss.length}. Ular xato sifatida hisobga olinadi.`
          :"Barcha natijalar laboratoriya daftariga yozildi. Endi ularni talqin qiling."),

  jr.append(btn);

  btn.onclick=()=>{
    if(ctx.checked)return;
    const empty=fields.filter(f=>f.inp.value==="");
    const unans=mcBoxes.filter(b=>!$("input:checked",b));
    if(empty.length||unans.length){toast("Barcha maydonlarni to'ldiring va test savollariga javob bering");return;}
    let got=0;const tot=fields.length+mcs.length;
    fields.forEach(f=>{const v=f.type==="sel"?Number(f.inp.value):(f.text?f.inp.value:num(f.inp.value));
      let r;try{r=f.check(v,ctx);}catch(e){r=[false,"tekshirib bo'lmadi"];}
      const [okq,right2]=r;if(okq)got++;
      f.fb.className="fb "+(okq?"ok":"no");f.fb.innerHTML=(okq?"✓ To'g'ri. ":"✗ Noto'g'ri. ")+(right2||"");f.inp.disabled=true;});

    if(D.prof)left.append(el("p",{style:"margin-top:6px",html:"<b>Profilaktika.</b> "+md(D.prof)}));

/* ---------- 1. Material olish ---------- */
/* opt: {name, right:{id,n,d}, wrong:[{id,n,why}], timing:{q,opts,ans,why}, note} */
function sampleInst(opt){
  return {steps:[`Tekshirish materialini olish: **${opt.name}**`],
  doing:opt.doing||`Tashxis zanjirining birinchi va eng muhim qadami — materialni to'g'ri olish. Noto'g'ri olingan namuna butun tahlilni behuda qiladi.`,
  mount(ctx,box,base,next){
    box.append(el("h3",{},"Materialni olish"));
    box.append(el("p",{class:"small muted",style:"margin-bottom:8px"},opt.intro||""));
    const all=shuffle([{...opt.right,ok:true},...opt.wrong]);
    const chips=el("div",{class:"chips"});
    let picked=false;
    all.forEach(o=>{
      const b=el("button",{class:"chip",type:"button"},o.n);
      b.onclick=()=>{
        if(picked)return;
        if(!o.ok){ctx.err(`${o.n} — ${o.why}`);b.classList.add("dim");b.disabled=true;return;}
        picked=true;b.classList.add("on");
        $$(".chip",chips).forEach(x=>{if(x!==b)x.disabled=true;});
        ctx.ok(`Material olindi: ${o.n}.`);
        if(o.d)box.append(el("div",{class:"why",html:"<b>Nima uchun.</b> "+md(o.d)}));
        ctx.done(base);
        if(opt.timing)askTiming();else finish();};
      chips.append(b);});
    box.append(ctlGroup("Namuna va idishni tanlang",chips));
    function askTiming(){
      const g=el("div",{class:"gate",style:"margin-top:12px"});
      g.append(el("div",{class:"q",html:md(opt.timing.q)}));
      const mcb=el("div",{class:"mc",style:"margin-top:4px"});
      opt.timing.opts.forEach((o,i)=>{
        const inp=el("input",{type:"radio",name:"tm"+base,value:String(i)});
        const lb=el("label",{},inp,el("span",{html:md(o)}));mcb.append(lb);
        inp.onchange=()=>{
          $$("label",mcb).forEach((l,k)=>{if(k===opt.timing.ans)l.classList.add("ok");else if(k===i)l.classList.add("no");$("input",l).disabled=true;});
          if(i!==opt.timing.ans)ctx.err("Material olish vaqti/sharti noto'g'ri tanlandi");
          else ctx.ok("Material to'g'ri vaqtda va shartda olindi.");
          mcb.append(el("div",{class:"why",html:md(opt.timing.why)}));
          setTimeout(finish,250);};});
      g.append(mcb);box.append(g);}
    function finish(){
      if(opt.note)box.append(el("div",{class:"tip",html:md(opt.note)}));
      if(opt.photo)box.append(photo(opt.photo,opt.photoCap));
      next();}
  }};}

    const st={smear:false,fixed:false,i:0,errs:0,falseNeg:false,falsePos:false,weak:false};
    box.append(el("h3",{},"Surtma tayyorlash va bo'yash"));
    const canvas=el("div",{style:"margin:6px 0"});
    const draw=()=>{
      const layers=[];
      let fill="#EDEFF0";
      if(st.smear)fill="#E3E6E2";
      let smearCol="#CBD2CE";
      if(st.i>0){const done=S.seq.slice(0,st.i).map(x=>x.r).join("|");
        if(/gensian|Neysser ko'ki|ishqoriy metilen/.test(done))smearCol="#6B4FA8";
        if(/karbol fuksin/.test(done))smearCol="#C0392B";
        if(/tush/.test(done))smearCol="#1A1A1A";
        if(/Gimza/.test(done))smearCol="#8E5AA8";
        if(/spirt \(96/.test(done)&&opt.method==="gram")smearCol=st.falsePos?"#6B4FA8":"#B9BFC4";
        if(/suvli fuksin/.test(done)&&opt.method==="gram")smearCol=st.falseNeg?"#D4607A":(opt.gramPos?"#6B4FA8":"#D4607A");
        if(/xlorid kislotali spirt/.test(done))smearCol="#9FB6C6";
        if(/metilen ko'ki/.test(done)&&opt.method==="zn")smearCol="#3F6FA8";
        if(/xrizoidin/.test(done))smearCol="#B98B2E";}
      let s=`<rect width="420" height="170" fill="#F2F4F3"/>`;
      s+=`<rect x="40" y="25" width="340" height="120" rx="4" fill="${fill}" stroke="#9AA6A3" stroke-width="2"/>`;
      s+=`<rect x="45" y="30" width="330" height="110" fill="none" stroke="#C6D0CD" stroke-width="1"/>`;
      if(st.smear)s+=`<ellipse cx="210" cy="85" rx="95" ry="42" fill="${smearCol}" opacity="${st.i?0.9:0.35}"/>`;
      if(st.smear)s+=`<ellipse cx="210" cy="85" rx="95" ry="42" fill="none" stroke="#8E9A97" stroke-width=".8"/>`;
      s+=`<text x="210" y="162" text-anchor="middle" font-size="12" fill="#56696A">${
        st.i>=S.seq.length?"bo'yalgan preparat — mikroskopiyaga tayyor":(st.fixed?"fiksatsiyalangan surtma":(st.smear?"quritilgan surtma":"toza buyum oynasi"))}</text>`;
      canvas.innerHTML="";canvas.append(svgEl(s,420,170));};
    draw();box.append(canvas);
    // 1) surtma
    const bSmear=el("button",{class:"btn sm",type:"button"},`Ilmoq bilan ${opt.material||"material"}dan surtma tayyorlash`);
    const bFix=el("button",{class:"btn sm",type:"button",disabled:true},
      opt.fix==="metanol"?"Metanol bilan fiksatsiya":"Olov ustidan 2–3 marta o'tkazish (fiksatsiya)");
    bSmear.onclick=()=>{if(st.smear)return;st.smear=true;bSmear.disabled=true;bFix.disabled=false;
      ctx.info("Buyum oynasiga surtma tayyorlandi va havoda quritildi.");ctx.done(base);draw();};
    bFix.onclick=()=>{if(st.fixed)return;st.fixed=true;bFix.disabled=true;
      ctx.ok(opt.fix==="metanol"?"Surtma metanol bilan fiksatsiya qilindi."
        :"Surtma olov ustida fiksatsiya qilindi — hujayralar oynaga mahkamlandi va zararsizlantirildi.");
      ctx.done(base+1);stainBox.hidden=false;draw();};
    box.append(el("div",{class:"ctl"},bSmear,bFix));
    // 2) bo'yash
    const stainBox=el("div",{hidden:true,style:"margin-top:12px"});
    box.append(stainBox);
    const seqList=el("ol",{class:"small",style:"margin:4px 0 8px;padding-left:20px;color:var(--muted)"});
    const refresh=()=>{seqList.innerHTML="";
      S.seq.forEach((x,i)=>seqList.append(el("li",{style:i<st.i?"color:var(--good)":(i===st.i?"font-weight:600;color:var(--ink)":"")},
        x.r+" — "+(x.t[0]===x.t[1]?x.t[0]+" s":x.t[0]+"–"+x.t[1]+" s"))));};
    refresh();
    stainBox.append(el("h3",{},S.name+" — bosqichlar"),seqList);
    const sel=el("select",{class:"btn sm",style:"max-width:100%;min-width:220px"},
      el("option",{value:""},"— reaktivni tanlang —"),
      ...shuffle(ALL_REAGENTS).map(r=>el("option",{value:r},r)));
    const dur=stepper({label:"Vaqt",val:60,vals:[5,10,15,20,30,40,60,90,120,180,300,600,1200,1800,2700],fmt:v=>v<60?v+" s":Math.round(v/60)+" daq"});
    const bApply=el("button",{class:"btn sm pri",type:"button"},"Quyish / ishlov berish");
    stainBox.append(el("div",{class:"ctl"},ctlGroup("Reaktiv",sel),ctlGroup("Vaqt",dur),bApply));
    const whyBox=el("div");stainBox.append(whyBox);
    bApply.onclick=()=>{
      if(st.i>=S.seq.length)return;
      const r=sel.value;if(!r){toast("Reaktivni tanlang");return;}
      const need=S.seq[st.i];
      if(r!==need.r){
        ctx.err(`Bosqich tartibi buzildi: «${r}» o'rniga «${need.r}» bo'lishi kerak edi`);
        st.errs++;return;}
      const t=dur.get();const [lo,hi]=need.t;
      const badmap=(S.bad||{})[st.i]||{};
      if(t<lo){
        if(badmap.under){ctx.err(badmap.under);if(opt.method==="gram")st.falsePos=true;if(opt.method==="zn")st.weak=true;}
        else ctx.err(`«${need.r}» bosqichi juda qisqa (${t} s, kerak ${lo}–${hi} s): reaksiya to'liq bormadi`);
      }else if(t>hi){
        if(badmap.over){ctx.err(badmap.over);if(opt.method==="gram")st.falseNeg=true;}
        else ctx.err(`«${need.r}» bosqichi juda uzoq (${t<60?t+" s":Math.round(t/60)+" daq"}, kerak ${lo}–${hi} s): preparat sifati buziladi`);
      }else ctx.info(`${need.r} — ${t<60?t+" s":Math.round(t/60)+" daq"}.`);
      whyBox.innerHTML="";whyBox.append(el("div",{class:"why",html:"<b>Nima uchun.</b> "+md(need.why)}));
      st.i++;refresh();draw();sel.value="";
      if(st.i>=S.seq.length){
        ctx.rec.stain={method:opt.method,falseNeg:st.falseNeg,falsePos:st.falsePos,weak:st.weak,errs:st.errs};
        ctx.ok(`${S.name} bilan bo'yash yakunlandi. Preparat quritildi.`);
        ctx.done(base+2);bApply.disabled=true;sel.disabled=true;
        setTimeout(next,300);}};
  }};}

/* ---------- 3. Mikroskopiya ---------- */
/* opt: {key, altKey (xato bo'yalganda), ask:{q,opts,ans,why}, ask2, label, hint, need100:true} */
function microInst(opt){
  return {steps:[`Immersion mikroskopiyada preparatni ko'rish`,`Ko'rganini tavsiflash`],
  doing:opt.doing||"Bo'yalgan preparatni mikroskopda ko'ramiz. Bakteriologiyada asosiy usul — immersion mikroskopiya (okulyar ×10 × ob'ektiv ×100, jami ×1000).",
  mount(ctx,box,base,next){
    const sr=ctx.rec.stain||{};
    const bad=(sr.falseNeg&&opt.falseNegKey)||(sr.weak&&opt.weakKey);
    const key=sr.falseNeg&&opt.falseNegKey?opt.falseNegKey:(sr.weak&&opt.weakKey?opt.weakKey:opt.key);
    box.append(el("h3",{},opt.label||"Mikroskopiya"));
    const M=microscope(ctx,{key,hint:opt.hint,onObj(o,oiled){
      if(o===100&&oiled&&!ctx.isDone(base)){ctx.done(base);ctx.ok("Immersion ob'ektiv bilan ko'rildi.");askBox.hidden=false;}}});
    box.append(M.el);
    box.append(el("div",{class:"note"},"Ob'ektivni tanlang, ×100 uchun avval immersion moy tomizing. Rasmni barmoq bilan surib, ko'rish maydonini o'zgartiring."));
    if(bad)box.append(el("div",{class:"tip"},"Bo'yashdagi xato tufayli preparat noto'g'ri ko'rinishda. Natijani shunga qarab baholang."));
    const askBox=el("div",{hidden:true,style:"margin-top:12px"});box.append(askBox);
    const qs=[opt.ask,opt.ask2].filter(Boolean);
    let qi=0;
    const put=()=>{
      if(qi>=qs.length){ctx.done(base+1);setTimeout(next,250);return;}
      const q=qs[qi++];
      const g=el("div",{class:"gate",style:"margin-top:10px"});
      g.append(el("div",{class:"q",html:md(q.q)}));
      const mcb=el("div",{class:"mc",style:"margin-top:4px"});
      q.opts.forEach((o,i)=>{
        const inp=el("input",{type:"radio",name:"mi"+base+"_"+qi,value:String(i)});
        const lb=el("label",{},inp,el("span",{html:md(o)}));mcb.append(lb);
        inp.onchange=()=>{
          $$("label",mcb).forEach((l,k)=>{if(k===q.ans)l.classList.add("ok");else if(k===i)l.classList.add("no");$("input",l).disabled=true;});
          if(i!==q.ans)ctx.err("Mikroskopik manzara noto'g'ri baholandi: "+q.short);
          else ctx.ok(q.okMsg||"Mikroskopik manzara to'g'ri tavsiflandi.");
          mcb.append(el("div",{class:"why",html:md(q.why)}));
          setTimeout(put,300);};});
      g.append(mcb);askBox.append(g);};
    put();
  }};}

/* ================== ASBOBLAR: ekish, inkubatsiya, koloniyalar ================== */

/* ---------- Oziq muhitga ekish (1-kun) ---------- */
/* opt: {media:[{n,ok,why,d}], temp:37, atm:"aerob", hours:24, ref:"strek"} */
function plateInst(opt){
  const temp=opt.temp||37, atm=opt.atm||"aerob", hours=opt.hours||24;
  return {steps:[`Oziq muhitni tanlash`,`Sektorlar bo'yicha izolyatsiya ekishi`,
                 `Termostatga qo'yish (${temp} °C, ${opt.hoursLabel||hours+" soat"})`],
  doing:opt.doing||"Materialni qattiq oziq muhitga ekamiz. Maqsad — alohida koloniya olish: bitta koloniya bitta hujayradan o'sadi, demak u sof kultura manbai.",
  mount(ctx,box,base,next){
    const st={media:[],streak:0,flamed:true,cooled:true,inc:false};
    box.append(el("h3",{},"Ekish"));
    // 1) muhit tanlash
    box.append(el("p",{class:"small muted"},"Material tarkibiga mos muhitlarni tanlang (bir nechta bo'lishi mumkin):"));
    const chips=el("div",{class:"chips"});
    const needed=opt.media.filter(m=>m.ok).length;
    opt.media.forEach(m=>{
      const b=el("button",{class:"chip",type:"button"},m.n);
      b.onclick=()=>{
        if(st.streak>0)return;
        if(b.classList.contains("on")||b.classList.contains("dim"))return;
        if(!m.ok){ctx.err(`${m.n} — ${m.why}`);b.classList.add("dim");b.disabled=true;return;}
        b.classList.add("on");st.media.push(m);
        ctx.info(`${m.n} tanlandi.${m.d?" "+m.d:""}`);
        if(st.media.length===needed){ctx.ok("Muhitlar to'g'ri tanlandi.");ctx.done(base);streakBox.hidden=false;}};
      chips.append(b);});
    box.append(chips);
    // 2) ekish
    const streakBox=el("div",{hidden:true,style:"margin-top:12px"});box.append(streakBox);
    const holder=el("div");
    const draw=()=>{
      const R=105,cx=140,cy=130;
      let s=`<rect width="420" height="262" fill="#F2F4F3"/>`;
      s+=`<circle cx="${cx}" cy="${cy}" r="${R+7}" fill="#DCE3E1" stroke="#AEBAB7" stroke-width="2"/>`;
      s+=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="${opt.agarColor||"#E8C98C"}" stroke="#C0A878" stroke-width="1.5"/>`;
      // sektor chiziqlari
      [[1,"#B9833F"],[2,"#B9833F"],[3,"#B9833F"],[4,"#B9833F"]].forEach(([k,c])=>{
        if(st.streak<k)return;
        const a0=(k-1)*Math.PI/2-Math.PI/2+0.12,a1=a0+Math.PI/2-0.24;
        for(let i=0;i<7;i++){
          const t=i/6,a=a0+(a1-a0)*t,r0=R*0.26,r1=R*0.94;
          const x0=cx+Math.cos(a)*r0,y0=cy+Math.sin(a)*r0,x1=cx+Math.cos(a)*r1,y1=cy+Math.sin(a)*r1;
          s+=`<path d="M${x0.toFixed(1)},${y0.toFixed(1)} Q${(cx+Math.cos(a+0.2)*R*0.6).toFixed(1)},${(cy+Math.sin(a+0.2)*R*0.6).toFixed(1)} ${x1.toFixed(1)},${y1.toFixed(1)}" fill="none" stroke="${c}" stroke-width="${2.6-k*0.4}" opacity="${0.85-k*0.12}"/>`;}});
      for(let k=1;k<=4;k++){const a=(k-1)*Math.PI/2-Math.PI/2+Math.PI/4;
        s+=`<text x="${(cx+Math.cos(a)*(R-18)).toFixed(0)}" y="${(cy+Math.sin(a)*(R-18)).toFixed(0)}" font-size="13" font-weight="700" fill="#8A6A3A" text-anchor="middle" opacity=".55">${k}</text>`;}
      // ilmoq
      s+=`<g transform="translate(300,36)"><rect x="-5" y="0" width="10" height="92" rx="4" fill="#6E7780"/>`;
      s+=`<path d="M0,92 L0,118" stroke="${st.flamed&&!st.cooled?"#E06B2A":"#9AA3AB"}" stroke-width="3"/>`;
      s+=`<circle cx="0" cy="126" r="8" fill="none" stroke="${st.flamed&&!st.cooled?"#E06B2A":"#9AA3AB"}" stroke-width="3"/>`;
      if(st.flamed&&!st.cooled)s+=`<circle cx="0" cy="126" r="14" fill="#F2A04B" opacity=".35"/>`;
      s+=`<text x="0" y="158" font-size="11" text-anchor="middle" fill="#56696A">${st.flamed?(st.cooled?"ilmoq steril, sovigan":"ilmoq QIZIGAN"):"ilmoq ishlatilgan"}</text></g>`;
      s+=`<text x="140" y="252" font-size="12" text-anchor="middle" fill="#56696A">${st.streak?st.streak+"-sektorgacha ekildi":"Petri likopchasi — ekishga tayyor"}</text>`;
      holder.innerHTML="";holder.append(svgEl(s,420,262));};
    draw();
    streakBox.append(el("h3",{},"Sektorlar bo'yicha ekish"),holder);
    const bFlame=el("button",{class:"btn sm",type:"button"},"🔥 Ilmoqni kuydirish");
    const bCool=el("button",{class:"btn sm",type:"button",disabled:true},"Sovitish (10–15 s)");
    const bStreak=el("button",{class:"btn sm pri",type:"button"},"Keyingi sektorga surtish");
    bFlame.onclick=()=>{st.flamed=true;st.cooled=false;bCool.disabled=false;ctx.info("Ilmoq spirt lampasida qizarguncha kuydirildi.");draw();};
    bCool.onclick=()=>{st.cooled=true;bCool.disabled=true;ctx.info("Ilmoq muhitning bo'sh joyiga tegizib sovitildi.");draw();};
    bStreak.onclick=()=>{
      if(st.streak>=4)return;
      if(!st.flamed){ctx.err("Ilmoq oldingi sektordan keyin kuydirilmadi: hujayra soni kamaymaydi va alohida koloniya o'smaydi");}
      else if(!st.cooled){ctx.err("Ilmoq kuydirilgandan keyin sovitilmadi: qizigan ilmoq hujayralarni nobud qiladi (soxta manfiy natija)");}
      st.streak++;st.flamed=false;st.cooled=false;
      ctx.info(`${st.streak}-sektorga zigzag shaklida surildi.`);
      if(st.streak===4){ctx.ok("To'rt sektor bo'yicha ekish yakunlandi — oxirgi sektorda alohida koloniyalar kutiladi.");
        ctx.done(base+1);bStreak.disabled=true;incBox.hidden=false;}
      draw();};
    streakBox.append(el("div",{class:"ctl"},bFlame,bCool,bStreak));
    if(opt.ref)streakBox.append(photo(opt.ref,opt.refCap||"Sektorlar bo'yicha ekish texnikasi."));
    // 3) inkubatsiya
    const incBox=el("div",{hidden:true,style:"margin-top:12px"});streakBox.append(incBox);
    incBox.append(el("h3",{},"Termostat"));
    const tS=stepper({label:"Harorat",val:37,vals:[22,28,35,37,42],fmt:v=>v+" °C"});
    const atmS=el("select",{class:"btn sm"},...["aerob","5 % CO₂ (eksikator / shamcha)","anaerob (anaerostat)","mikroaerofil"]
      .map(a=>el("option",{value:a},a)));
    const hS=stepper({label:"Vaqt",val:24,vals:opt.hourVals||[6,18,24,48,72],fmt:v=>v+" soat"});
    const bInc=el("button",{class:"btn sm pri",type:"button"},"Termostatga qo'yish");
    incBox.append(el("div",{class:"ctl"},ctlGroup("Harorat",tS),ctlGroup("Muhit",atmS),ctlGroup("Vaqt",hS),bInc));
    bInc.onclick=()=>{
      if(st.inc)return;st.inc=true;bInc.disabled=true;
      if(tS.get()!==temp)ctx.err(`Inkubatsiya harorati noto'g'ri (${tS.get()} °C, kerak ${temp} °C)`);
      if(!atmS.value.startsWith(atm.split(" ")[0]))ctx.err(`Gaz muhiti noto'g'ri tanlandi (${atmS.value}, kerak: ${atm})`);
      if(hS.get()<(opt.minHours||18))ctx.err(`Inkubatsiya muddati qisqa (${hS.get()} soat): koloniyalar shakllanib ulgurmaydi`);
      const T=timerBox(ctx,{label:"Inkubatsiya",target:60,speed:12});
      incBox.append(el("div",{class:"ctl"},T.el));
      T.onStop=()=>{
        ctx.ok(`Inkubatsiya tugadi (${temp} °C, ${opt.hoursLabel||hS.get()+" soat"}). Likopcha termostatdan olindi.`);
        ctx.done(base+2);setTimeout(next,300);};
      T.start();
      // vaqt tugaganda avtomatik to'xtatish
      const iv=setInterval(()=>{if(T.reached&&!T.stopped){clearInterval(iv);T.stop();}},300);
      ctx.onClean(()=>clearInterval(iv));};
  }};}

/* ---------- Koloniyalarni o'rganish (2-kun) ---------- */
/* opt:{photo, cap, ask:[{q,opts,ans,why}], count:{q,target,unit,why}, subculture:true} */
function colonyInst(opt){
  const steps=[`Koloniyalarni o'rganish (kultural xossalar)`];
  if(opt.count)steps.push(`Koloniyalarni sanash va hisoblash`);
  if(opt.subculture!==false)steps.push(`Shubhali koloniyadan qiya agarga ko'chirish (sof kultura)`);
  return {steps,
  doing:opt.doing||"Termostatdan olingan likopchadagi o'sishni baholaymiz: koloniya shakli, o'lchami, rangi, qirrasi, yuzasi va gemoliz turi — bular dastlabki taxmin uchun muhim belgilar.",
  mount(ctx,box,base,next){
    box.append(el("h3",{},"Koloniyalar"));
    box.append(photo(opt.photo,opt.cap));
    if(opt.photo2)box.append(photo(opt.photo2,opt.cap2));
    let i=0;const qs=opt.ask||[];
    const area=el("div");box.append(area);
    const ask=()=>{
      if(i>=qs.length){ctx.done(base);afterAsk();return;}
      const q=qs[i++];
      const g=el("div",{class:"gate",style:"margin-top:10px"});
      g.append(el("div",{class:"q",html:md(q.q)}));
      const mcb=el("div",{class:"mc",style:"margin-top:4px"});
      q.opts.forEach((o,k)=>{
        const inp=el("input",{type:"radio",name:"co"+base+"_"+i,value:String(k)});
        const lb=el("label",{},inp,el("span",{html:md(o)}));mcb.append(lb);
        inp.onchange=()=>{
          $$("label",mcb).forEach((l,j)=>{if(j===q.ans)l.classList.add("ok");else if(j===k)l.classList.add("no");$("input",l).disabled=true;});
          if(k!==q.ans)ctx.err("Koloniya xossalari noto'g'ri baholandi: "+(q.short||q.q.slice(0,40)));
          else ctx.ok(q.okMsg||"Koloniya to'g'ri tavsiflandi.");
          mcb.append(el("div",{class:"why",html:md(q.why)}));
          setTimeout(ask,280);};});
      g.append(mcb);area.append(g);};
    function afterAsk(){
      if(opt.count)doCount();else doSub();}
    function doCount(){
      const g=el("div",{class:"gate",style:"margin-top:10px"});
      g.append(el("div",{class:"q",html:md(opt.count.q)}));
      const inp=el("input",{inputmode:"decimal",style:"min-height:40px;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface);max-width:180px;font-family:var(--f-mono)",placeholder:"son"});
      const b=el("button",{class:"btn sm pri",type:"button"},"Hisoblash");
      const fb=el("div",{class:"fb small",style:"margin-top:6px"});
      g.append(el("div",{class:"ctl"},inp,el("span",{class:"u small muted",html:opt.count.unit||""}),b),fb);
      area.append(g);
      b.onclick=()=>{
        const v=num(inp.value);if(!Number.isFinite(v)){toast("Son kiriting");return;}
        const okq=near(v,opt.count.target,opt.count.rel??0.2,opt.count.abs||0);
        if(!okq)ctx.err("Koloniyalar soni / KHB noto'g'ri hisoblandi");else ctx.ok("KHB to'g'ri hisoblandi.");
        fb.className="fb small "+(okq?"ok":"no");
        fb.innerHTML=(okq?"✓ To'g'ri. ":"✗ Noto'g'ri. ")+md(opt.count.why);
        inp.disabled=b.disabled=true;ctx.done(base+1);setTimeout(doSub,320);};}
    function doSub(){
      if(opt.subculture===false){setTimeout(next,200);return;}
      const idx=base+steps.length-1;
      const b=el("button",{class:"btn sm pri",type:"button"},"Shubhali koloniyadan qiya agarga ko'chirish");
      const wrap=el("div",{class:"ctl",style:"margin-top:10px"},b);
      box.append(wrap);
      b.onclick=()=>{b.disabled=true;
        ctx.ok("Alohida koloniyadan qiya agarga ko'chirildi — ertangi kunga sof kultura to'planadi.");
        box.append(el("div",{class:"why",html:"<b>Nima uchun.</b> Identifikatsiya va antibiotikogramma faqat <b>sof kultura</b> bilan bajariladi: aralash o'sishda biokimyoviy natijalar ham, sezgirlik zonalari ham noto'g'ri chiqadi."}));
        ctx.done(idx);setTimeout(next,300);};}
    ask();
  }};}

/* ---------- Sof kulturaning tozaligini tekshirish ---------- */
function purityInst(opt){
  return {steps:[`Sof kultura tozaligini Gram surtmasi bilan tekshirish`],
  doing:"Identifikatsiyadan oldin kultura tozaligini tekshiramiz: qiya agardagi o'sishdan surtma tayyorlanib, Gram usulida bo'yaladi. Barcha hujayralar bir xil morfologiya va bir xil tinktorial xossaga ega bo'lishi kerak.",
  mount(ctx,box,base,next){
    box.append(el("h3",{},"Tozalikni tekshirish"));
    if(opt.photo)box.append(photo(opt.photo,opt.cap));
    const g=el("div",{class:"gate"});

        ctx.done(base);setTimeout(next,300);};});

/* ---------- Test ko'rinishlari ---------- */
function testSvg(kind,p={}){
  const W=400,H=180;let s=`<rect width="${W}" height="${H}" fill="#F2F4F3"/>`;
  const pos=p.pos;
  if(kind==="slide"){
    s+=`<rect x="60" y="45" width="280" height="90" rx="3" fill="#E9EDEC" stroke="#9AA6A3" stroke-width="2"/>`;
    s+=`<ellipse cx="200" cy="90" rx="62" ry="28" fill="${pos?"#F3F6F8":"#EDEFEF"}" stroke="#B9C4C1" stroke-width="1"/>`;
    if(pos)for(let i=0;i<26;i++){const a=Math.random()*Math.PI*2,r=Math.random()*55;
      s+=`<circle cx="${(200+Math.cos(a)*r).toFixed(1)}" cy="${(90+Math.sin(a)*r*0.45).toFixed(1)}" r="${(1.6+Math.random()*4).toFixed(1)}" fill="#FFFFFF" stroke="#9FB4BF" stroke-width=".8" opacity=".95"/>`;}
    s+=`<text x="200" y="160" text-anchor="middle" font-size="12" fill="#56696A">${pos?"ko'p sonli pufakchalar — musbat":"pufakcha yo'q — manfiy"}</text>`;}
  else if(kind==="paper"){
    s+=`<rect x="130" y="40" width="140" height="92" rx="4" fill="${pos?"#5B2A83":"#F4F3EE"}" stroke="#9AA6A3" stroke-width="1.5"/>`;
    if(pos)s+=`<rect x="130" y="40" width="140" height="92" rx="4" fill="#2E1247" opacity=".35"/>`;
    s+=`<path d="M160,36 L240,36" stroke="#8A9490" stroke-width="3"/>`;
    s+=`<text x="200" y="158" text-anchor="middle" font-size="12" fill="#56696A">${pos?"qog'oz 10–30 s ichida ko'k-binafsha — musbat":"rang o'zgarmadi — manfiy"}</text>`;}
  else if(kind==="tube"){
    s+=tubeSvgM(200,30,{h:110,w:38,layers:pos?[{h:.62,c:"#F0E6CF"}]:[{h:.62,c:"#F6EFDC"}],cap:"#C8372D"});
    if(pos){s+=`<path d="M186,92 q14,-10 28,0 q-14,12 -28,0 z" fill="#E6D7A8" stroke="#BBA96E" stroke-width="1"/>`;
      s+=`<text x="200" y="158" text-anchor="middle" font-size="12" fill="#56696A">plazma ividi (laxta) — musbat</text>`;}
    else s+=`<text x="200" y="158" text-anchor="middle" font-size="12" fill="#56696A">plazma suyuq qoldi — manfiy</text>`;}
  else if(kind==="kligler"){
    const slant=p.slant==="K"?"#C8372D":"#E8C93F", butt=p.butt==="K"?"#C8372D":"#E8C93F";
    s+=`<g transform="translate(170,18)">`;
    s+=`<path d="M0,0 h44 v128 a22,12 0 0 1 -44,0 z" fill="#F6F3EC" stroke="#8E9A97" stroke-width="2"/>`;
    s+=`<path d="M2,52 h40 v74 a20,10 0 0 1 -40,0 z" fill="${butt}"/>`;
    s+=`<path d="M2,16 L42,46 L42,54 L2,54 z" fill="${slant}"/>`;
    if(p.h2s)s+=`<ellipse cx="22" cy="104" rx="19" ry="20" fill="#1C1C1C" opacity=".92"/>`;
    if(p.gas)s+=`<path d="M8,74 h28" stroke="#F6F3EC" stroke-width="6"/><path d="M12,88 h20" stroke="#F6F3EC" stroke-width="4"/>`;
    s+=`<rect x="-4" y="-10" width="52" height="14" rx="3" fill="#B9C4C1"/></g>`;
    s+=`<text x="200" y="168" text-anchor="middle" font-size="12" fill="#56696A">qiya yuza: ${p.slant==="K"?"qizil (ishqoriy)":"sariq (kislota)"} / ustun: ${p.butt==="K"?"qizil":"sariq"}${p.h2s?" · H₂S (+)":""}${p.gas?" · gaz (+)":""}</text>`;}
  else if(kind==="urease"){
    s+=`<g transform="translate(176,22)"><path d="M0,0 h44 v124 a22,12 0 0 1 -44,0 z" fill="#F6F3EC" stroke="#8E9A97" stroke-width="2"/>`;
    s+=`<path d="M2,30 L42,56 L42,122 a20,10 0 0 1 -40,0 z" fill="${pos?"#D9478F":"#E9C96A"}"/>`;
    s+=`<rect x="-4" y="-10" width="52" height="14" rx="3" fill="#B9C4C1"/></g>`;
    s+=`<text x="200" y="166" text-anchor="middle" font-size="12" fill="#56696A">${pos?"muhit pushti-malina — ureaza musbat":"muhit sariq-pushtisiz — ureaza manfiy"}</text>`;}
  else if(kind==="indol"){
    s+=tubeSvgM(200,26,{h:118,w:38,layers:[{h:.55,c:"#D9CDA6"}],cap:null});
    s+=`<rect x="181" y="52" width="38" height="13" fill="${pos?"#C8372D":"#F0E2C0"}"/>`;
    s+=`<text x="200" y="166" text-anchor="middle" font-size="12" fill="#56696A">${pos?"Kovacs reaktivi bilan qizil halqa — indol musbat":"halqa sariq qoldi — indol manfiy"}</text>`;}
  else if(kind==="disc"){
    const R=78,cx=200,cy=86,zone=p.zone||0;
    s+=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="#E3C98F" stroke="#C0A878" stroke-width="1.5"/>`;
    for(let i=0;i<260;i++){const a=Math.random()*Math.PI*2,r=Math.sqrt(Math.random())*R;
      const x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;
      if(Math.hypot(x-cx,y-cy)<zone)continue;
      s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(1+Math.random()*1.6).toFixed(1)}" fill="#E8E2CE" opacity=".8"/>`;}
    if(zone)s+=`<circle cx="${cx}" cy="${cy}" r="${zone}" fill="#E8D4A0" opacity=".55"/>`;
    s+=`<circle cx="${cx}" cy="${cy}" r="9" fill="#F7F5EE" stroke="#A09378" stroke-width="1"/>`;
    s+=`<text x="${cx}" y="${cy+3}" font-size="8" text-anchor="middle" fill="#6B6049">${p.label||""}</text>`;
    s+=`<text x="200" y="172" text-anchor="middle" font-size="12" fill="#56696A">${p.caption||""}</text>`;}
  else if(kind==="giss"){
    const list=p.row||[];const n=list.length;const w=Math.min(46,360/Math.max(n,1));
    list.forEach((g,i)=>{const x=40+i*w+w/2;
      const col=g.r==="KG"||g.r==="K"?"#E8C93F":"#C06BA8";
      s+=tubeSvgM(x,24,{h:96,w:Math.min(26,w-10),layers:[{h:.6,c:col}],cap:null});
      if(g.r==="KG")s+=`<rect x="${x-5}" y="${86}" width="10" height="16" fill="#FFFFFF" stroke="#9AA6A3" stroke-width="1"/>`;
      s+=`<text x="${x}" y="138" font-size="10" text-anchor="middle" fill="#3A4745">${g.n}</text>`;
      s+=`<text x="${x}" y="152" font-size="10" font-weight="700" text-anchor="middle" fill="${g.r==="−"?"#8A6200":"#246B61"}">${g.r}</text>`;});
    s+=`<text x="200" y="172" text-anchor="middle" font-size="11" fill="#56696A">K — kislota, KG — kislota va gaz, − — parchalanmagan</text>`;}
  return svgEl(s,W,H);}
/* probirka chizish */
function tubeSvgM(x,y,{w=26,h=110,layers=[],cap=null,label=""}={}){
  let s="";const r=w/2;const by=y+h-r;
  const cid="cl"+Math.random().toString(36).slice(2,8);
  s+=`<clipPath id="${cid}"><path d="M${x-r},${y} V${by} A${r},${r} 0 0 0 ${x+r},${by} V${y} Z"/></clipPath>`;
  let acc=0;layers.forEach(L=>{const lh=L.h*(h-4);const top=y+h-acc-lh;
    s+=`<rect x="${x-r}" y="${top}" width="${w}" height="${lh+1}" fill="${L.c}" clip-path="url(#${cid})"/>`;acc+=lh;});
  s+=`<path d="M${x-r},${y} V${by} A${r},${r} 0 0 0 ${x+r},${by} V${y}" fill="none" stroke="#6E7780" stroke-width="1.6"/>`;
  s+=`<path d="M${x-r+4},${y+6} V${by-2}" stroke="#fff" stroke-width="2.2" opacity=".5"/>`;
  if(cap)s+=`<rect x="${x-r-3}" y="${y-12}" width="${w+6}" height="14" rx="3" fill="${cap}" stroke="#333" stroke-width=".8"/>`;
  if(label)s+=`<text x="${x}" y="${y+h+16}" font-size="11" text-anchor="middle" fill="#3A3127">${label}</text>`;
  return s;}

/* ---------- Biokimyoviy identifikatsiya ---------- */
/* opt:{tests:[{id,n,kind,p,pos,why,need:true}], extra:[{n,why}], idq:{q,opts,ans,why}} */
function bioInst(opt){
  const need=opt.tests.filter(t=>t.need!==false);
  return {steps:[`Biokimyoviy testlarni qo'yish va o'qish`,`Berji belgilari bo'yicha turni aniqlash`],
  doing:opt.doing||"Sof kulturani ferment faolligi bo'yicha identifikatsiya qilamiz. Har bir turning ferment to'plami o'ziga xos va nasldan naslga o'tadi — shuning uchun biokimyoviy belgilar identifikatsiyaning asosi.",
  mount(ctx,box,base,next){
    box.append(el("h3",{},"Biokimyoviy identifikatsiya"));
    if(opt.ref)box.append(photo(opt.ref,opt.refCap));
    const chips=el("div",{class:"chips"});
    const view=el("div",{style:"margin-top:8px"});
    const whyB=el("div");
    const doneSet=new Set();
    const all=shuffle([...opt.tests,...(opt.extra||[]).map(e=>({...e,bad:true}))]);
    all.forEach(t=>{
      const b=el("button",{class:"chip",type:"button"},t.n);
      b.onclick=()=>{
        if(b.disabled)return;
        if(t.bad){ctx.err(`${t.n} — ${t.why}`);b.classList.add("dim");b.disabled=true;return;}
        b.classList.add("on");b.disabled=true;
        view.innerHTML="";view.append(testSvg(t.kind,{...(t.p||{}),pos:t.pos}));
        const res=t.res||(t.pos?"musbat (+)":"manfiy (−)");
        ctx.msg(`<b>${t.n}:</b> ${res}`);
        ctx.rec[t.id]=t.pos??t.res;
        whyB.innerHTML="";whyB.append(el("div",{class:"why",html:"<b>Nima uchun.</b> "+md(t.why)}));
        doneSet.add(t.id);
        if(need.every(x=>doneSet.has(x.id))){ctx.done(base);ctx.ok("Barcha kerakli biokimyoviy testlar qo'yildi va o'qildi.");askId();}};
      chips.append(b);});
    box.append(ctlGroup("Testni tanlang",chips),view,whyB);
    let asked=false;
    function askId(){
      if(asked)return;asked=true;
      const g=el("div",{class:"gate",style:"margin-top:12px"});
      g.append(el("h3",{style:"margin:0 0 6px;color:inherit"},"Identifikatsiya"),el("div",{class:"q",html:md(opt.idq.q)}));
      const mcb=el("div",{class:"mc",style:"margin-top:4px"});
      opt.idq.opts.forEach((o,i)=>{
        const inp=el("input",{type:"radio",name:"idq"+base,value:String(i)});
        mcb.append(el("label",{},inp,el("span",{html:md(o)})));
        inp.onchange=()=>{
          $$("label",mcb).forEach((l,k)=>{if(k===opt.idq.ans)l.classList.add("ok");else if(k===i)l.classList.add("no");$("input",l).disabled=true;});
          if(i!==opt.idq.ans)ctx.err("Tur noto'g'ri aniqlandi");else ctx.ok("Tur to'g'ri aniqlandi: "+opt.idq.opts[opt.idq.ans].replace(/\*\*|__/g,""));
          mcb.append(el("div",{class:"why",html:md(opt.idq.why)}));
          ctx.done(base+1);setTimeout(next,320);};});
      g.append(mcb);box.append(g);}
  }};}

/* ---------- Antibiotikogramma (disk-diffuziya, Kirbi–Bauer) ---------- */
/* opt:{discs:[{k,n,zone,S,R,note}], ref:"antibiogram", mh:true} */
function abgInst(opt){
  const discs=opt.discs;
  return {steps:[`0,5 McFarland bo'yicha suspenziya tayyorlash`,
                 `Myuller–Xinton agariga uch yo'nalishda surtish`,
                 `Antibiotik disklarini qo'yish va inkubatsiya`,
                 `Zona diametrlarini o'lchash va talqin qilish`],
  doing:"Antibiotikogramma qo'yamiz. Zona diametrining o'zi «yaxshi-yomon» ni bildirmaydi: har bir antibiotik va har bir tur uchun o'z chegaraviy qiymati bor, natija faqat standart jadval bo'yicha talqin qilinadi.",
  mount(ctx,box,base,next){
    box.append(el("h3",{},"Antibiotiklarga sezgirlik — disk-diffuziya usuli"));
    if(opt.ref)box.append(photo(opt.ref,opt.refCap||"Disk-diffuziya usulida o'sish to'xtagan zonalar."));
    const st={mcf:null,swab:0,placed:false,inc:false,measured:{}};
    /* 1) McFarland */
    const mcBox=el("div",{style:"margin-top:8px"});box.append(mcBox);
    mcBox.append(el("p",{class:"small muted"},"Suspenziya bulanganligini 0,5 McFarland standartiga moslang (ikkala probirkani yonma-yon solishtiring):"));
    const turb=el("input",{type:"range",min:"0",max:"100",value:"12",style:"width:100%;max-width:300px"});
    const holder=el("div");
    const drawMcf=()=>{
      const v=Number(turb.value);const op=0.08+v/100*0.82;
      let s=`<rect width="400" height="170" fill="#F2F4F3"/>`;
      s+=tubeSvgM(140,22,{h:118,w:34,layers:[{h:.66,c:"#DCE4E6"}],label:"standart 0,5"});
      s+=`<rect x="123" y="62" width="34" height="78" fill="#9FB0B5" opacity=".52"/>`;
      s+=tubeSvgM(250,22,{h:118,w:34,layers:[{h:.66,c:"#DCE4E6"}],label:"bemor kulturasi"});
      s+=`<rect x="233" y="62" width="34" height="78" fill="#9FB0B5" opacity="${op.toFixed(2)}"/>`;
      s+=`<path d="M60,150 h280" stroke="#B9C4C1" stroke-width="1"/>`;
      s+=`<text x="200" y="166" text-anchor="middle" font-size="11" fill="#56696A">qora chiziqli fon ustida solishtiriladi</text>`;
      holder.innerHTML="";holder.append(svgEl(s,400,170));};
    drawMcf();turb.oninput=drawMcf;
    const bMcf=el("button",{class:"btn sm pri",type:"button"},"Bulanganlikni tasdiqlash");
    mcBox.append(holder,el("div",{class:"ctl"},turb,bMcf));
    bMcf.onclick=()=>{
      if(st.mcf!=null)return;
      const v=Number(turb.value);st.mcf=v;bMcf.disabled=true;turb.disabled=true;
      if(v<40)ctx.err(`Suspenziya juda suyuq (0,5 McFarland dan past): ekilgan hujayra kam bo'ladi, zonalar sun'iy kattayadi va chidamli shtamm «sezgir» bo'lib ko'rinadi`);
      else if(v>72)ctx.err(`Suspenziya juda quyuq: zonalar kichrayadi va sezgir shtamm «chidamli» bo'lib ko'rinadi`);
      else ctx.ok("Suspenziya 0,5 McFarland ga mos (≈ 1,5 × 10⁸ KHB/ml).");
      ctx.done(base);swabBox.hidden=false;};
    /* 2) surtish */
    const swabBox=el("div",{hidden:true,style:"margin-top:12px"});box.append(swabBox);
    swabBox.append(el("h3",{},"Myuller–Xinton agariga ekish"));
    const sw=el("div",{class:"small muted"},"Tamponni uch yo'nalishda (har safar likopchani 60° ga burib) bir tekis suring: 0 / 3");
    const bSwab=el("button",{class:"btn sm pri",type:"button"},"Surtish (bir yo'nalish)");
    swabBox.append(sw,el("div",{class:"ctl"},bSwab));
    bSwab.onclick=()=>{
      st.swab++;sw.textContent=`Tamponni uch yo'nalishda bir tekis suring: ${st.swab} / 3`;
      if(st.swab>=3){bSwab.disabled=true;ctx.ok("Agar yuzasi bir tekis ekildi — o'sish qalqonsimon (gazon) bo'ladi.");
        ctx.done(base+1);discBox.hidden=false;}};
    /* 3) disklar */
    const discBox=el("div",{hidden:true,style:"margin-top:12px"});box.append(discBox);
    discBox.append(el("h3",{},"Disklarni qo'yish"));
    const plate=el("div");discBox.append(plate);
    const PR=132,PCX=160,PCY=160,MM=PR/45; // 1 mm = MM px (likopcha 90 mm)
    const pos=discs.map((d,i)=>{const a=-Math.PI/2+i*2*Math.PI/discs.length;
      return {x:PCX+Math.cos(a)*PR*0.56,y:PCY+Math.sin(a)*PR*0.56};});
    let sel=-1,rulerEnd=null;
    const drawPlate=()=>{
      let s=`<rect width="420" height="330" fill="#F2F4F3"/>`;
      s+=`<circle cx="${PCX}" cy="${PCY}" r="${PR+8}" fill="#DCE3E1" stroke="#AEBAB7" stroke-width="2"/>`;
      s+=`<circle cx="${PCX}" cy="${PCY}" r="${PR}" fill="#D9C79A" stroke="#BFA874" stroke-width="1.5"/>`;
      if(st.inc){ // gazon
        for(let i=0;i<520;i++){const a=Math.random()*Math.PI*2,r=Math.sqrt(Math.random())*PR;
          const x=PCX+Math.cos(a)*r,y=PCY+Math.sin(a)*r;
          let inZone=false;
          discs.forEach((d,k)=>{if(Math.hypot(x-pos[k].x,y-pos[k].y)<d.zone*MM/2)inZone=true;});
          if(inZone)continue;
          s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(1.1+Math.random()*1.5).toFixed(1)}" fill="#EDE6CF" opacity=".85"/>`;}}
      discs.forEach((d,i)=>{
        if(st.inc&&d.zone)s+=`<circle cx="${pos[i].x.toFixed(1)}" cy="${pos[i].y.toFixed(1)}" r="${(d.zone*MM/2).toFixed(1)}" fill="#E4D6AE" opacity=".6"/>`;
        if(st.placed){
          s+=`<circle class="clk" data-d="${i}" cx="${pos[i].x.toFixed(1)}" cy="${pos[i].y.toFixed(1)}" r="${(6.5*MM).toFixed(1)}" fill="#F8F6EF" stroke="${sel===i?"#F2B705":"#A09378"}" stroke-width="${sel===i?3:1}"/>`;
          s+=`<text x="${pos[i].x.toFixed(1)}" y="${(pos[i].y+3).toFixed(1)}" font-size="9" font-weight="700" text-anchor="middle" fill="#6B6049" pointer-events="none">${d.k}</text>`;}});
      if(sel>=0&&st.inc){
        const p=pos[sel];const e=rulerEnd||{x:p.x+40,y:p.y};
        const dd=Math.hypot(e.x-p.x,e.y-p.y);
        s+=`<line x1="${p.x}" y1="${p.y}" x2="${e.x.toFixed(1)}" y2="${e.y.toFixed(1)}" stroke="#C8372D" stroke-width="2"/>`;
        s+=`<circle cx="${e.x.toFixed(1)}" cy="${e.y.toFixed(1)}" r="9" fill="#C8372D" opacity=".85"/>`;
        s+=`<rect x="300" y="14" width="112" height="40" rx="6" fill="#10180F"/>`;
        s+=`<text x="356" y="40" font-size="19" font-family="ui-monospace,monospace" fill="#7CFF9A" text-anchor="middle">${(dd*2/MM).toFixed(0)} mm</text>`;}
      s+=`<text x="${PCX}" y="316" font-size="12" text-anchor="middle" fill="#56696A">${
        st.inc?"Diskdan zona chetigacha radiusni sudrang — diametr avtomatik hisoblanadi":(st.placed?"Disklar qo'yildi — termostatga qo'ying":"Disklarni qo'ying")}</text>`;
      plate.innerHTML="";const sv=svgEl(s,420,330);plate.append(sv);
      $$(".clk",sv).forEach(c=>c.addEventListener("click",()=>{
        if(!st.inc){toast("Avval inkubatsiya qiling");return;}
        sel=Number(c.dataset.d);rulerEnd=null;drawPlate();readout();}));
      // sudrash
      const pt=e=>{const r=sv.getBoundingClientRect();const cxp=e.touches?e.touches[0].clientX:e.clientX;
        const cyp=e.touches?e.touches[0].clientY:e.clientY;
        return {x:(cxp-r.left)/r.width*420,y:(cyp-r.top)/r.height*330};};
      let dragging=false;
      const dn=e=>{if(sel<0||!st.inc)return;dragging=true;rulerEnd=pt(e);drawPlate();readout();if(e.cancelable)e.preventDefault();};
      const mv=e=>{if(!dragging)return;rulerEnd=pt(e);drawPlate();readout();if(e.cancelable)e.preventDefault();};
      sv.addEventListener("mousedown",dn);sv.addEventListener("touchstart",dn,{passive:false});
      sv.addEventListener("mousemove",mv);sv.addEventListener("touchmove",mv,{passive:false});
      sv.addEventListener("mouseup",()=>dragging=false);sv.addEventListener("touchend",()=>dragging=false);
      sv.addEventListener("mouseleave",()=>dragging=false);};
    const bPlace=el("button",{class:"btn sm",type:"button"},"Disklarni pinset bilan qo'yish");
    const bInc=el("button",{class:"btn sm pri",type:"button",disabled:true},"35–37 °C, 16–18 soat inkubatsiya");
    discBox.append(el("div",{class:"ctl"},bPlace,bInc));
    bPlace.onclick=()=>{st.placed=true;bPlace.disabled=true;bInc.disabled=false;
      ctx.info(`${discs.length} ta disk belgilangan masofada joylashtirildi.`);drawPlate();};
    bInc.onclick=()=>{
      if(st.inc)return;bInc.disabled=true;
      const T=timerBox(ctx,{label:"Inkubatsiya",target:50,speed:14});
      discBox.append(el("div",{class:"ctl"},T.el));
      T.onStop=()=>{st.inc=true;ctx.ok("Inkubatsiya tugadi — disklar atrofida o'sish to'xtagan zonalar ko'rinadi.");
        ctx.done(base+2);drawPlate();measBox.hidden=false;};
      T.start();
      const iv=setInterval(()=>{if(T.reached&&!T.stopped){clearInterval(iv);T.stop();}},300);
      ctx.onClean(()=>clearInterval(iv));};
    drawPlate();
    /* 4) o'lchash va talqin */
    const measBox=el("div",{hidden:true,style:"margin-top:12px"});box.append(measBox);
    measBox.append(el("h3",{},"O'lchash va talqin"));
    const curLbl=el("div",{class:"small muted"},"Diskni tanlang, so'ng zona chetigacha sudrang.");
    const bRec=el("button",{class:"btn sm pri",type:"button",disabled:true},"Zonani qayd etish");
    measBox.append(curLbl,el("div",{class:"ctl"},bRec));
    const tblBox=el("div",{style:"margin-top:8px"});measBox.append(tblBox);
    function readout(){
      if(sel<0)return;
      const p=pos[sel];const e=rulerEnd||{x:p.x+40,y:p.y};
      const mm=Math.hypot(e.x-p.x,e.y-p.y)*2/MM;
      curLbl.innerHTML=`<b>${discs[sel].n}</b> — o'lchangan diametr: <b>${mm.toFixed(0)} mm</b> (haqiqiy zona chetiga aniq qo'ying)`;
      bRec.disabled=false;}
    bRec.onclick=()=>{
      if(sel<0)return;
      const d=discs[sel];const p=pos[sel];const e=rulerEnd||{x:p.x+40,y:p.y};
      const mm=Math.round(Math.hypot(e.x-p.x,e.y-p.y)*2/MM);
      if(Math.abs(mm-d.zone)>3){ctx.err(`${d.n}: zona noto'g'ri o'lchandi (${mm} mm, haqiqiy ${d.zone} mm) — lineyka zona chetiga aniq qo'yilmagan`);}
      st.measured[d.k]=d.zone;
      ctx.msg(`<b>${d.n}:</b> zona ${d.zone} mm — ${interp(d)}`);
      bRec.disabled=true;sel=-1;rulerEnd=null;drawPlate();
      curLbl.textContent="Diskni tanlang, so'ng zona chetigacha sudrang.";
      renderTbl();
      if(Object.keys(st.measured).length===discs.length){
        ctx.done(base+3);ctx.ok("Barcha disklar o'lchandi va standart jadval bo'yicha talqin qilindi.");
        ctx.rec.abg=discs.map(x=>({n:x.n,zone:x.zone,v:interpLetter(x)}));
        setTimeout(next,400);}};
    const interpLetter=d=>d.zone>=d.S?"S":(d.zone<=d.R?"R":"I");
    const interp=d=>{const v=interpLetter(d);
      return v==="S"?`<b>S</b> (sezgir; S ≥ ${d.S} mm)`:v==="R"?`<b>R</b> (chidamli; R ≤ ${d.R} mm)`:`<b>I</b> (oraliq)`;};
    function renderTbl(){
      const rows=discs.filter(d=>st.measured[d.k]!=null).map(d=>{
        const v=interpLetter(d);
        return [d.n,d.zone+" mm",`S ≥ ${d.S} · R ≤ ${d.R}`,{h:v,cls:v==="R"?"hi":v==="S"?"pos":""}];});
      tblBox.innerHTML="";
      if(rows.length)tblBox.append(table(["Antibiotik","Zona","Chegaraviy qiymat","Natija"],rows));}
  }};}

/* ---------- Immunoferment tahlil (IFA / ELISA) ---------- */
/* opt:{analytes:[{k,n,od,co,pos}], sample:"zardob", kit:"...", panel:true} */
function elisaInst(opt){
  const AN=opt.analytes;
  return {steps:[`Quduqlarga nazorat va bemor zardobini solish`,
                 `1-inkubatsiya (37 °C) va yuvish`,
                 `Konyugat qo'shish, inkubatsiya va yuvish`,
                 `Substrat (TMB), to'xtatuvchi eritma va 450 nm da o'qish`,
                 `Natijani cut-off bo'yicha talqin qilish`],
  doing:opt.doing||"Immunoferment tahlil qo'yamiz. IFA — qattiq fazadagi antigen yoki antitelo bilan bemor zardobidagi juftini bog'lab, ferment-konyugat va substrat orqali rangli reaksiyaga aylantiradigan usul. Rang intensivligi (optik zichlik) miqdorga proporsional.",
  mount(ctx,box,base,next){
    const st={loaded:false,inc1:false,w1:0,conj:false,inc2:false,w2:0,sub:false,stop:false,read:false};
    box.append(el("h3",{},"Immunoferment tahlil (IFA)"));
    if(opt.ref)box.append(photo(opt.ref,opt.refCap||"IFA planshetidagi rangli reaksiya."));
    box.append(el("p",{class:"small muted"},`Test tizimi: ${opt.kit||"IFA to'plami"}. Namuna: ${opt.sample||"bemor qon zardobi"}.`));
    const holder=el("div");box.append(holder);
    const colOf=(frac,pos)=>{ // TMB: ko'k -> to'xtatgach sariq
      const f=clamp(frac,0,1);
      if(!st.sub)return "#F3F5F6";
      if(!st.stop)return pos?`rgb(${Math.round(210-150*f)},${Math.round(226-70*f)},${Math.round(240-10*f)})`:"#EDF2F6";
      return pos?`rgb(${Math.round(250-10*f)},${Math.round(226-70*f)},${Math.round(150-130*f)})`:"#FBF6E8";};
    const draw=()=>{
      const cols=AN.length+2;const w=360/Math.max(cols,4);
      let s=`<rect width="420" height="190" fill="#F2F4F3"/>`;
      s+=`<rect x="24" y="30" width="372" height="96" rx="7" fill="#E7EBEA" stroke="#A9B5B2" stroke-width="2"/>`;
      const names=["K−","K+",...AN.map(a=>a.k)];
      names.forEach((n,i)=>{
        const cx=46+i*w+w/2-6;
        const pos= i===1?true : i===0?false : AN[i-2].pos;
        const frac= st.read? (i===1?0.95:i===0?0.05:clamp(AN[i-2].od/1.6,0.03,1)) : (st.sub?0.5:0);
        const bg=(st.w1<3&&st.sub)?"#DCCBB0":colOf(frac,pos);
        s+=`<circle cx="${cx.toFixed(1)}" cy="78" r="${Math.min(18,w/2-3)}" fill="${bg}" stroke="#8E9A97" stroke-width="1.4"/>`;
        s+=`<text x="${cx.toFixed(1)}" y="146" font-size="10.5" text-anchor="middle" fill="#3A4745">${n}</text>`;
        if(st.read)s+=`<text x="${cx.toFixed(1)}" y="160" font-size="10" font-weight="700" text-anchor="middle" fill="#246B61">${
          i===1?"1,95":i===0?"0,04":fx(AN[i-2].od,2)}</text>`;});
      s+=`<text x="210" y="180" font-size="11" text-anchor="middle" fill="#56696A">${
        st.read?"optik zichlik (450 nm)":st.stop?"to'xtatuvchi eritma qo'shildi — rang sariq":st.sub?"substrat (TMB) — rang ko'k":"IFA planshet qudug'i"}</text>`;
      holder.innerHTML="";holder.append(svgEl(s,420,190));};
    draw();
    const mk=(t,fn,dis)=>{const b=el("button",{class:"btn sm",type:"button",disabled:!!dis},t);b.onclick=()=>fn(b);return b;};
    const bLoad=mk("Nazorat va zardobni solish",b=>{
      st.loaded=true;b.disabled=true;ctx.info("Manfiy (K−), musbat (K+) nazoratlar va bemor zardobi quduqlarga solindi.");
      ctx.done(base);draw();bInc1.disabled=false;});
    const bInc1=mk("1-inkubatsiya 37 °C, 30 daq",b=>{
      st.inc1=true;b.disabled=true;ctx.info("Planshet 37 °C da inkubatsiya qilindi — antigen-antitelo kompleksi hosil bo'ldi.");
      bWash.disabled=false;},true);
    const bWash=mk("Yuvish (1 marta)",()=>{
      if(!st.inc1)return;st.w1++;ctx.info(`Yuvish: ${st.w1} / 5 — bog'lanmagan komponentlar ketkaziladi.`);
      if(st.w1>=5){ctx.ok("Yuvish to'liq bajarildi (5 marta).");ctx.done(base+1);bConj.disabled=false;}},true);
    const bConj=mk("Konyugat qo'shish + inkubatsiya + yuvish",b=>{
      if(st.w1<3)ctx.err(`Yuvish yetarli emas (${st.w1} marta, kerak 5): bog'lanmagan konyugat qolib, fon oshadi va soxta musbat natija beradi`);
      st.conj=true;st.inc2=true;st.w2=5;b.disabled=true;
      ctx.info("Ferment bilan belgilangan konyugat qo'shildi, inkubatsiya qilindi va planshet yuvildi.");
      ctx.done(base+2);bSub.disabled=false;},true);
    const bSub=mk("Substrat (TMB), 15 daq qorong'uda",b=>{
      st.sub=true;b.disabled=true;ctx.info("TMB substrati qo'shildi: ferment uni ko'k mahsulotga aylantiradi.");
      draw();bStop.disabled=false;},true);
    const bStop=mk("To'xtatuvchi eritma (H₂SO₄)",b=>{
      st.stop=true;b.disabled=true;ctx.info("Reaksiya to'xtatildi — ko'k rang sariqqa o'tdi.");draw();bRead.disabled=false;},true);
    const bRead=mk("Fotometrda 450 nm da o'qish",b=>{
      if(!st.stop)ctx.err("Reaksiya to'xtatilmasdan o'qildi: rang o'sishda davom etadi, natija takrorlanmaydi");
      st.read=true;b.disabled=true;ctx.done(base+3);draw();
      const co=AN[0].co??0.25;
      ctx.msg(`<b>Nazoratlar:</b> K− = 0,04 · K+ = 1,95 · cut-off = ${fx(co,2)}`);
      AN.forEach(a=>ctx.msg(`<b>${a.n}:</b> OZ = ${fx(a.od,2)} — ${a.od>=(a.co??co)?"musbat (+)":"manfiy (−)"}`));
      ctx.rec.elisa=AN.map(a=>({k:a.k,od:a.od,pos:a.od>=(a.co??co)}));
      ask();},true);
    box.append(el("div",{class:"ctl"},bLoad,bInc1,bWash,bConj),el("div",{class:"ctl"},bSub,bStop,bRead));
    const tail=el("div");box.append(tail);
    function ask(){
      const rows=AN.map(a=>[a.n,fx(a.od,2),fx(a.co??AN[0].co,2),{h:a.od>=(a.co??AN[0].co)?"musbat (+)":"manfiy (−)",cls:a.od>=(a.co??AN[0].co)?"hi":""}]);
      tail.append(table(["Ko'rsatkich","OZ (450 nm)","cut-off","Natija"],rows));
      if(!opt.ask){ctx.done(base+4);setTimeout(next,300);return;}
      const g=el("div",{class:"gate",style:"margin-top:10px"});
      g.append(el("div",{class:"q",html:md(opt.ask.q)}));
      const mcb=el("div",{class:"mc",style:"margin-top:4px"});
      opt.ask.opts.forEach((o,i)=>{
        const inp=el("input",{type:"radio",name:"el"+base,value:String(i)});
        mcb.append(el("label",{},inp,el("span",{html:md(o)})));
        inp.onchange=()=>{
          $$("label",mcb).forEach((l,k)=>{if(k===opt.ask.ans)l.classList.add("ok");else if(k===i)l.classList.add("no");$("input",l).disabled=true;});
          if(i!==opt.ask.ans)ctx.err("IFA natijasi noto'g'ri talqin qilindi");else ctx.ok("IFA natijasi to'g'ri talqin qilindi.");
          mcb.append(el("div",{class:"why",html:md(opt.ask.why)}));
          ctx.done(base+4);setTimeout(next,320);};});
      g.append(mcb);tail.append(g);}
  }};}

/* ---------- Immunoblot ---------- */
/* opt:{bands:[{n,on}], crit:"...", ask:{...}} */
function blotInst(opt){
  return {steps:[`Immunoblot chizig'ini ishlov berish va o'qish`,`Mezon bo'yicha natijani baholash`],
  doing:"Immunoblot (Western blot) — tasdiqlovchi usul: qo'zg'atuvchi oqsillari elektroforez bilan molekulyar og'irligiga qarab ajratilib, membranaga ko'chirilgan. Bemor zardobidagi antitelolar o'ziga mos oqsil chizig'iga bog'lanadi.",
  mount(ctx,box,base,next){
