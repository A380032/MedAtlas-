<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>BKP Klinik Simulyator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: bemor kartasi + monitor chapda yopishgan, bosqichlar o'ngda; telefonda ustma-ust */
:root{
  --bg:#EEF3F6; --surface:#FFFFFF; --surface2:#E3EBF0; --ink:#0E2230; --muted:#56697A; --line:#C9D6DF;
  --accent:#1F5BD8; --accent-ink:#FFFFFF; --accent-soft:#DCE6FB;
  --good:#1A8A55; --good-soft:#DDF2E7; --warn:#B86B00; --warn-soft:#FBEBD2; --bad:#C2352B; --bad-soft:#F9DEDB;
  --mon-bg:#06121A; --mon-line:#18303D; --mon-hr:#39E58C; --mon-sp:#3FD3F2; --mon-rr:#F5D547; --mon-t:#F2F5F7; --mon-bp:#FF8FA3;
  --skin:#EDC39E; --skin-line:#8A5A3A; --ecg-grid:#F4C6CC; --ecg-paper:#FFF6F6; --ecg-ink:#1B1B1B;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0B151C; --surface:#122029; --surface2:#1A2C37; --ink:#E4EDF2; --muted:#93A8B6; --line:#27404E;
  --accent:#6E9BFF; --accent-ink:#071226; --accent-soft:#1A2E57;
  --good:#4CCB8A; --good-soft:#123527; --warn:#F0A940; --warn-soft:#3A2A10; --bad:#FF7468; --bad-soft:#401B18;
  --skin:#D9AE8A; --skin-line:#F0CFB2; --ecg-grid:#5A2F36; --ecg-paper:#1C1416; --ecg-ink:#F2E6E6; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0B151C; --surface:#122029; --surface2:#1A2C37; --ink:#E4EDF2; --muted:#93A8B6; --line:#27404E;
  --accent:#6E9BFF; --accent-ink:#071226; --accent-soft:#1A2E57;
  --good:#4CCB8A; --good-soft:#123527; --warn:#F0A940; --warn-soft:#3A2A10; --bad:#FF7468; --bad-soft:#401B18;
  --skin:#D9AE8A; --skin-line:#F0CFB2; --ecg-grid:#5A2F36; --ecg-paper:#1C1416; --ecg-ink:#F2E6E6; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:18px 14px;border-bottom:1px solid var(--line);margin-bottom:22px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand svg{flex:none}
.brand h1{font-size:1.25rem;font-weight:800}
.brand small{display:block;font-family:var(--f-body);font-weight:500;color:var(--muted);font-size:.78rem;letter-spacing:.02em}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
mark{background:var(--warn-soft);color:var(--ink);padding:0 3px;border-radius:3px;font-weight:600}

/* Home */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:end;margin-bottom:26px}
.hero h2{font-size:clamp(1.9rem,4.4vw,3.1rem);font-weight:800;line-height:1.02}
.hero h2 em{font-style:normal;color:var(--accent)}
.hero p{max-width:60ch;color:var(--muted);margin:12px 0 0}
.steps{display:flex;flex-wrap:wrap;gap:6px;font-size:.8rem}
.steps span{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.case{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:10px;transition:transform .15s,border-color .15s}
.case:hover{transform:translateY(-2px);border-color:var(--accent)}
.case .row{display:flex;align-items:center;gap:12px}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.1rem;flex:none}
.case h3{font-size:1.08rem}
.case .cc{font-size:.9rem;color:var(--muted);min-height:3em}
.tag{display:inline-block;font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.score-pill{margin-left:auto;font-family:var(--f-mono);font-size:.8rem;padding:2px 8px;border-radius:6px;background:var(--good-soft);color:var(--good)}
.section-title{display:flex;align-items:baseline;gap:12px;margin:34px 0 12px}
.section-title h2{font-size:1.35rem}
.ref-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.links{display:flex;flex-direction:column;gap:8px}
.links a{color:var(--accent);text-decoration:none;font-weight:500}
.links a:hover{text-decoration:underline}
.note{font-size:.85rem;color:var(--muted);border-left:3px solid var(--warn);padding-left:10px;margin:12px 0 0}
.credit{margin:34px 0 0;padding-top:16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px;font-size:.92rem}
.credit b{font-family:var(--f-display);font-size:1.1rem}
.credit span{color:var(--muted)}

/* Case view */
.case-view{display:grid;grid-template-columns:340px minmax(0,1fr);gap:20px;align-items:start}
.side{position:sticky;top:12px;display:flex;flex-direction:column;gap:12px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;gap:12px;align-items:center}
.pcard h3{font-size:1.1rem}
.pcard .meta{font-size:.84rem;color:var(--muted)}
.monitor{background:var(--mon-bg);border-radius:12px;padding:10px;color:var(--mon-t);font-family:var(--f-mono);border:1px solid var(--mon-line)}
.mon-top{display:flex;justify-content:space-between;font-size:.66rem;letter-spacing:.08em;color:#7E97A6;margin-bottom:4px}
.mon-top b{color:var(--mon-hr)}
.mon-body{display:grid;grid-template-columns:minmax(0,1fr) 88px;gap:8px}
.mon-body canvas{width:100%;height:120px;display:block}
.mon-nums{display:flex;flex-direction:column;gap:2px;text-align:right}
.mn{line-height:1}
.mn small{display:block;font-size:.6rem;letter-spacing:.06em;color:#7E97A6}
.mn span{font-size:1.5rem;font-weight:600}
.mon-foot{display:flex;justify-content:space-between;gap:8px;margin-top:6px;font-size:.78rem;border-top:1px solid var(--mon-line);padding-top:6px}
.mon-foot .flag{color:#FF8F80}
.figure-box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;position:relative}
.figure-box svg{width:100%;height:auto;display:block;max-height:330px}
.fig-hint{position:absolute;left:12px;top:10px;font-size:.72rem;color:var(--muted)}
.hot{fill:transparent;cursor:pointer;stroke:transparent;stroke-width:2;transition:fill .15s}
.hot:hover,.hot.on{fill:color-mix(in srgb,var(--accent) 18%,transparent);stroke:var(--accent);stroke-dasharray:4 3}
.hot.seen{stroke:var(--good);stroke-dasharray:none;stroke-opacity:.6}

.stages{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:16px;scrollbar-width:thin}
.stage{border:0;background:none;padding:10px 12px;cursor:pointer;white-space:nowrap;color:var(--muted);font-weight:500;border-bottom:3px solid transparent;display:flex;gap:6px;align-items:center}
.stage .n{font-family:var(--f-mono);font-size:.72rem;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--surface2)}
.stage.active{color:var(--ink);border-bottom-color:var(--accent)}
.stage.active .n{background:var(--accent);color:var(--accent-ink)}
.stage.done .n{background:var(--good);color:#fff}
.stage:disabled{opacity:.4;cursor:not-allowed}
.pane{display:flex;flex-direction:column;gap:14px;min-width:0}
.pane h2{font-size:1.4rem}
.lead{max-width:68ch;color:var(--muted);margin:0}

.complaint{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;font-size:1.05rem;max-width:72ch}
.complaint .who{font-size:.8rem;color:var(--muted);margin-bottom:6px}
.vit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.vit{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.vit .v{font-family:var(--f-mono);font-size:1.25rem;font-weight:600}
.vit .nrm{font-size:.76rem;color:var(--muted)}
.vit.abn{border-color:var(--bad);background:var(--bad-soft)}
.vit.abn .v{color:var(--bad)}

.budget{display:flex;align-items:center;gap:10px;font-size:.9rem}
.dots{display:flex;gap:4px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--accent)}
.dots i.used{background:var(--line)}
.qa{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:14px}
.qlist{display:flex;flex-direction:column;gap:6px}
.q{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 11px;cursor:pointer;font-size:.9rem}
.q:hover:not(:disabled){border-color:var(--accent)}
.q:disabled{opacity:.5;cursor:default}
.q.asked{background:var(--accent-soft);border-color:transparent;opacity:1}
.q .cat{display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.chat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:200px;max-height:560px;overflow:auto}
.bub{max-width:88%;padding:9px 12px;border-radius:12px;font-size:.92rem}
.bub.dr{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:3px}
.bub.mom{align-self:flex-start;background:var(--surface2);border-bottom-left-radius:3px}
.bub.mom b{display:block;font-size:.7rem;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.empty{color:var(--muted);font-size:.9rem;margin:auto;text-align:center;max-width:36ch}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:.88rem;font-weight:500}
.chip:hover{border-color:var(--accent)}
.chip.seen{background:var(--good-soft);border-color:transparent;color:var(--good)}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.finding{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.finding h3{font-size:1.02rem;margin-bottom:4px}
.sheet{display:flex;flex-direction:column;gap:6px;font-size:.9rem}
.sheet div{padding:6px 0;border-bottom:1px dashed var(--line)}
.sheet b{font-weight:600}

.ausc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.mapbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.mapbox svg{width:100%;height:auto;display:block}
.mode{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:8px}
.mode button{border:0;background:var(--surface);padding:7px 12px;cursor:pointer;font-size:.86rem;font-weight:500}
.mode button.on{background:var(--accent);color:var(--accent-ink)}
.pt{cursor:pointer}
.pt circle.ring{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.pt.done circle.ring{fill:var(--good);stroke:var(--good)}
.pt.sel circle.ring{fill:var(--accent);stroke:var(--accent)}
.pt text{font-family:var(--f-mono);font-size:8px;fill:var(--ink);pointer-events:none}
.pt.done text,.pt.sel text{fill:#fff}
.listen{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.wave{width:100%;height:84px;background:var(--surface2);border-radius:8px;display:block}
.phase{display:flex;justify-content:space-between;font-size:.76rem;color:var(--muted);font-family:var(--f-mono)}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;font-size:.9rem}
.opt:hover{border-color:var(--accent)}
.opt input{margin-top:3px;accent-color:var(--accent)}
.opt.chosen{background:var(--accent-soft);border-color:var(--accent)}
.synth{font-size:.74rem;color:var(--muted)}

.tests{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.test{display:flex;gap:8px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;font-size:.9rem}
.test input{accent-color:var(--accent);margin-top:3px}
.test.ordered{background:var(--surface2);cursor:default}
.test.ordered span::after{content:" · natija tayyor";color:var(--good);font-size:.78rem}
.results{display:flex;flex-direction:column;gap:10px}
.res{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.res h3{font-size:.98rem}
.res p{margin:0;font-size:.92rem;max-width:80ch}
.res .img{max-width:420px}
.res .img svg{width:100%;height:auto;display:block;border-radius:8px}
.ecgbox{overflow-x:auto;border-radius:8px}

.dx{display:flex;flex-direction:column;gap:6px;max-width:720px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.scorebig{display:flex;align-items:center;gap:20px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.gauge{width:120px;height:120px;flex:none}
.scorebig h2{font-size:1.5rem}
.bars{display:grid;gap:8px;flex:1;min-width:240px}
.bar{display:grid;grid-template-columns:150px minmax(0,1fr) 54px;gap:10px;align-items:center;font-size:.86rem}
.bar .track{height:8px;background:var(--surface2);border-radius:999px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:999px}
.bar .num{font-family:var(--f-mono);text-align:right}
.fb{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.fb h3{font-size:1.02rem;margin-bottom:8px}
.fb ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:.92rem}
.ok{color:var(--good);font-weight:600}
.miss{color:var(--bad);font-weight:600}
.dxbox{border-left:4px solid var(--good);background:var(--good-soft);padding:12px 14px;border-radius:0 10px 10px 0}
.dxbox.wrong{border-color:var(--bad);background:var(--bad-soft)}
.nav-row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:6px}

.drawer{position:fixed;inset:0;background:rgba(5,12,18,.55);display:flex;justify-content:flex-end;z-index:20}
.drawer .in{background:var(--bg);width:min(560px,100%);height:100%;overflow:auto;padding:20px max(16px,env(safe-area-inset-right,0px)) 30px 20px;display:flex;flex-direction:column;gap:14px;padding-top:max(20px,env(safe-area-inset-top,0px))}

@keyframes breathe{0%,100%{transform:scaleX(1)}40%{transform:scaleX(1.045)}}
@keyframes retract{0%,100%{opacity:0}35%,45%{opacity:1}}
@keyframes flare{0%,100%{transform:scale(1)}40%{transform:scale(1.35)}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.breath{transform-origin:100px 150px;transform-box:view-box;animation:breathe var(--br,2s) ease-in-out infinite}
.retr{animation:retract var(--br,2s) ease-in-out infinite;opacity:0}
.flare{transform-box:fill-box;transform-origin:center;animation:flare var(--br,2s) ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.breath,.retr,.flare{animation:none}.retr{opacity:.8}}

.filters{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.filters .chip .cnt{font-family:var(--f-mono);font-size:.74rem;opacity:.7;margin-left:4px}
.topic{display:inline-block;font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);margin-left:4px}
.home-actions{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 10px}
.restart{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin:0 0 8px;font-size:.88rem}
.restart.ask{justify-content:space-between;background:var(--warn-soft);border:1px solid var(--warn);border-radius:10px;padding:8px 10px}
.restart.ask span{font-weight:600}
.btn.sm{padding:6px 11px;font-size:.86rem}
.sound-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sound-row .synth{margin:0}
.ecgbox svg{max-width:none}
@keyframes breathe2{0%,100%{transform:scaleX(1)}40%{transform:scaleX(1.085)}}
.breath.deep{animation-name:breathe2}
@media (max-width:900px){
  .case-view{grid-template-columns:minmax(0,1fr)}
  .side{position:static}
  .hero,.ref-grid,.qa,.ausc{grid-template-columns:minmax(0,1fr)}
  .figure-box svg{max-height:260px}
  .bar{grid-template-columns:110px minmax(0,1fr) 48px}
}
</style>

<div class="wrap" id="app"></div>

<script>
/* ============== MA'LUMOTLAR ============== */
const Q = [
 {id:'onset',cat:'Kasallik anamnezi',t:"Kasallik qachon va qanday boshlandi?"},

 {id:'dev',cat:'Hayot anamnezi',t:"Jismoniy va psixomotor rivojlanishi qanday?"},
 {id:'vitd',cat:'Hayot anamnezi',t:"D vitamini profilaktikasi olganmi?"},
 {id:'vacc',cat:'Hayot anamnezi',t:"Emlashlar kalendar bo'yicha qilinganmi?"},
 {id:'prev',cat:'Hayot anamnezi',t:"Avval qanday kasalliklarni o'tkazgan?"},
 {id:'allergy',cat:'Hayot anamnezi',t:"Allergologik anamnez qanday?"},

function biquad(type,f,Q,sr){
  const w=2*Math.PI*f/sr, cs=Math.cos(w), al=Math.sin(w)/(2*Q); let b0,b1,b2,a0,a1,a2;

  a0=1+al;a1=-2*cs;a2=1-al; let x1=0,x2=0,y1=0,y2=0;
  return x=>{ const y=(b0*x+b1*x1+b2*x2-a1*y1-a2*y2)/a0; x2=x1;x1=x;y2=y1;y1=y; return y; };
}

  const src=ctx.createBufferSource(); src.buffer=b; src.loop = syn.type!=='perc'; S.syn=syn;

  const frame=()=>{

    for(let i=0;i<W;i++){ let m=0; for(let j=0;j<step;j++) m=Math.max(m,Math.abs(d[i*step+j]||0)); const h=m*H*0.9; x.fillRect(i,(H-h)/2,1,Math.max(1,h)); }

      if(curBuf.type==='breath'){ const ph=(el%curBuf.cyc)/curBuf.cyc; updPhase(ph<curBuf.insF?'▲ NAFAS OLISH':'▼ NAFAS CHIQARISH'); }
      else if(curBuf.type==='heart'){ const tc=el%curBuf.cyc; updPhase(tc<curBuf.sys?'SISTOLA':'DIASTOLA'); }

let monRAF=null;
function startMonitor(c){
  cancelAnimationFrame(monRAF); const cv=$('#mon'); if(!cv) return;
  const dpr=window.devicePixelRatio||1, r=cv.getBoundingClientRect(); cv.width=r.width*dpr; cv.height=r.height*dpr;
  const x=cv.getContext('2d'); x.scale(dpr,dpr); const W=r.width,H=r.height;
  const hr=c.vit.hr, rr=c.vit.rr, beat=60/hr, br=60/rr, speed=W/4; let last=performance.now(), pos=0;
  const ecgY=t=>{ const p=(t%beat)/beat*0.8/ Math.min(1,beat/0.8) ; const u=(t%beat);
    const g=(c0,w,a)=>a*Math.exp(-Math.pow((u-c0)/w,2));
    return g(0.10,0.025,0.12)-g(0.17,0.008,0.12)+g(0.19,0.010,1)-g(0.215,0.010,0.28)+g(0.36,0.045,0.25); };

  x.fillStyle='#06121A'; x.fillRect(0,0,W,H);
  const rows=[[cH,ecgY,H*0.05,H*0.30],[cS,plY,H*0.40,H*0.22],[cR,reY,H*0.70,H*0.22]]; let prev=rows.map(()=>null), T=0;

      x.fillStyle='#06121A'; x.fillRect(pos,0,8,H);

function ecgSVG(hr,type){
  const W=600,H=120,mm=5, pxs=125, beat=Math.max(60/hr,0.34); let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="EKG yozuvi"><rect width="${W}" height="${H}" fill="var(--ecg-paper)"/>`;
  for(let x=0;x<=W;x+=mm) s+=`<line x1="${x}" y1="0" x2="${x}" y2="${H}" stroke="var(--ecg-grid)" stroke-width="${x%25===0?1:.4}"/>`;
  for(let y=0;y<=H;y+=mm) s+=`<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="var(--ecg-grid)" stroke-width="${y%25===0?1:.4}"/>`;
  const amp = type==='lvh'?62:type==='lowv'?16:38, pr=type==='prlong'?0.11:0, lead=type==='lvh'?'V5':type==='rvh'?'V1':'II'; let p='';
  for(let x=0;x<W;x++){ const u=(x/pxs)%beat; const g=(c,w,a)=>a*Math.exp(-Math.pow((u-c)/w,2));
    let v;
    if(type==='rvh') v=g(0.08,0.022,.12)+g(0.16,0.008,.35)-g(0.18,0.008,.3)+g(0.205,0.012,.9)-g(0.34,0.04,.2);
    else v=g(0.08-pr,0.022,.12)-g(0.15,0.007,.15)+g(0.17,0.009,1)-g(0.19,0.009,type==='lvh'?.15:.28)+g(0.33,0.04,type==='peakT'?.7:.26);
    p+=(x?'L':'M')+x+' '+(78-v*amp).toFixed(1); }
  s+=`<path d="${p}" fill="none" stroke="var(--ecg-ink)" stroke-width="1.4"/><text x="6" y="14" font-size="10" font-family="IBM Plex Mono,monospace" fill="var(--ecg-ink)">${lead} · 25 mm/s · ${hr}/min</text></svg>`;
  return s;
}

function grade(c,st){
  const hq=c.keyQ.filter(q=>st.asked.includes(q)).length/c.keyQ.length*20;
  const ex=c.keyEx.filter(r=>st.exSeen.includes(r)).length/c.keyEx.length*20;
  let w=0,got=0; allKeys().forEach(k=>{ const t=truth(c,k), def=defOf(c,k); const kw=t!==def?2:1; w+=kw; if(st.ans[k]===t) got+=kw; });
  const au=got/w*20;
  const unn=st.ordered.filter(t=>!c.keyT.includes(t)&&!c.okT.includes(t));
  const te=Math.max(0, (c.keyT.length? c.keyT.filter(t=>st.ordered.includes(t)).length/c.keyT.length*15 : 15) - unn.length*2);
  const dset=c.dx.map((d,i)=>i).filter(i=>c.dx[i].ok||c.dx[i].d);
  const dg=st.ddx.filter(i=>dset.includes(i)).length, db=st.ddx.filter(i=>!dset.includes(i)).length;
  const dd=Math.max(0, Math.min(1,dg/3)*10 - db*3);
  const fx = st.fdx!=null && c.dx[st.fdx].ok ? 15 : 0;
  const parts=[["Anamnez",hq,20],["Ko'rik",ex,20],["Perkussiya va auskultatsiya",au,20],["Tekshiruvlar",te,15],["Differensial tashxis",dd,10],["Yakuniy tashxis",fx,15]];
  return {parts,total:Math.round(parts.reduce((a,p)=>a+p[1],0)),unn};
}

    <div class="mon-foot"><span style="color:var(--mon-bp)">AQB ${v.bp}</span><span class="${v.t>=37.1?'flag':''}">T ${v.t.toFixed(1)} °C</span></div></div>
   <div class="figure-box"><span class="fig-hint">Ko'rik uchun sohani bosing</span>${figure(c)}</div>
  </aside><main class="pane-wrap" style="min-width:0">${S.rconf?`<div class="restart ask" id="rbar"><span>Barcha javoblar o'chadi. Davom etasizmi?</span><span style="display:flex;gap:6px"><button class="btn sm danger" id="r-yes">Ha, qaytadan boshlash</button><button class="btn sm" id="r-no">Yo'q</button></span></div>`:`<div class="restart"><button class="btn sm" id="restart">↺ Bemorni qaytadan boshlash</button></div>`}<nav class="stages" aria-label="Bosqichlar">${tabs}</nav><div class="pane" id="pane">${stagePane(flag)}</div></main></div>`;
}
function navRow(prev,next,nextLabel){ return `<div class="nav-row">${prev!=null?`<button class="btn" data-go="${prev}">← Orqaga</button>`:'<span></span>'}${next!=null?`<button class="btn primary" data-go="${next}">${nextLabel||'Keyingi bosqich →'}</button>`:''}</div>`; }

function stagePane(flag){
  const c=S.c, st=S.st, v=c.vit;
  switch(st.stage){
  case 0: return `<div class="eyebrow">1-bosqich</div><h2>Qabul</h2>
   <div class="complaint"><div class="who">${c.who||'Onasi aytadi:'}</div>“${esc(c.complaint)}”</div>
   ${c.sound?`<div class="sound-row"><button class="btn" id="hear">▶ ${SOUND_LABEL[c.sound]}</button><span class="synth">Sintez qilingan o'quv tovushi</span></div>`:''}
   <div class="eyebrow">Hayotiy ko'rsatkichlar — yosh normasi bilan solishtiring</div>
   <div class="vit-grid">
    ${[['Puls','hr',v.hr+' /min',`Norma: ${c.norm.hr[0]}–${c.norm.hr[1]}`],['Nafas soni','rr',v.rr+' /min',`Norma: ${c.norm.rr[0]}–${c.norm.rr[1]}`],['Harorat','t',v.t.toFixed(1)+' °C','Norma: 36.0–37.0'],['SpO₂','sp',v.sp+' %','Norma: ≥ 95'],['AQB','bp',v.bp,`Sistolik norma: ${c.norm.sbp[0]}–${c.norm.sbp[1]}`]].map(x=>`<div class="vit ${flag(x[1])?'abn':''}"><div class="eyebrow">${x[0]}</div><div class="v">${x[2]}</div><div class="nrm">${x[3]}</div></div>`).join('')}
   </div><p class="lead">Qizil bilan belgilangan ko'rsatkichlar yosh normasidan chetga chiqqan. Endi anamnez yig'ing: savollar soni ${BUDGET} ta bilan cheklangan, eng muhimlarini tanlang.</p>${navRow(null,1,'Anamnez yig\'ishni boshlash →')}`;
  case 1: { const left=BUDGET-st.asked.length;
   const chat = st.asked.length? st.asked.map(id=>{ const q=Q.find(x=>x.id===id); return `<div class="bub dr">${esc(q.t)}</div><div class="bub mom"><b>Onasi</b>${esc(c.hist[id]||"Bu borada alohida o'zgarish sezmadim, hammasi odatdagidek.")}</div>`; }).join('') : `<div class="empty">Chapdagi savollardan birini tanlang — onasining javobi shu yerda chiqadi.</div>`;
   return `<div class="eyebrow">2-bosqich</div><h2>Anamnez</h2>
   <div class="budget"><span>Qolgan savollar: <b>${left}</b> / ${BUDGET}</span><span class="dots">${Array.from({length:BUDGET},(_,i)=>`<i class="${i<st.asked.length?'used':''}"></i>`).join('')}</span></div>
   <div class="qa"><div class="qlist">${Q.map(q=>`<button class="q ${st.asked.includes(q.id)?'asked':''}" data-q="${q.id}" ${st.asked.includes(q.id)||left<=0||st.done?'disabled':''}><span class="cat">${q.cat}</span>${esc(q.t)}</button>`).join('')}</div>
   <div class="chat" id="chat">${chat}</div></div>${navRow(0,2)}`; }
  case 2: { const cur=st.exCur;
   return `<div class="eyebrow">3-bosqich</div><h2>Obyektiv ko'rik</h2><p class="lead">Chapdagi bola tasviridagi sohalarni bosing yoki pastdagi tugmalarni tanlang. Topilmalar ko'rik varag'iga yoziladi.</p>
   <div class="chips">${REG.map(r=>`<button class="chip ${st.exSeen.includes(r.id)?'seen':''} ${cur===r.id?'on':''}" data-reg="${r.id}">${r.t}</button>`).join('')}</div>
   ${cur?`<div class="finding"><div class="eyebrow">Topilma</div><h3>${REG.find(r=>r.id===cur).t}</h3><p style="margin:0">${esc(c.exam[cur]||REG_DEFAULT[cur])}</p></div>`:''}
   <div class="finding"><h3>Ko'rik varag'i</h3>${st.exSeen.length?`<div class="sheet">${st.exSeen.map(id=>`<div><b>${REG.find(r=>r.id===id).t}:</b> ${esc(c.exam[id]||REG_DEFAULT[id])}</div>`).join('')}</div>`:`<p class="muted" style="margin:0">Hali hech qaysi soha ko'rilmadi.</p>`}</div>${navRow(1,3)}`; }
  case 3: return auscPane();
  case 4: return testsPane();
  case 5: return dxPane();
  case 6: return resultPane();
  }
}
function auscPane(){
  const c=S.c, st=S.st, m=st.mode, opts=m==='perc'?PERC:m==='lung'?LUNG:HEART, k=st.pt, info=k&&k.split(':')[0]===m?ptInfo(k):null;
  const cnt=allKeys().filter(x=>x.startsWith(m+':')).length, done=allKeys().filter(x=>x.startsWith(m+':')&&st.ans[x]!=null).length;
  return `<div class="eyebrow">4-bosqich</div><h2>Perkussiya va auskultatsiya</h2>
  <p class="lead">Nuqtani bosing — tovush yangraydi (quloqchin bilan tinglang). Keyin nimani eshitganingizni belgilang. Hamma nuqtalarni tekshirish ball beradi.</p>
  <div><div class="mode" role="tablist">${[['perc',"O'pka perkussiyasi"],['lung',"O'pka auskultatsiyasi"],['heart',"Yurak auskultatsiyasi"]].map(x=>`<button class="${m===x[0]?'on':''}" data-mode="${x[0]}">${x[1]}</button>`).join('')}</div>
  <div class="muted" style="font-size:.84rem">Belgilangan: ${done} / ${cnt}</div></div>
  <div class="ausc"><div class="mapbox">
   ${m==='heart'?torsoMap('f',m,st,c):`<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">${torsoMap('f',m,st,c)}${torsoMap('b',m,st,c)}</div>`}
  </div>
  <div class="listen">${info?`<div class="eyebrow">${m==='perc'?'Perkussiya':'Stetoskop'}</div><h3 style="font-size:1rem">${esc(info.t)}</h3>
   <canvas id="wave" class="wave"></canvas><div class="phase"><span id="phase-now"></span><span>${m==='perc'?'Barmoq-barmoq perkussiyasi':m==='heart'?'YuQS '+Math.min(c.vit.hr,170)+' /min':'NS '+c.vit.rr+' /min'}</span></div>
   <div style="display:flex;gap:8px"><button class="btn" id="replay">▶ Qayta tinglash</button><button class="btn" id="stop">■ To'xtatish</button></div>
   <div class="opts">${Object.entries(opts).map(([kk,t])=>`<label class="opt ${st.ans[k]===kk?'chosen':''}"><input type="radio" name="ans" id="ans-${kk}" value="${kk}" ${st.ans[k]===kk?'checked':''} ${st.done?'disabled':''}>${t}</label>`).join('')}</div>
   <div class="synth">Sintez qilingan o'quv tovushi: haqiqiy yozuvdan farq qiladi, asosiy farqlarni (balandlik, davomiylik, faza) o'rgatadi.</div>`
   :`<div class="empty">Chapdagi xaritadan nuqtani tanlang.<br><br>${m==='heart'?'Yurak nuqtalari: 1 — mitral, 2 — aorta, 3 — o\'pka arteriyasi, 4 — trikuspidal, 5 — Botkin–Erb.':'O\'pkani simmetrik nuqtalarda solishtirib tekshiring.'}</div>`}
  </div></div>${navRow(2,4)}`;
}
function testsPane(){
  const c=S.c, st=S.st;
  const res=st.ordered.map(id=>{ const t=TESTS.find(x=>x.id===id); let r=c.tests[id]||TEST_NORMAL[id]; if(id==='spiro'&&c.ageY<5&&!c.tests[id]) r="Bemorning yoshi tufayli bajarib bo'lmaydi (5 yoshdan keyin).";
    let img=''; if(id==='xray') img=`<div class="img">${xraySVG(c.xray||'normal')}</div>`; if(id==='wrist'&&(c.wrist||c.id==='raxit')) img=`<div class="img">${wristSVG()}</div>`; if(id==='ecg') img=`<div class="ecgbox">${ecgSVG(c.vit.hr,c.ecgType)}</div>`;
    return `<div class="res"><h3>${t.t}</h3><p>${md(r)}</p>${img}</div>`; }).reverse().join('');
  return `<div class="eyebrow">5-bosqich</div><h2>Laborator va instrumental tekshiruvlar</h2>
  <p class="lead">Kerakli tekshiruvlarni belgilab, “Natijalarni olish”ni bosing. Asosli bo'lmagan har bir tekshiruv ball kamaytiradi — bolani ortiqcha muolajadan asrang.</p>
  <div class="tests">${TESTS.map(t=>{ const o=st.ordered.includes(t.id); return `<label class="test ${o?'ordered':''}"><input type="checkbox" id="t-${t.id}" data-test="${t.id}" ${o||st.pending.includes(t.id)?'checked':''} ${o||st.done?'disabled':''}><span>${t.t}</span></label>`; }).join('')}</div>
  <div><button class="btn primary" id="order" ${st.pending.length?'':'disabled'}>Natijalarni olish (${st.pending.length})</button></div>
  <div class="results">${res||`<p class="muted">Hali tekshiruv buyurilmagan.</p>`}</div>${navRow(3,5)}`;
}
function dxPane(){
  const c=S.c, st=S.st;
  return `<div class="eyebrow">6-bosqich</div><h2>Tashxis</h2>
  <div class="finding"><h3>Differensial tashxis</h3><p class="muted" style="margin:0 0 8px">Farqlash zarur bo'lgan kasalliklarni belgilang (3 tagacha).</p>
  <div class="dx">${c.dx.map((d,i)=>`<label class="opt ${st.ddx.includes(i)?'chosen':''}"><input type="checkbox" id="ddx-${i}" data-ddx="${i}" ${st.ddx.includes(i)?'checked':''} ${st.done||(!st.ddx.includes(i)&&st.ddx.length>=3)?'disabled':''}>${esc(d.t)}</label>`).join('')}</div></div>
  <div class="finding"><h3>Yakuniy klinik tashxis</h3><div class="dx">${c.dx.map((d,i)=>`<label class="opt ${st.fdx===i?'chosen':''}"><input type="radio" name="fdx" id="fdx-${i}" data-fdx="${i}" ${st.fdx===i?'checked':''} ${st.done?'disabled':''}>${esc(d.t)}</label>`).join('')}</div></div>
  ${st.done?navRow(4,6,'Natijani ko\'rish →'):`<div class="confirm">${st.confirm?`<span>Yakunlagandan keyin javoblarni o'zgartirib bo'lmaydi.</span><button class="btn danger" id="finish">Ha, yakunlash</button><button class="btn" id="cancel">Bekor qilish</button>`:`<button class="btn" data-go="4">← Orqaga</button><button class="btn primary" id="pre-finish" ${st.fdx==null?'disabled':''}>Qabulni yakunlash</button>`}</div>`}`;
}
function resultPane(){
  const c=S.c, st=S.st, g=grade(c,st), pct=g.total, R=52, C=2*Math.PI*R;
  const verdict = pct>=85?"A'lo darajada":pct>=70?"Yaxshi":pct>=50?"Qoniqarli":"Takrorlash kerak";
  const missQ=c.keyQ.filter(q=>!st.asked.includes(q)).map(q=>Q.find(x=>x.id===q).t);
  const missE=c.keyEx.filter(r=>!st.exSeen.includes(r)).map(r=>REG.find(x=>x.id===r).t);
  const wrong=allKeys().filter(k=>{ const t=truth(c,k); const def=defOf(c,k); return (t!==def||st.ans[k]!=null) && st.ans[k]!==t; });
  const optT=k=>({perc:PERC,lung:LUNG,heart:HEART})[k.split(':')[0]];
  const missT=c.keyT.filter(t=>!st.ordered.includes(t)).map(t=>TESTS.find(x=>x.id===t).t);
  const okI=c.dx.findIndex(d=>d.ok), right=st.fdx===okI;
  return `<div class="eyebrow">7-bosqich</div><h2>Natija</h2>
  <div class="scorebig"><svg class="gauge" viewBox="0 0 120 120"><circle cx="60" cy="60" r="${R}" fill="none" stroke="var(--surface2)" stroke-width="12"/><circle cx="60" cy="60" r="${R}" fill="none" stroke="${pct>=70?'var(--good)':pct>=50?'var(--warn)':'var(--bad)'}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${(C*pct/100).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 60 60)"/><text x="60" y="66" text-anchor="middle" font-size="26" font-weight="700" fill="var(--ink)" font-family="IBM Plex Mono,monospace">${pct}</text></svg>
  <div style="min-width:0"><div class="eyebrow">100 balldan</div><h2>${verdict}</h2></div>
  <div class="bars">${g.parts.map(p=>`<div class="bar"><span>${p[0]}</span><div class="track"><div class="fill" style="width:${(p[1]/p[2]*100).toFixed(0)}%"></div></div><span class="num">${p[1].toFixed(0)}/${p[2]}</span></div>`).join('')}</div></div>
  <div class="dxbox ${right?'':'wrong'}"><div class="eyebrow">${right?'To\'g\'ri tashxis':'Sizning tashxisingiz: '+esc(c.dx[st.fdx].t)}</div><h3 style="font-size:1.08rem;margin-top:4px">${esc(c.dx[okI].t)}</h3></div>
  <div class="fb"><h3>Klinik fikrlash</h3><p style="margin:0;max-width:80ch">${esc(c.explain)}</p></div>
  <div class="fb"><h3>Xatolar tahlili</h3><ul>
   <li>${missQ.length?`<span class="miss">O'tkazib yuborilgan muhim savollar:</span> ${missQ.map(esc).join('; ')}`:`<span class="ok">Barcha muhim anamnez savollari berildi.</span>`}</li>
   <li>${missE.length?`<span class="miss">Ko'rilmagan muhim sohalar:</span> ${missE.join('; ')}`:`<span class="ok">Barcha muhim sohalar ko'rildi.</span>`}</li>
   <li>${wrong.length?`<span class="miss">Perkussiya va auskultatsiyadagi xatolar yoki tekshirilmagan muhim nuqtalar:</span><ul style="margin-top:4px">${wrong.map(k=>`<li>${esc(ptInfo(k).t)} (${k.startsWith('perc')?'perkussiya':k.startsWith('lung')?'o\'pka':'yurak'}): to'g'ri javob — <b>${optT(k)[truth(c,k)]}</b>${st.ans[k]?`, siz: ${optT(k)[st.ans[k]]}`:', belgilanmagan'}</li>`).join('')}</ul>`:`<span class="ok">Fizikal topilmalar to'g'ri talqin qilindi.</span>`}</li>
   <li>${missT.length?`<span class="miss">Buyurilmagan zarur tekshiruvlar:</span> ${missT.join('; ')}`:`<span class="ok">Zarur tekshiruvlar buyurildi.</span>`}</li>
   ${g.unn.length?`<li><span class="miss">Asossiz tekshiruvlar:</span> ${g.unn.map(t=>TESTS.find(x=>x.id===t).t).join('; ')}</li>`:''}
   <li>Farqlash kerak bo'lgan kasalliklar: ${c.dx.filter(d=>d.ok||d.d).map(d=>esc(d.t)).join('; ')}.</li>
  </ul></div>
  <div class="fb"><h3>Esda tuting</h3><ul>${c.teach.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div>
  <div class="nav-row"><button class="btn" id="retry">↺ Bu bemorni qaytadan</button><button class="btn primary" id="next-case">Keyingi bemor →</button></div>`;
}

/* ============== HODISALAR ============== */
function go(i){ S.st.stage=i; render(); window.scrollTo({top:0,behavior:'smooth'}); }
function bindCommon(){
  const h=$('#home'); if(h) h.onclick=()=>{ S.view='home'; render(); };
  $('#norms').onclick=()=>{ const d=document.createElement('div'); d.className='drawer'; d.innerHTML=`<div class="in"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="font-size:1.3rem">Yosh normalari</h2><button class="btn" id="cl">Yopish</button></div>${normsTable()}</div>`; document.body.appendChild(d); const close=()=>d.remove(); d.querySelector('#cl').onclick=close; d.onclick=e=>{ if(e.target===d) close(); }; };
}
function bindHome(){ bindCommon(); document.querySelectorAll('[data-case]').forEach(b=>b.onclick=()=>openCase(CASES.find(c=>c.id===b.dataset.case)));
  document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{ S.filter=b.dataset.filter; S.clr=false; render(); });
  const cl=$('#clr'); if(cl) cl.onclick=()=>{ S.clr=true; render(); };
  const cy=$('#clr-yes'); if(cy) cy.onclick=()=>{ clearBest(); S.states={}; S.clr=false; render(); };
  const cn=$('#clr-no'); if(cn) cn.onclick=()=>{ S.clr=false; render(); }; }
function examine(reg){ const st=S.st; if(!st.exSeen.includes(reg)) st.exSeen.push(reg); st.exCur=reg; if(st.stage!==2) st.stage=2; render(); }
function selectPt(key){ const st=S.st, c=S.c; st.pt=key; render(); const [m]=key.split(':'); const t=truth(c,key);
  const sr=(ac()||{sampleRate:44100}).sampleRate;
  playKey(m+':'+t, ()=> m==='perc'? synthPerc(t,sr) : m==='lung'? synthBreath(t,c.vit.rr,sr) : synthHeart(t,c.vit.hr,sr)); }
function bindCase(){
  bindCommon(); const st=S.st, c=S.c;
  document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>go(+b.dataset.stage));
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(+b.dataset.go));
  document.querySelectorAll('.hot').forEach(h=>{ const r=h.dataset.reg; if(st.exSeen.includes(r)) h.classList.add('seen'); if(st.exCur===r&&st.stage===2) h.classList.add('on'); h.addEventListener('click',()=>examine(r)); });
  document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{ if(st.asked.length<BUDGET){ st.asked.push(b.dataset.q); render(); const ch=$('#chat'); if(ch) ch.scrollTop=ch.scrollHeight; } });
  document.querySelectorAll('.chip[data-reg]').forEach(b=>b.onclick=()=>examine(b.dataset.reg));
  document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{ st.mode=b.dataset.mode; st.pt=null; render(); });
  document.querySelectorAll('.pt').forEach(p=>{ p.addEventListener('click',()=>selectPt(p.dataset.pt)); p.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); selectPt(p.dataset.pt);} }); });
  document.querySelectorAll('input[name="ans"]').forEach(r=>r.onchange=()=>{ st.ans[st.pt]=r.value; document.querySelectorAll('.opt').forEach(o=>o.classList.toggle('chosen',o.querySelector('input').checked)); const g=document.querySelector(`[data-pt="${st.pt}"]`); if(g) g.classList.add('done'); });
  const rp=$('#replay'); if(rp) rp.onclick=()=>{ if(S.syn) play(S.syn); };
  const sp=$('#stop'); if(sp) sp.onclick=()=>{ stopSound(); drawWave(false); updPhase(''); };
  document.querySelectorAll('[data-test]').forEach(cb=>cb.onchange=()=>{ const id=cb.dataset.test; if(cb.checked){ if(!st.pending.includes(id)) st.pending.push(id);} else st.pending=st.pending.filter(x=>x!==id); const o=$('#order'); o.disabled=!st.pending.length; o.textContent=`Natijalarni olish (${st.pending.length})`; });
  const or=$('#order'); if(or) or.onclick=()=>{ st.ordered.push(...st.pending); st.pending=[]; render(); };
  document.querySelectorAll('[data-ddx]').forEach(cb=>cb.onchange=()=>{ const i=+cb.dataset.ddx; if(cb.checked){ if(st.ddx.length<3) st.ddx.push(i);} else st.ddx=st.ddx.filter(x=>x!==i); render(); });
  document.querySelectorAll('[data-fdx]').forEach(r=>r.onchange=()=>{ st.fdx=+r.dataset.fdx; render(); });
  const pf=$('#pre-finish'); if(pf) pf.onclick=()=>{ st.confirm=true; render(); };
  const cn=$('#cancel'); if(cn) cn.onclick=()=>{ st.confirm=false; render(); };
  const fi=$('#finish'); if(fi) fi.onclick=()=>{ st.done=true; st.confirm=false; setBest(c.id,grade(c,st).total); go(6); };
  const re=$('#retry'); if(re) re.onclick=()=>{ S.rconf=true; render(); window.scrollTo({top:0,behavior:'smooth'}); };
  const rs=$('#restart'); if(rs) rs.onclick=()=>{ S.rconf=true; render(); };
  const ry=$('#r-yes'); if(ry) ry.onclick=restartCase;
  const rn=$('#r-no'); if(rn) rn.onclick=()=>{ S.rconf=false; render(); };
  const hb=$('#hear'); if(hb) hb.onclick=()=>{ const sr=(ac()||{sampleRate:44100}).sampleRate; playKey('cough:'+c.sound, ()=>synthCough(c.sound,sr)); };
  const nx=$('#next-case'); if(nx) nx.onclick=()=>{ const i=CASES.indexOf(c); openCase(CASES[(i+1)%CASES.length]); };
}
let rT; window.addEventListener('resize',()=>{ clearTimeout(rT); rT=setTimeout(()=>{ if(S.view==='case'){ startMonitor(S.c); if(curBuf) drawWave(!!curSrc); } },200); });
render();
</script>

</body></html>
