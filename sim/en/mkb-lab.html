/* ---------- OT-PZR (real vaqt rejimida) ---------- */
/* opt:{target, ct, ic, neg:false, ask} */
function pcrInst(opt){
  return {steps:[`Extracting nucleic acid from the sample`,
                 `Preparing the reaction mixture and setting up the controls`,
                 `Amplification and reading the curves`,
                 `Interpreting the result by Ct`],
  doing:"We set up an RT-PCR. Viral RNA is converted into DNA by reverse transcriptase and then doubles in every cycle; the number of the cycle at which the fluorescence crosses the threshold (Ct) is inversely proportional to the initial copy number.",
  mount(ctx,box,base,next){
    const st={ext:false,mix:false,ctrl:0,run:false};
    box.append(el("h3",{},"Real-time RT-PCR"));
    const holder=el("div");box.append(holder);
    const curves=()=>{
      const W=420,H=230;let s=`<rect width="${W}" height="${H}" fill="#0E1512"/>`;
      s+=`<line x1="46" y1="12" x2="46" y2="190" stroke="#3A4A46" stroke-width="1.5"/>`;
      s+=`<line x1="46" y1="190" x2="404" y2="190" stroke="#3A4A46" stroke-width="1.5"/>`;
      for(let c=0;c<=40;c+=10)s+=`<text x="${46+c*8.9}" y="206" font-size="10" fill="#7E948F" text-anchor="middle">${c}</text>`;
      s+=`<text x="225" y="222" font-size="10.5" fill="#7E948F" text-anchor="middle">cycle</text>`;
      s+=`<text x="16" y="100" font-size="10.5" fill="#7E948F" transform="rotate(-90 16,100)" text-anchor="middle">fluorescence</text>`;
      s+=`<line x1="46" y1="130" x2="404" y2="130" stroke="#C8372D" stroke-width="1.2" stroke-dasharray="5 4"/>`;
      s+=`<text x="398" y="126" font-size="9.5" fill="#C8372D" text-anchor="end">threshold</text>`;
      if(!st.run)return svgEl(s,W,H);
      const curve=(ct,col,lbl,dash)=>{
        if(ct==null)return "";
        let d="";
        for(let c=0;c<=40;c++){
          const x=46+c*8.9;
          const y=190-168/(1+Math.exp(-(c-ct-3.2)/2.1));
          d+=(c?"L":"M")+x.toFixed(1)+","+y.toFixed(1);}
        return `<path d="${d}" fill="none" stroke="${col}" stroke-width="2.2" ${dash?'stroke-dasharray="4 3"':""}/>`
          +`<text x="${(46+(ct+6)*8.9).toFixed(0)}" y="${lbl==="IC"?"60":"44"}" font-size="10" fill="${col}">${lbl}${ct?" Ct "+ct.toFixed(1):""}</text>`;};
      s+=curve(opt.neg?null:opt.ct,"#5FC0AF",opt.target);
      s+=curve(opt.ic??28,"#E3B651","IC",true);
      s+=curve(18,"#6FA8E3","C+",true);
      if(opt.neg)s+=`<text x="225" y="100" font-size="12" fill="#8FA5A0" text-anchor="middle">patient sample: did not cross the threshold</text>`;
      return svgEl(s,W,H);};
    const redraw=()=>{holder.innerHTML="";holder.append(curves());};redraw();
    const bExt=el("button",{class:"btn sm",type:"button"},"Extracting nucleic acid");
    const bMix=el("button",{class:"btn sm",type:"button",disabled:true},"Reaction mixture + primer/probe");
    const bCtrl=el("button",{class:"btn sm",type:"button",disabled:true},"Setting up the controls (C+, C−, IC)");
    const bRun=el("button",{class:"btn sm pri",type:"button",disabled:true},"Starting the amplification (40 cycles)");
    box.append(el("div",{class:"ctl"},bExt,bMix),el("div",{class:"ctl"},bCtrl,bRun));
    bExt.onclick=()=>{st.ext=true;bExt.disabled=true;bMix.disabled=false;
      ctx.info("RNA was extracted from the sample (the internal control was added to the sample before extraction).");ctx.done(base);};
    bMix.onclick=()=>{st.mix=true;bMix.disabled=true;bCtrl.disabled=false;
      ctx.info("Master mix, reverse transcriptase, primers and a fluorescent probe were added.");};
    bCtrl.onclick=()=>{st.ctrl=1;bCtrl.disabled=true;bRun.disabled=false;
      ctx.ok("The positive (C+), negative (C−) and internal control (IC) were set up.");ctx.done(base+1);};
    bRun.onclick=()=>{
      if(!st.ctrl)ctx.err("Started without controls: the reliability of the result cannot be assessed");
      bRun.disabled=true;
      const T=timerBox(ctx,{label:"Amplification",target:45,speed:10});
      box.append(el("div",{class:"ctl"},T.el));
      T.onStop=()=>{st.run=true;redraw();ctx.done(base+2);
        ctx.msg(`<b>C+</b> Ct 18.0 · <b>C−</b> no signal · <b>IC</b> Ct ${fx(opt.ic??28,1)}`);
        ctx.msg(opt.neg?`<b>Patient sample:</b> ${opt.target} — no signal`
          :`<b>Patient sample:</b> ${opt.target} — Ct = ${fx(opt.ct,1)}`);
        ctx.rec.pcr={ct:opt.neg?null:opt.ct};
        ask();};
      T.start();
      const iv=setInterval(()=>{if(T.reached&&!T.stopped){clearInterval(iv);T.stop();}},300);
      ctx.onClean(()=>clearInterval(iv));};
    function ask(){
      const g=el("div",{class:"gate",style:"margin-top:10px"});
      g.append(el("div",{class:"q",html:md(opt.ask.q)}));
      const mcb=el("div",{class:"mc",style:"margin-top:4px"});
      opt.ask.opts.forEach((o,i)=>{
        const inp=el("input",{type:"radio",name:"pc"+base,value:String(i)});
        mcb.append(el("label",{},inp,el("span",{html:md(o)})));
        inp.onchange=()=>{
          $$("label",mcb).forEach((l,k)=>{if(k===opt.ask.ans)l.classList.add("ok");else if(k===i)l.classList.add("no");$("input",l).disabled=true;});
          if(i!==opt.ask.ans)ctx.err("The PCR result was interpreted incorrectly");else ctx.ok("The PCR result was interpreted correctly.");
          mcb.append(el("div",{class:"why",html:md(opt.ask.why)}));
          ctx.done(base+3);setTimeout(next,320);};});
      g.append(mcb);box.append(g);}
  }};}

/* ---------- Qon surtmasi: qalin tomchi va yupqa surtma ---------- */
/* opt:{thickKey,thinKey,ask,ask2,count:{target,why}} */
function filmInst(opt){
  return {steps:[`Preparing a thick drop and a thin smear`,
                 `Staining with Romanowsky–Giemsa`,
                 `Microscopy: finding the parasite and determining the species`,
                 `Calculating the level of parasitemia`],
  doing:"The gold standard for diagnosing malaria is the thick drop and thin smear. The thick drop is for **finding** the parasite (the erythrocytes are lysed and a large volume of blood is examined), while the thin smear is for **determining the species** (the cell structure is preserved).",
  mount(ctx,box,base,next){
    const st={thick:false,thin:false,fixErr:false,stained:false};
    box.append(el("h3",{},"Thick drop and thin smear"));
    const info=el("div",{class:"small muted",style:"margin-bottom:8px"},
      "Two preparations are made from fingertip blood.");
    box.append(info);
    const b1=el("button",{class:"btn sm",type:"button"},"Preparing the thick drop");
    const b2=el("button",{class:"btn sm",type:"button"},"Preparing the thin smear");
    box.append(el("div",{class:"ctl"},b1,b2));
    const fixRow=el("div",{class:"ctl",hidden:true});box.append(fixRow);
    const bFixThin=el("button",{class:"btn sm",type:"button"},"Fixing the thin smear with methanol");
    const bFixThick=el("button",{class:"btn sm",type:"button"},"Fixing the thick drop with methanol");
    fixRow.append(bFixThin,bFixThick);
    b1.onclick=()=>{st.thick=true;b1.disabled=true;ctx.info("Thick drop: 2–3 drops of blood were spread on the slide to the size of a coin and dried.");chk();};
    b2.onclick=()=>{st.thin=true;b2.disabled=true;ctx.info("Thin smear: a single-layer smear was prepared with a ground-edge slide at a 45° angle.");chk();};
    function chk(){if(st.thick&&st.thin){ctx.done(base);fixRow.hidden=false;}}
    bFixThin.onclick=()=>{bFixThin.disabled=true;ctx.ok("The thin smear was fixed with methanol — the erythrocytes are preserved, so the species can be determined.");stainOn();};
    bFixThick.onclick=()=>{bFixThick.disabled=true;st.fixErr=true;
      ctx.err("The thick drop was fixed: the erythrocytes are not lysed and the stained background hides the parasite — a thick drop is never fixed");};
    function stainOn(){stBox.hidden=false;}
    const stBox=el("div",{hidden:true,style:"margin-top:10px"});box.append(stBox);
    const bStain=el("button",{class:"btn sm pri",type:"button"},"Staining with Romanowsky–Giemsa for 30–45 min");
    stBox.append(el("div",{class:"ctl"},bStain));
    bStain.onclick=()=>{bStain.disabled=true;st.stained=true;ctx.done(base+1);
      ctx.ok("Both preparations were stained with Giemsa: the parasite nucleus is red-purple, the cytoplasm is blue.");
      mic();};
    function mic(){
      const wrap=el("div",{style:"margin-top:12px"});box.append(wrap);
      wrap.append(el("h3",{},"Microscopy"));
      const tabs=el("div",{class:"chips"});
      const area=el("div",{style:"margin-top:8px"});
      /* ikkala preparat bir marta yaratiladi va yashirib-ko'rsatiladi —
         shunda almashganda moy va ob'ektiv holati saqlanadi */
      const views={};
      const mk=which=>{
        const M=microscope(ctx,{key:which==="thick"?opt.thickKey:opt.thinKey,
          hint:which==="thick"?"Thick drop: look for the parasite":"Thin smear: look at the forms inside the erythrocytes",
          onObj(o,oiled){if(o===100&&oiled&&!ctx.isDone(base+2)){ctx.done(base+2);askQ();}}});
        area.append(M.el);return M;};
      const show=which=>{
        if(!views[which])views[which]=mk(which);
        Object.keys(views).forEach(k=>views[k].el.hidden=(k!==which));};
      [["thick","Thick drop"],["thin","Thin smear"]].forEach(([k,n],i)=>{
        const b=el("button",{class:"chip"+(i===0?" on":""),type:"button"},n);
        b.onclick=()=>{$$(".chip",tabs).forEach(x=>x.classList.remove("on"));b.classList.add("on");show(k);};
        tabs.append(b);});
      wrap.append(tabs,area);show("thick");
      let asked=false;
      function askQ(){
        if(asked)return;asked=true;
        const qs=[opt.ask,opt.ask2].filter(Boolean);let qi=0;
        const put=()=>{
          if(qi>=qs.length){doCount();return;}
          const q=qs[qi++];
          const g=el("div",{class:"gate",style:"margin-top:10px"});
          g.append(el("div",{class:"q",html:md(q.q)}));
          const mcb=el("div",{class:"mc",style:"margin-top:4px"});
          q.opts.forEach((o,i)=>{
            const inp=el("input",{type:"radio",name:"fl"+base+"_"+qi,value:String(i)});
            mcb.append(el("label",{},inp,el("span",{html:md(o)})));
            inp.onchange=()=>{
              $$("label",mcb).forEach((l,k)=>{if(k===q.ans)l.classList.add("ok");else if(k===i)l.classList.add("no");$("input",l).disabled=true;});
              if(i!==q.ans)ctx.err("The microscopic picture was judged incorrectly");else ctx.ok(q.okMsg||"Identified correctly.");
              mcb.append(el("div",{class:"why",html:md(q.why)}));
              setTimeout(put,300);};});
          g.append(mcb);wrap.append(g);};
        put();}
      function doCount(){
        if(!opt.count){ctx.done(base+3);setTimeout(next,300);return;}
        const g=el("div",{class:"gate",style:"margin-top:10px"});
        g.append(el("div",{class:"q",html:md(opt.count.q)}));
        const inp=el("input",{inputmode:"decimal",placeholder:"%",style:"min-height:40px;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface);max-width:150px;font-family:var(--f-mono)"});
        const b=el("button",{class:"btn sm pri",type:"button"},"Count");
        const fb=el("div",{class:"fb small",style:"margin-top:6px"});
        g.append(el("div",{class:"ctl"},inp,el("span",{class:"u small muted"},"%"),b),fb);
        wrap.append(g);
        b.onclick=()=>{const v=num(inp.value);if(!Number.isFinite(v)){toast("Enter a number");return;}
          const okq=near(v,opt.count.target,0.25,0.3);
          if(!okq)ctx.err("Parasitemia was calculated incorrectly");else ctx.ok("Parasitemia was calculated correctly.");
          fb.className="fb small "+(okq?"ok":"no");

/* opt:{rows:[[n,val,norm,flag]], asks:[{q,opts,ans,why}]} */
/* opt.steps — ikkita qadam nomi, opt.title — sarlavha, opt.btn — tugma yozuvi */
function immunoInst(opt){
  const ST=opt.steps||[`Obtaining the immunogram parameters`,`Comparing the results with the reference and interpreting`];
  return {steps:ST,
  doing:opt.doing||"The immunogram is a test that assesses the main arms of the immune system at once: cellular (T, B and NK cells, CD markers), humoral (immunoglobulins) and phagocytic.",
  mount(ctx,box,base,next){
    box.append(el("h3",{},opt.title||"Immunogram"));
    if(opt.ref)box.append(photo(opt.ref,opt.refCap));
    const b=el("button",{class:"btn sm pri",type:"button"},opt.btn||"Obtaining the flow cytometry and ELISA results");
    box.append(el("div",{class:"ctl"},b));
    const area=el("div",{style:"margin-top:8px"});box.append(area);
    b.onclick=()=>{b.disabled=true;ctx.done(base);
      area.append(table(["Parameter","Result","Reference"],opt.rows.map(r=>
        [r[0],{h:r[1],cls:r[3]||""},r[2]])));
      opt.rows.filter(r=>r[3]).forEach(r=>ctx.msg(`<b>${r[0]}:</b> ${r[1]} (reference ${r[2]})`));
      ctx.rec.immuno=opt.rows;
      let qi=0;
      const put=()=>{
        if(qi>=opt.asks.length){ctx.done(base+1);setTimeout(next,300);return;}
        const q=opt.asks[qi++];
        const g=el("div",{class:"gate",style:"margin-top:10px"});
        g.append(el("div",{class:"q",html:md(q.q)}));
        const mcb=el("div",{class:"mc",style:"margin-top:4px"});
        q.opts.forEach((o,i)=>{
          const inp=el("input",{type:"radio",name:"im"+base+"_"+qi,value:String(i)});
          mcb.append(el("label",{},inp,el("span",{html:md(o)})));
          inp.onchange=()=>{
            $$("label",mcb).forEach((l,k)=>{if(k===q.ans)l.classList.add("ok");else if(k===i)l.classList.add("no");$("input",l).disabled=true;});
            if(i!==q.ans)ctx.err("The immunogram was interpreted incorrectly");else ctx.ok("Interpreted correctly.");
            mcb.append(el("div",{class:"why",html:md(q.why)}));
            setTimeout(put,300);};});
        g.append(mcb);area.append(g);};
      put();};
  }};}

      "**Romanowsky–Giemsa stain:** an azure–eosin mixture — the parasite **nucleus is red-violet** and the **cytoplasm is blue**.",
