<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Physiology Laboratory</title>
<meta name="description" content="Normal physiology: a virtual laboratory based on 15 lab exercises — step-by-step work with instruments, measuring, calculating and evaluating the result">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --sunk:#E3E8ED; --ink:#15202B; --muted:#5A6B7B; --line:#CDD6DF;
  --accent:#1F5FA0; --accent-soft:#DCE8F5; --on-accent:#FFFFFF;
  --bad:#B03A32; --bad-soft:#F7E1DE; --good:#2A7A4A; --good-soft:#DDF0E3; --warn:#946200; --warn-soft:#F6ECD2;
  --bench:#D9DEE3; --bench2:#C9D0D7;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F151B; --surface:#17202A; --sunk:#0C1217; --ink:#E3EAF1; --muted:#97A7B7; --line:#2A3846;
  --accent:#6FA8E3; --accent-soft:#193049; --on-accent:#06131F;
  --bad:#EA8A80; --bad-soft:#3A1F1C; --good:#73C99A; --good-soft:#163222; --warn:#E3B651; --warn-soft:#352A12;
  --bench:#26313C; --bench2:#1E2832; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F151B; --surface:#17202A; --sunk:#0C1217; --ink:#E3EAF1; --muted:#97A7B7; --line:#2A3846;
  --accent:#6FA8E3; --accent-soft:#193049; --on-accent:#06131F;
  --bad:#EA8A80; --bad-soft:#3A1F1C; --good:#73C99A; --good-soft:#163222; --warn:#E3B651; --warn-soft:#352A12;
  --bench:#26313C; --bench2:#1E2832; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.55}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(1.6rem,4vw,2.3rem);font-weight:800}
h2{font-size:1.35rem;font-weight:800}
h3{font-size:1.02rem;font-weight:600}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-left,0px)) 40px max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono)}
.small{font-size:.86rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:7px 14px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:.93rem;line-height:1.2;text-align:center}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.sm{min-height:34px;padding:5px 10px;font-size:.86rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.on{background:var(--accent-soft);border-color:var(--accent);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
/* bosh sahifa */
.hero{padding:6px 0 14px}
.hero p{max-width:760px;margin-top:6px}
.grp{margin-top:18px}
.grp h2{font-size:1.05rem;margin-bottom:8px;color:var(--muted);font-family:var(--f-body);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.case{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;width:100%}
.case:hover{border-color:var(--accent)}
.case .no{flex:0 0 auto;width:38px;height:38px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-family:var(--f-mono)}
.case .t{font-weight:600;line-height:1.3}
.case .s{font-size:.84rem;color:var(--muted);margin-top:3px}
.case .sc{font-size:.8rem;margin-top:5px;font-weight:600}
.case .sc.ok{color:var(--good)} .case .sc.mid{color:var(--warn)}
/* holat sahifasi */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.top h1{font-size:clamp(1.2rem,3vw,1.6rem);flex:1 1 300px}
.subj{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:var(--r);padding:10px 14px;margin-bottom:12px}
.lay{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px;align-items:start}
@media (max-width:980px){.lay{grid-template-columns:minmax(0,1fr)}}
.stage{background:linear-gradient(180deg,var(--bench),var(--bench2));border:1px solid var(--line);border-radius:var(--r);padding:12px;min-width:0}
.stage .sv{display:block;width:100%;height:auto;background:#F4F6F8;border-radius:8px;border:1px solid #B9C3CC}
.stage canvas{display:block;width:100%;border-radius:8px;border:1px solid #B9C3CC;background:#fff;touch-action:manipulation}
.panel{display:flex;flex-direction:column;gap:12px;min-width:0}
.steps ol{margin:6px 0 0;padding:0;list-style:none;counter-reset:s}
.steps li{position:relative;padding:5px 0 5px 32px;font-size:.9rem;line-height:1.35;counter-increment:s}
.steps li::before{content:counter(s);position:absolute;left:0;top:4px;width:23px;height:23px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:.75rem;font-weight:600;color:var(--muted)}
.steps li.cur::before{border-color:var(--accent);color:var(--accent)}
.steps li.done{color:var(--muted)}
.steps li.done::before{content:"✓";background:var(--good);border-color:var(--good);color:#fff}
.log{max-height:220px;overflow:auto;font-size:.88rem;display:flex;flex-direction:column;gap:5px}
.log div{padding:6px 9px;border-radius:7px;background:var(--sunk);line-height:1.35}
.log .err{background:var(--bad-soft);color:var(--bad)}
.log .ok{background:var(--good-soft);color:var(--good)}
.log .pt{background:var(--warn-soft)}
.jr label{display:block;font-size:.88rem;margin:9px 0 3px;font-weight:500;line-height:1.3}
.jr .inp{display:flex;gap:6px;align-items:center}
.jr input,.jr select{width:100%;min-height:38px;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.jr input{max-width:150px;font-family:var(--f-mono)}
.jr .u{font-size:.85rem;color:var(--muted);white-space:nowrap}
.jr .fb{font-size:.82rem;margin-top:3px;line-height:1.35}
.jr .fb.ok{color:var(--good)} .jr .fb.no{color:var(--bad)}
.mc label{display:flex;gap:8px;align-items:flex-start;font-weight:400;margin:6px 0;padding:7px 9px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.mc input{width:auto;min-height:0;margin-top:4px}
.mc label.ok{border-color:var(--good);background:var(--good-soft)}
.mc label.no{border-color:var(--bad);background:var(--bad-soft)}
.res{border-radius:var(--r);padding:12px 14px;border:1px solid var(--line);background:var(--surface)}
.res .big{font-family:var(--f-display);font-size:1.6rem;font-weight:800}
.res.good{border-color:var(--good)} .res.mid{border-color:var(--warn)} .res.low{border-color:var(--bad)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.ctl .grpc{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:6px 8px}
.ctl .lbl{font-size:.8rem;color:var(--muted);font-weight:600;margin-right:2px}
.stp{display:inline-flex;align-items:center;gap:4px}
.stp .v{min-width:74px;text-align:center;font-family:var(--f-mono);font-weight:600;background:#0F1A12;color:#7CFF9A;border-radius:6px;padding:5px 8px;font-size:.95rem}
.stp button{min-width:36px;min-height:34px;border-radius:7px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.note{font-size:.84rem;color:var(--muted);margin-top:8px;line-height:1.4}
.clock{font-family:var(--f-mono);font-weight:600;background:#111;color:#FFB347;border-radius:6px;padding:5px 9px;min-width:84px;text-align:center}
.hl{outline:3px solid #F2B705;outline-offset:2px}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:9px;font-size:.9rem;z-index:50;max-width:min(92vw,520px);text-align:center}
.tbl{border-collapse:collapse;font-size:.86rem;width:100%}
.tbl td,.tbl th{border:1px solid var(--line);padding:4px 7px;text-align:left}
.tbl th{background:var(--sunk);font-weight:600}
svg text{font-family:var(--f-body)}
.clk{cursor:pointer}
.clk:hover{filter:brightness(1.08)}
</style>
</head><body>
<div class="wrap" id="app"></div>
<script>
"use strict";
/* ===== Yordamchilar ===== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const NS="http://www.w3.org/2000/svg";
function el(tag,attrs={},...kids){const e=document.createElement(tag);for(const k in attrs){if(k==="html")e.innerHTML=attrs[k];else if(k.startsWith("on"))e.addEventListener(k.slice(2),attrs[k]);else if(attrs[k]!==false&&attrs[k]!=null)e.setAttribute(k,attrs[k]===true?"":attrs[k]);}for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(c));}return e;}
function sv(tag,attrs={},parent){const e=document.createElementNS(NS,tag);for(const k in attrs){if(k==="text")e.textContent=attrs[k];else e.setAttribute(k,attrs[k]);}if(parent)parent.appendChild(e);return e;}
function svgRoot(w,h){const s=document.createElementNS(NS,"svg");s.setAttribute("viewBox",`0 0 ${w} ${h}`);s.setAttribute("class","sv");return s;}
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const fx=(x,d=1)=>(+x).toFixed(d);
const num=s=>{if(s==null)return NaN;s=String(s).trim().replace(/\s/g,"").replace(",",".");if(s==="")return NaN;return Number(s);};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(t){const o=$(".toast");if(o)o.remove();const d=el("div",{class:"toast"},t);document.body.append(d);setTimeout(()=>d.remove(),2600);}
const store={get(k,d){try{const v=localStorage.getItem("tq:fzl:"+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem("tq:fzl:"+k,JSON.stringify(v));}catch(e){}}};

/* ===== Simulyatsiya soati (tezlashtirish bilan) ===== */
function makeClock(onTick){
  const c={t:0,speed:1,run:false,last:0,raf:0,
    start(){if(c.run)return;c.run=true;c.last=performance.now();c.raf=requestAnimationFrame(c.loop);},
    stop(){c.run=false;cancelAnimationFrame(c.raf);},
    loop(now){if(!c.run)return;const dt=Math.min(0.25,(now-c.last)/1000)*c.speed*(window.__TS||1);c.last=now;c.t+=dt;onTick&&onTick(c.t,dt);if(c.run)c.raf=requestAnimationFrame(c.loop);},
    reset(){c.stop();c.t=0;}};
  return c;
}
const mmss=t=>{t=Math.max(0,Math.floor(t));return String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0");};

/* ===== Stepper (asbob tugmasi) ===== */
function stepper({label,val,min,max,steps=[1],fmt=v=>v,onChange}){
  const box=el("span",{class:"stp"});const v=el("span",{class:"v"});
  let cur=val;const show=()=>v.textContent=fmt(cur);
  const mk=(d,t)=>el("button",{type:"button","aria-label":label+" "+t,onclick:()=>{const n=Math.round((cur+d)*1e6)/1e6;if(n<min-1e-9||n>max+1e-9)return;cur=n;show();onChange&&onChange(cur);}},t);
  const big=steps[1],sm=steps[0];
  if(big)box.append(mk(-big,"«"));box.append(mk(-sm,"−"),v,mk(sm,"+"));if(big)box.append(mk(big,"»"));
  show();
  box.get=()=>cur;box.set=x=>{cur=x;show();};
  return box;
}
function ctlGroup(label,...kids){return el("div",{class:"grpc"},el("span",{class:"lbl"},label),...kids);}

/* ===== Asosiy dvigatel ===== */
const CASES=[];
const GROUPS=["Excitable tissues","Blood physiology","Heart and blood vessels","Respiratory physiology","Analyzers and higher nervous activity"];
const app=$("#app");
let CUR=null; // joriy holat konteksti

function home(){
  if(CUR&&CUR.cleanup)CUR.cleanup();CUR=null;const ot=$(".toast");if(ot)ot.remove();
  app.innerHTML="";
  const best=store.get("best",{});
  const done=CASES.filter(c=>best[c.id]!=null).length;
  app.append(el("div",{class:"hero"},
    el("h1",{},"Physiology Laboratory"),
    el("p",{class:"muted"},"15 virtual cases based on the laboratory exercises in the normal physiology manual. In each one you work step by step with the instruments, measure, calculate and evaluate the result. If the sequence is violated or a step is done incorrectly, it is recorded as an error in the laboratory notebook."),
    el("p",{class:"small",style:"margin-top:8px"},`Completed: ${done} / ${CASES.length}`)));
  GROUPS.forEach((g,gi)=>{
    const list=CASES.filter(c=>c.grp===gi);if(!list.length)return;
    const grid=el("div",{class:"cases"});
    list.forEach(c=>{const b=best[c.id];
      grid.append(el("button",{class:"case",type:"button",onclick:()=>{location.hash="#"+c.id;}},
        el("span",{class:"no"},String(c.no).padStart(2,"0")),
        el("span",{},el("div",{class:"t"},c.title),el("div",{class:"s"},c.short),
          b!=null?el("div",{class:"sc "+(b>=85?"ok":"mid")},`Best result: ${b} %`):null)));});
    app.append(el("section",{class:"grp"},el("h2",{},g),grid));
  });
  window.scrollTo(0,0);
}

function openCase(c){
  if(CUR&&CUR.cleanup)CUR.cleanup();const ot=$(".toast");if(ot)ot.remove();
  app.innerHTML="";
  const P=c.gen();
  const ctx={c,P,rec:{},errs:[],stepDone:c.steps.map(()=>false),cleanups:[],checked:false};
  CUR=ctx;
  ctx.cleanup=()=>{ctx.cleanups.forEach(f=>{try{f();}catch(e){}});ctx.cleanups=[];};
  const stepsOl=el("ol");
  const logBox=el("div",{class:"log","aria-live":"polite"});
  const stage=el("div",{class:"stage"});
  const jr=el("div",{class:"card jr"});
  const resBox=el("div");
  ctx.stage=stage;
  ctx.msg=(t,k="")=>{const d=el("div",{class:k},t);logBox.append(d);logBox.scrollTop=logBox.scrollHeight;};
  ctx.say=t=>ctx.msg("🗣 "+t,"pt");
  ctx.err=t=>{if(ctx.checked)return;ctx.errs.push(t);ctx.msg("✗ "+t,"err");toast(t);};
  ctx.ok=t=>ctx.msg("✓ "+t,"ok");
  ctx.renderSteps=()=>{stepsOl.innerHTML="";const cur=ctx.stepDone.indexOf(false);
    c.steps.forEach((s,i)=>stepsOl.append(el("li",{class:ctx.stepDone[i]?"done":(i===cur?"cur":"")},s)));};
  ctx.done=i=>{if(!ctx.stepDone[i]){ctx.stepDone[i]=true;ctx.renderSteps();}};
  ctx.isDone=i=>ctx.stepDone[i];
  ctx.need=(i,silent)=>{for(let k=0;k<i;k++)if(!ctx.stepDone[k]&&!(c.optional||[]).includes(k)){if(!silent)ctx.err(`First complete step ${k+1}: «${c.steps[k]}»`);return false;}return true;};
  ctx.onClean=f=>ctx.cleanups.push(f);

  app.append(el("div",{class:"top"},
    el("button",{class:"btn sm",type:"button",onclick:()=>{location.hash="";}},"← Cases"),
    el("h1",{},`${c.no}. ${c.title}`),
    el("button",{class:"btn sm",type:"button",onclick:()=>openCase(c)},"↻ New subject")));
  app.append(el("div",{class:"subj",html:c.subj(P)}));
  const lay=el("div",{class:"lay"});
  const panel=el("div",{class:"panel"},
    el("div",{class:"card steps"},el("h3",{},"Procedure"),stepsOl),
    el("div",{class:"card"},el("h3",{},"Laboratory notebook"),logBox),
    jr,resBox);
  lay.append(stage,panel);app.append(lay);
  ctx.renderSteps();
  c.build(ctx);
  buildJournal(ctx,jr,resBox);
  window.scrollTo(0,0);
}

function buildJournal(ctx,jr,resBox){
  const c=ctx.c;
  jr.append(el("h3",{},"Results report"));
  const fields=c.journal(ctx);
  ctx.fields=fields;
  fields.forEach(f=>{
    let inp;
    if(f.type==="sel"){inp=el("select",{id:"f_"+f.id},el("option",{value:""},"— select —"),...f.options.map((o,i)=>el("option",{value:String(i)},o)));}
    else inp=el("input",{id:"f_"+f.id,inputmode:"decimal",autocomplete:"off",placeholder:f.ph||""});
    f.inp=inp;f.fb=el("div",{class:"fb"});
    jr.append(el("label",{for:"f_"+f.id},f.label),el("div",{class:"inp"},inp,f.unit?el("span",{class:"u"},f.unit):null),f.fb);
  });
  const mc=c.mc(ctx);ctx.mcq=mc;
  const mcBox=el("div",{class:"mc"});
  mcBox.append(el("label",{style:"border:0;padding:0;margin-top:12px;font-weight:600;cursor:default"},mc.q));
  mc.opts.forEach((o,i)=>{const l=el("label",{},el("input",{type:"radio",name:"mc",value:String(i)}),el("span",{},o));mcBox.append(l);});
  jr.append(mcBox);
  const btn=el("button",{class:"btn pri",type:"button",style:"margin-top:12px;width:100%"},"Check the result");
  jr.append(btn);
  btn.onclick=()=>{
    if(ctx.checked)return;
    const empty=fields.filter(f=>f.inp.value==="");
    const mcSel=$("input[name=mc]:checked",mcBox);
    if(empty.length||!mcSel){toast("Fill in all fields and select a conclusion");return;}
    // bajarilmagan bosqichlar
    const miss=c.steps.map((s,i)=>(!ctx.stepDone[i]&&!(c.optional||[]).includes(i)&&!(c.noJournalStep===i))?s:null).filter(Boolean);
    let got=0,tot=fields.length+1;
    fields.forEach(f=>{const v=f.type==="sel"?Number(f.inp.value):num(f.inp.value);
      let r;try{r=f.check(v,ctx);}catch(e){r=[false,"could not be checked"];}
      const [ok,right]=r;if(ok)got++;
      f.fb.className="fb "+(ok?"ok":"no");f.fb.textContent=(ok?"✓ Correct. ":"✗ Incorrect. ")+(right||"");f.inp.disabled=true;});
    const sel=Number(mcSel.value);
    $$("label",mcBox).slice(1).forEach((l,i)=>{if(i===mc.ans)l.classList.add("ok");else if(i===sel)l.classList.add("no");$("input",l).disabled=true;});
    if(sel===mc.ans)got++;
    ctx.checked=true;
    miss.forEach(s=>ctx.errs.push("Step not completed: «"+s+"»"));
    if(c.extraErrs)c.extraErrs(ctx).forEach(e=>ctx.errs.push(e));
    if(c.after)try{c.after(ctx);}catch(e){}
    const pen=Math.min(0.5,0.08*ctx.errs.length);
    const pct=Math.max(0,Math.round(100*(got/tot)*(1-pen)));
    const best=store.get("best",{});if(best[c.id]==null||pct>best[c.id]){best[c.id]=pct;store.set("best",best);}
    btn.disabled=true;
    const cls=pct>=85?"good":pct>=60?"mid":"low";
    resBox.innerHTML="";
    resBox.append(el("div",{class:"res "+cls},
      el("div",{class:"big"},pct+" %"),
      el("div",{class:"small"},`Correct answers: ${got} / ${tot}. Procedure errors: ${ctx.errs.length}${ctx.errs.length?" (each one lowers the result by 8 %, by 50 % at most)":""}.`),
      ctx.errs.length?el("ul",{class:"small",style:"margin:8px 0 0;padding-left:18px"},...ctx.errs.map(e=>el("li",{},e))):null,
      el("div",{class:"small",style:"margin-top:10px",html:"<b>Explanation.</b> "+mc.why}),
      c.explain?el("div",{class:"small",style:"margin-top:8px",html:c.explain(ctx)}):null,
      el("div",{class:"row",style:"margin-top:12px"},
        el("button",{class:"btn pri sm",type:"button",onclick:()=>openCase(c)},"Retry with a new subject"),
        el("button",{class:"btn sm",type:"button",onclick:()=>{location.hash="";}},"List of cases"))));
    resBox.scrollIntoView({behavior:"smooth",block:"nearest"});
  };
}
/* Tekshirish yordamchilari */
const near=(v,t,tol)=>Number.isFinite(v)&&Math.abs(v-t)<=tol+1e-9;
function chk(t,tol,txt){return v=>[near(v,t,tol),txt||("Correct value: "+t)];}

/* qurumlangan kimogramma lentasi */
function kymo(w,h,label){
  const cv=el("canvas",{width:w,height:h,style:"background:#141414"});
  const g=cv.getContext("2d");
  g.fillStyle="#141414";g.fillRect(0,0,w,h);
  if(label){g.fillStyle="#9A9A9A";g.font="13px IBM Plex Sans, sans-serif";g.fillText(label,8,16);}
  return {cv,g,w,h};
}

CASES.push({id:"c01",no:1,grp:0,
  title:"Stimulation threshold and the law of strength",
  short:"Frog nerve–muscle preparation, electrostimulator, kymograph",
  gen(){const Tn=0.05*ri(5,12),Mn=Tn+0.05*ri(18,30);const Tm=Math.round(Tn*rnd(2.4,3.2)/0.05)*0.05,Mm=Tm+0.05*ri(20,30);

  subj:P=>`<b>Object:</b> a frog nerve–muscle preparation (sciatic nerve + gastrocnemius muscle). <b>Task:</b> by stimulating the nerve indirectly and the muscle directly, determine their stimulation thresholds and the maximal stimulus strength for stimulation through the nerve, and demonstrate the law of strength.`,
  steps:["Fix the preparation in the clamp and connect its tendon to the myograph lever","Moisten the preparation with Ringer's solution","Place the electrodes on the sciatic nerve (indirect stimulation)","Slowly raise the voltage from zero to find the threshold of the nerve","Raise the strength to show the maximal contraction and that the amplitude does not grow at supramaximal strength","Move the electrodes to the muscle and raise the voltage from zero to find the threshold of the muscle"],
  build(ctx){const P=ctx.P,R=ctx.rec;R.n=[];R.m=[];
    const nm=nmSetup(ctx);ctx.stage.append(nm.svg);
    const K=kymo(900,250,"Kymogram (single twitches; the drum is advanced by hand; 1 mm = 4 px)");ctx.stage.append(el("div",{style:"margin-top:10px"},K.cv));
    // shkala
    const g=K.g;g.strokeStyle="#666";g.fillStyle="#888";g.font="10px IBM Plex Mono, monospace";
    for(let mm=0;mm<=45;mm+=5){const y=220-mm*4;g.beginPath();g.moveTo(30,y);g.lineTo(mm%10?36:40,y);g.stroke();if(mm%10===0)g.fillText(mm+" mm",42,y+3);}
    g.strokeStyle="#555";g.beginPath();g.moveTo(90,220);g.lineTo(890,220);g.stroke();
    let x=96,stimCnt=0,wetAt=-1;
    const amp=V=>{const T=nm.elec==="nerv"?P.Tn:P.Tm,M=nm.elec==="nerv"?P.Mn:P.Mm;if(V<T-1e-9)return 0;return 1.5+38.5*clamp((V-T)/(M-T),0,1);};
    const vol=stepper({label:"Voltage",val:0,min:0,max:6,steps:[0.05,0.5],fmt:v=>fx(v,2)+" V"});
    const bMount=el("button",{class:"btn sm",type:"button",onclick:()=>{nm.mounted=true;nm.draw();ctx.done(0);ctx.ok("The preparation was fixed in the clamp and its tendon was connected to the lever with a thread.");}},"Mount the preparation");
    const bWet=el("button",{class:"btn sm",type:"button",onclick:()=>{if(!nm.mounted){ctx.err("Mount the preparation first");return;}nm.wet();wetAt=stimCnt;ctx.done(1);ctx.ok("The preparation was moistened with Ringer's solution.");}},"Moisten with Ringer's solution");
    const bN=el("button",{class:"btn sm",type:"button",onclick:()=>setEl("nerv")},"Electrodes → nerve");
    const bM=el("button",{class:"btn sm",type:"button",onclick:()=>setEl("muskul")},"Electrodes → muscle");
    function setEl(w){if(!ctx.need(2))return;if(w==="muskul"&&!ctx.isDone(4)){ctx.err("First determine the threshold and maximal strength through the nerve (steps 3–5)");return;}
      nm.elec=w;nm.draw();bN.classList.toggle("on",w==="nerv");bM.classList.toggle("on",w==="muskul");
      if(w==="nerv")ctx.done(2);ctx.msg(w==="nerv"?"The electrodes were placed on the sciatic nerve.":"Needle electrodes were inserted into the muscle (direct stimulation).");
      vol.set(0);mark(w);}
    function mark(w){g.fillStyle="#BBB";g.font="11px IBM Plex Sans, sans-serif";g.fillText(w==="nerv"?"nerv":"muskul",x,236);x+=6;}
    const bStim=el("button",{class:"btn pri sm",type:"button",onclick:stim},"⚡ Single stimulus");
    function stim(){
      if(!nm.mounted){ctx.err("The preparation is not mounted");return;}
      if(!nm.elec){ctx.err("The electrodes are not placed on the preparation");return;}
      if(wetAt<0){ctx.err("The preparation is not moistened with Ringer's solution — it dries quickly and loses its excitability");wetAt=stimCnt;}
      const V=vol.get();const A=amp(V);stimCnt++;
      if(stimCnt-wetAt>40&&stimCnt%10===0)ctx.msg("Note: moisten the preparation with Ringer's solution from time to time so that it does not dry out.","pt");
      const arr=nm.elec==="nerv"?R.n:R.m;arr.push({V,A});

      g.strokeStyle="#F2F2F2";g.lineWidth=1.6;g.beginPath();g.moveTo(x,220);g.lineTo(x,220-A*4);g.stroke();
      g.fillStyle="#9A9A9A";g.font="9px IBM Plex Mono, monospace";g.save();g.translate(x+3,246);g.rotate(-Math.PI/2);g.fillText(fx(V,2),0,0);g.restore();
      x+=11;
      const T=nm.elec==="nerv"?P.Tn:P.Tm;
      if(arr.length===1&&A>0){ctx.err("To determine the threshold, the voltage had to be raised slowly starting from zero (from subthreshold values)");}
      ctx.msg(`${fx(V,2)} V → ${A>0?"contraction, amplitude ≈ "+fx(A,1)+" mm":"no contraction"}`);
      // bosqichlar

  journal:ctx=>{const P=ctx.P;return[

    {id:"tm",label:"Stimulation threshold of the muscle (direct)",unit:"V",check:v=>[near(v,P.Tm,0.05),"Threshold: "+fx(P.Tm,2)+" V"]}];},
  mc:()=>({q:"Conclusion: what do the results show?",opts:[
    "The threshold of the nerve is low — its excitability is higher than that of the muscle; the amplitude increases from threshold to maximum because more and more muscle fibers are excited (law of strength)",
    "The threshold of the muscle is low — its excitability is higher than that of the nerve; the increase in amplitude depends on the contraction force of each fiber increasing",
    "The whole muscle obeys the \"all-or-none\" law, so the amplitude does not depend on strength",
    "The higher the threshold, the higher the excitability"],ans:0,
    why:"Excitability is inversely proportional to the threshold strength: the threshold of the nerve is low, so its excitability is high. The whole muscle consists of fibers with different thresholds — as the strength increases, the number of excited fibers grows (law of strength). At maximal strength all fibers are excited; supramaximal strength does not increase the amplitude. An individual fiber, however, obeys the \"all-or-none\" law."}),
  explain:ctx=>{const P=ctx.P;return `In this preparation: the threshold of the nerve is ${fx(P.Tn,2)} V and the maximal strength is ${fx(P.Mn,2)} V; the threshold of the muscle is ${fx(P.Tm,2)} V (≈ ${fx(P.Tm/P.Tn,1)} times higher than that of the nerve).`;}
});

/* ===== 2-holat: yakka qisqarish va tetanus ===== */
const TET_F=[1,5,10,15,20,30,40,50,100,150];
function tetModel(P,f,dur=2,rec=2.6){
  const dt=0.001,n=Math.round(rec/dt),y=new Float32Array(n);
  const L=P.L/1000,C=P.C/1000,Rr=P.R/1000;
  const tw=t=>{if(t<L)return 0;t-=L;if(t<C)return 0.5*(1-Math.cos(Math.PI*t/C));t-=C;if(t<Rr)return 0.5*(1+Math.cos(Math.PI*t/Rr));return 0;};
  const pulses=[];const iv=1/f;for(let t=0.1;t<0.1+dur-1e-9;t+=iv)pulses.push(t);
  if(f===1)pulses.splice(2);
  const cc=1.958,Ym=50;
  for(let i=0;i<n;i++){const t=i*dt;let S=0;for(let k=0;k<pulses.length;k++){const tp=pulses[k];if(tp>t)break;if(t-tp>L+C+Rr)continue;let w=1;if(f>=100&&tp>0.15)w=0.12;S+=w*tw(t-tp);}y[i]=Ym*(1-Math.exp(-S/cc));}
  // to'lqinlanish (oxirgi 0,6 s)
  let mx=0,mn=1e9;for(let i=Math.round((0.1+dur-0.6)/dt);i<Math.round((0.1+dur)/dt);i++){mx=Math.max(mx,y[i]);mn=Math.min(mn,y[i]);}
  const r=mx>0?(mx-mn)/mx:1;
  let cls=r>0.9?"separate":r>0.06?"tishli":"silliq";if(f>=100)cls="pessimum";
  return {y,pulses,r,cls,dt};
}
CASES.push({id:"c02",no:2,grp:0,

  short:"Phases of contraction, unfused and fused tetanus, optimum and pessimum",

  subj:()=>`<b>Object:</b> a frog nerve–muscle preparation, myograph, kymograph, time marker (100 Hz — each tooth is 10 ms). <b>Task:</b> measure the phases of a single twitch, record unfused and fused tetanus by stimulating at different frequencies, and demonstrate pessimum.`,
  steps:["Mount the preparation and moisten it with Ringer's solution","Set the drum to «fast» speed and record a single twitch with one stimulus","Switch the drum to «slow» speed and record unfused tetanus at a low frequency (2 s)","Increase the frequency and record fused tetanus","Show pessimum at 100 Hz and above, then show recovery of the contraction (optimum) by lowering the frequency"],
  build(ctx){const P=ctx.P,R=ctx.rec;R.recs={};R.seq=[];

function goryCells(n1){
  const S=520,r=12,cells=[];const kTL=ri(5,8),kBR=ri(5,8),kOut=ri(10,16),kIn=n1-kTL;
  const ok=(x,y)=>cells.every(c=>(c.x-x)**2+(c.y-y)**2>=(2.25*r)**2);
  const classify=(x,y)=>{const m=3,inY=y>=r+m&&y<=S-r-m,inX=x>=r+m&&x<=S-r-m;
    if(inX&&inY)return"in";
    if(Math.abs(x)<=r-m&&inY)return"tl";if(Math.abs(y)<=r-m&&inX)return"tl";
    if(Math.abs(x-S)<=r-m&&inY)return"br";if(Math.abs(y-S)<=r-m&&inX)return"br";
    if((x<=-r-2||x>=S+r+2||y<=-r-2||y>=S+r+2)&&x>-34&&x<S+34&&y>-34&&y<S+34)return"out";return null;};
  const want={in:kIn,tl:kTL,br:kBR,out:kOut},have={in:0,tl:0,br:0,out:0};
  let guard=0;
  while(guard++<200000&&Object.keys(want).some(k=>have[k]<want[k])){
    // kerakli toifaga mos nuqta tanlash
    const need=Object.keys(want).filter(k=>have[k]<want[k]);const k=pick(need);let x,y;
    if(k==="in"){x=rnd(r+3,S-r-3);y=rnd(r+3,S-r-3);}
    else if(k==="tl"||k==="br"){const side=pick([0,1]);const a=rnd(r+3,S-r-3),o=rnd(-(r-3),r-3)+(k==="br"?S:0);if(side){x=o;y=a;}else{x=a;y=o;}}
    else{const side=ri(0,3);const a=rnd(-30,S+30);const o=side<2?rnd(-33,-r-2):rnd(S+r+2,S+33);if(side%2){x=o;y=a;}else{x=a;y=o;}}
    if(classify(x,y)!==k||!ok(x,y))continue;cells.push({x,y,k,id:cells.length,cnt:k==="in"||k==="tl"});have[k]++;}
  return {cells,S,r,true1:cells.filter(c=>c.cnt).length};
}

  mc:ctx=>({q:"Conclusion:",opts:["Hearing is normal","The sound-conducting apparatus of the left ear is damaged","The sound-conducting apparatus of the right ear is damaged","The sound-perceiving apparatus of the right ear is damaged","The sound-perceiving apparatus of the left ear is damaged"],ans:ctx.P.k,
    why:"Normally air conduction is about 2 times longer than bone conduction (Rinne positive), and in the Weber test the sound is heard in the midline. When sound conduction is impaired (earwax plug, otitis), Rinne is negative in that ear and in the Weber test the sound lateralizes to the diseased ear. When sound perception is impaired (inner ear, auditory nerve), Rinne is positive but both conduction times are shortened; in the Weber test the sound lateralizes to the healthy ear."}),
  explain:ctx=>{const E=ctx.P.E;return `In this subject: right ear — bone ${E.R.bc} s, air ${E.R.ac} s; left ear — bone ${E.L.bc} s, air ${E.L.ac} s.`;}
});

/* ===== 15-holat: sensomotor reaksiya vaqti ===== */
CASES.push({id:"c15",no:15,grp:4,
  title:"Sensorimotor reaction time and choice reaction",
  short:"Measure your own reaction: light, sound, discrimination",
  gen(){return {};},
  subj:()=>`<b>Subject:</b> you yourself. <b>Task:</b> on a chronoreflexometer, measure the simple reaction time to light and to sound, then the choice (discrimination) reaction: press for the red light, do not press for the green light. Press as fast as you can as soon as the signal appears (the button or the Space key). Turn the sound on for the sound series.`,
  steps:["Simple reaction to light: 10 attempts","Simple reaction to sound: 10 attempts","Choice reaction: red — press, green — do not press (15 signals)"],
  build(ctx){const R=ctx.rec;R.L=[];R.S=[];R.C=[];R.cerr=0;R.fs=0;
    const lamp=el("div",{id:"rtLamp",style:"width:120px;height:120px;border-radius:50%;margin:10px auto;background:#3A3F44;border:6px solid #222;box-shadow:inset 0 0 20px rgba(0,0,0,.6)"});
    const spk=el("div",{id:"rtSpk",style:"text-align:center;font-size:1.6rem;min-height:36px"},"🔈");
    const key=el("button",{id:"rtKey",type:"button",style:"display:block;width:min(320px,90%);margin:12px auto;min-height:88px;border-radius:16px;border:3px solid #333;background:#E4E7EA;font-size:1.2rem;font-weight:700;touch-action:manipulation"},"PRESS");
    const status=el("div",{style:"text-align:center;font-weight:600;min-height:24px"});
    const tbl=el("div",{style:"margin-top:10px;overflow-x:auto"});
    const box=el("div",{style:"background:#1C2228;border-radius:10px;padding:14px;color:#E3EAF1"},el("div",{style:"text-align:center;font-size:.85rem;opacity:.8"},"Chronoreflexometer"),lamp,spk,status);
    ctx.stage.append(box,key);
    let mode=null,state="idle",t0=0,timer=0,queue=[],cur=null;
    const setLamp=c=>{lamp.style.background=c||"#3A3F44";lamp.style.boxShadow=c?`0 0 40px ${c}`:"inset 0 0 20px rgba(0,0,0,.6)";};
    function start(m){if(state!=="idle"){toast("Series in progress");return;}if(m==="S")audio();mode=m;
      const n=m==="C"?15:10;queue=m==="C"?[...Array(10).fill("red"),...Array(5).fill("green")].sort(()=>Math.random()-0.5):Array(n).fill(m==="L"?"white":"snd");
      (m==="L"?R.L:m==="S"?R.S:R.C).length=0;if(m==="C")R.cerr=0;status.textContent="Get ready...";next();}
    function next(){clearTimeout(timer);setLamp(null);spk.textContent="🔈";if(!queue.length){finish();return;}cur=queue.shift();state="wait";
      timer=setTimeout(fire,rnd(1500,4000));}
    function fire(){state="on";t0=performance.now();if(cur==="snd"){beep(1000,0.15,0.35);spk.textContent="🔊";}else setLamp(cur==="white"?"#FFF7C2":cur==="red"?"#FF3B30":"#34C759");
      status.textContent="";if(cur==="green")timer=setTimeout(()=>{state="wait";R.C.push({g:true,ok:true});ctx.msg("Green signal — correct, not pressed.");next();},900);
      else timer=setTimeout(()=>{if(state==="on"){ctx.msg("No response within 1.5 s — the attempt will be repeated.","pt");queue.unshift(cur);next();}},1500);}
    function press(e){if(e)e.preventDefault();if(state==="idle")return;const now=performance.now();
      if(state==="wait"){R.fs++;ctx.msg("Pressed before the signal appeared — a false start. The attempt is given again.","err");queue.unshift(cur);next();return;}
      if(state==="on"){const rt=Math.round(now-t0);clearTimeout(timer);
        if(cur==="green"){R.cerr++;R.C.push({g:true,ok:false});ctx.msg("Pressed on the green signal — a discrimination error.","err");}
        else{(mode==="L"?R.L:mode==="S"?R.S:R.C).push(mode==="C"?{g:false,rt}:rt);status.textContent=rt+" ms";}
        state="gap";setTimeout(next,700);}}
    function finish(){state="idle";status.textContent="Series finished";ctx.done(mode==="L"?0:mode==="S"?1:2);showTbl();}
    function showTbl(){tbl.innerHTML="";const row=(nm,arr)=>el("tr",{},el("th",{},nm),...arr.map(v=>el("td",{class:"mono"},String(v))));
      const cr=R.C.filter(x=>!x.g).map(x=>x.rt);
      tbl.append(el("table",{class:"tbl"},R.L.length?row("Light, ms",R.L):null,R.S.length?row("Sound, ms",R.S):null,cr.length?row("Choice (red), ms",cr):null),
        el("p",{class:"note"},`Presses on the green signal in the choice series (errors): ${R.C.length?R.cerr:"—"}. Calculate the mean values yourself.`));}
    key.addEventListener("pointerdown",press);
    const kd=e=>{if(e.code==="Space"&&CUR===ctx){press(e);}};document.addEventListener("keydown",kd);ctx.onClean(()=>{document.removeEventListener("keydown",kd);clearTimeout(timer);});
    ctx.stage.append(el("div",{class:"ctl"},ctlGroup("Series",el("button",{class:"btn sm",type:"button",onclick:()=>start("L")},"1. Light (10)"),el("button",{class:"btn sm",type:"button",onclick:()=>start("S")},"2. Sound (10)"),el("button",{class:"btn sm",type:"button",onclick:()=>start("C")},"3. Choice (15)"))),tbl,
      el("p",{class:"note"},"The browser and the screen add their own delay (10–40 ms), so the result may come out slightly longer than on a laboratory instrument."));
  },
  journal:ctx=>{const R=ctx.rec;const m=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:NaN;const cr=()=>R.C.filter(x=>!x.g).map(x=>x.rt);return[
    {id:"l",label:"Mean reaction time to light",unit:"ms",check:v=>[R.L.length===10&&near(v,m(R.L),5),R.L.length?"Mean: "+Math.round(m(R.L))+" ms":"Series not performed"]},
    {id:"s",label:"Mean reaction time to sound",unit:"ms",check:v=>[R.S.length===10&&near(v,m(R.S),5),R.S.length?"Mean: "+Math.round(m(R.S))+" ms":"Series not performed"]},
    {id:"c",label:"Mean time of the choice reaction (red signals)",unit:"ms",check:v=>[cr().length>0&&near(v,m(cr()),5),cr().length?"Mean: "+Math.round(m(cr()))+" ms":"Series not performed"]},
    {id:"e",label:"Number of discrimination errors in the choice series",unit:"ta",check:v=>[R.C.length>0&&v===R.cerr,"Errors: "+R.cerr]}];},
  mc:()=>({q:"Why is the choice reaction time longer than the simple reaction time?",opts:["Discriminating signals in the cortex (differentiation — internal inhibition) and choosing the response take additional central time","The red light acts more slowly on the receptors of the eye","The muscles are fatigued in the choice reaction","The efferent part of the reflex arc is longer"],ans:0,
    why:"Most of the reaction time is central delay — perceiving the signal, analyzing it and choosing the motor program. The simple reaction is normally ≈ 180–220 ms to light and ≈ 140–180 ms to sound (the auditory pathway is short and fast). The choice reaction requires discriminating two signals (differentiation) and inhibiting the response — the time lengthens; errors depend on the type of higher nervous activity, fatigue and attention."}),
  explain:ctx=>{const R=ctx.rec;return `Number of false starts: ${R.fs}.`;}
});
