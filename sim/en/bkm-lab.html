<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Biochemistry Laboratory</title>
<meta name="description" content="Biochemistry: 20 clinical-laboratory cases — first the patient and theory, then the assay on the instruments, and finally interpretation of the result">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F3F0EA; --surface:#FFFFFF; --sunk:#ECE7DE; --ink:#211A12; --muted:#6B5F51; --line:#D8CFC2;
  --accent:#A3600D; --accent-soft:#F6E7CF; --on-accent:#FFFFFF;
  --bad:#B03A32; --bad-soft:#F7E1DE; --good:#2A7A4A; --good-soft:#DDF0E3; --warn:#8A6200; --warn-soft:#F6ECD2;
  --info:#1F5FA0; --info-soft:#DCE8F5;
  --bench:#DCD8D0; --bench2:#CBC6BC;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15120E; --surface:#1F1A14; --sunk:#110E0B; --ink:#EDE5DA; --muted:#AA9C8A; --line:#3A3127;
  --accent:#E6A64A; --accent-soft:#3A2A14; --on-accent:#1A1004;
  --bad:#EA8A80; --bad-soft:#3A1F1C; --good:#73C99A; --good-soft:#163222; --warn:#E3B651; --warn-soft:#352A12;
  --info:#6FA8E3; --info-soft:#193049;
  --bench:#2A251F; --bench2:#221E19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15120E; --surface:#1F1A14; --sunk:#110E0B; --ink:#EDE5DA; --muted:#AA9C8A; --line:#3A3127;
  --accent:#E6A64A; --accent-soft:#3A2A14; --on-accent:#1A1004;
  --bad:#EA8A80; --bad-soft:#3A1F1C; --good:#73C99A; --good-soft:#163222; --warn:#E3B651; --warn-soft:#352A12;
  --info:#6FA8E3; --info-soft:#193049;
  --bench:#2A251F; --bench2:#221E19; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.55}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(1.6rem,4vw,2.3rem);font-weight:800}
h2{font-size:1.3rem;font-weight:800}
h3{font-size:1.02rem;font-weight:600}
p{margin:0}
sub,sup{line-height:0}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-left,0px)) 40px max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono)}
.small{font-size:.86rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:7px 14px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:.93rem;line-height:1.2;text-align:center}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.sm{min-height:34px;padding:5px 10px;font-size:.86rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.on{background:var(--accent-soft);border-color:var(--accent);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
/* bosh sahifa */
.hero{padding:6px 0 14px}
.hero p{max-width:780px;margin-top:6px}
.flow{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.flow span{font-size:.82rem;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:3px 11px}
.grp{margin-top:20px}
.grp h2{font-size:1.02rem;margin-bottom:8px;color:var(--muted);font-family:var(--f-body);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.case{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;width:100%}
.case:hover{border-color:var(--accent)}
.case .no{flex:0 0 auto;width:38px;height:38px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-family:var(--f-mono)}
.case .t{font-weight:600;line-height:1.3}
.case .s{font-size:.84rem;color:var(--muted);margin-top:3px;line-height:1.35}
.case .tp{font-size:.76rem;color:var(--muted);margin-top:4px;font-family:var(--f-mono)}
.case .sc{font-size:.8rem;margin-top:5px;font-weight:600}
.case .sc.ok{color:var(--good)} .case .sc.mid{color:var(--warn)}
/* holat sahifasi */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.top h1{font-size:clamp(1.15rem,3vw,1.55rem);flex:1 1 300px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{flex:1 1 150px;display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:.9rem;text-align:left;min-height:44px}
.tab b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--sunk);font-size:.8rem;flex:0 0 auto}
.tab.cur{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.tab.cur b{background:var(--accent);color:var(--on-accent)}
.tab.ok b{background:var(--good);color:#fff}
.tab:disabled{opacity:.5;cursor:not-allowed}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;max-width:900px}
.sheet h2{margin:2px 0 10px}
.sheet h3{margin:16px 0 6px;color:var(--accent)}
.sheet p{margin:6px 0}
.sheet ul,.sheet ol{margin:6px 0;padding-left:22px}
.sheet li{margin:3px 0}
.pt-grid{display:grid;grid-template-columns:150px 1fr;gap:4px 12px;font-size:.93rem}
.pt-grid dt{color:var(--muted);font-weight:500}
.pt-grid dd{margin:0}
@media (max-width:560px){.pt-grid{grid-template-columns:1fr}.pt-grid dt{margin-top:6px}}
.task{background:var(--info-soft);border-radius:9px;padding:10px 14px;margin-top:12px}
.task b{color:var(--info)}
.eq{font-family:var(--f-mono);font-size:.86rem;background:var(--sunk);border-radius:8px;padding:8px 10px;margin:6px 0;overflow-x:auto;white-space:pre-wrap;line-height:1.5}
.diag{margin:8px 0;border:1px solid var(--line);border-radius:9px;background:var(--surface);overflow:hidden}
.diag svg{display:block;width:100%;height:auto}
.diag .cap{font-size:.8rem;color:var(--muted);padding:6px 10px;border-top:1px solid var(--line)}
.tip{border-left:4px solid var(--warn);background:var(--warn-soft);padding:8px 12px;border-radius:0 8px 8px 0;margin:10px 0;font-size:.92rem}
.lay{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:14px;align-items:start}
@media (max-width:980px){.lay{grid-template-columns:minmax(0,1fr)}}
.stage{background:linear-gradient(180deg,var(--bench),var(--bench2));border:1px solid var(--line);border-radius:var(--r);padding:12px;min-width:0}
.stage .sv{display:block;width:100%;height:auto;background:#F5F3EF;border-radius:8px;border:1px solid #BDB6AA}
.stage h3{margin:0 0 8px}
.panel{display:flex;flex-direction:column;gap:12px;min-width:0}
.steps ol{margin:6px 0 0;padding:0;list-style:none;counter-reset:s}
.steps li{position:relative;padding:5px 0 5px 32px;font-size:.88rem;line-height:1.35;counter-increment:s}
.steps li::before{content:counter(s);position:absolute;left:0;top:4px;width:23px;height:23px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:.75rem;font-weight:600;color:var(--muted)}
.steps li.cur::before{border-color:var(--accent);color:var(--accent)}
.steps li.cur{font-weight:600}
.steps li.done{color:var(--muted)}
.steps li.done::before{content:"✓";background:var(--good);border-color:var(--good);color:#fff}
.log{max-height:230px;overflow:auto;font-size:.86rem;display:flex;flex-direction:column;gap:5px}
.log div{padding:6px 9px;border-radius:7px;background:var(--sunk);line-height:1.35}
.log .err{background:var(--bad-soft);color:var(--bad)}
.log .ok{background:var(--good-soft);color:var(--good)}
.log .pt{background:var(--warn-soft)}
.jr label{display:block;font-size:.88rem;margin:9px 0 3px;font-weight:500;line-height:1.3}
.jr .inp{display:flex;gap:6px;align-items:center}
.jr input,.jr select{width:100%;min-height:38px;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.jr input{max-width:160px;font-family:var(--f-mono)}
.jr .u{font-size:.85rem;color:var(--muted);white-space:nowrap}
.jr .fb{font-size:.82rem;margin-top:3px;line-height:1.35}
.jr .fb.ok{color:var(--good)} .jr .fb.no{color:var(--bad)}
.mc{margin-top:14px}
.mc .q{font-weight:600;margin-bottom:4px;line-height:1.35}
.mc label{display:flex;gap:8px;align-items:flex-start;font-weight:400;margin:6px 0;padding:7px 9px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:.92rem;line-height:1.35}
.mc input{width:auto;min-height:0;margin-top:3px}
.mc label.ok{border-color:var(--good);background:var(--good-soft)}
.mc label.no{border-color:var(--bad);background:var(--bad-soft)}
.mc .why{font-size:.85rem;margin-top:6px;padding:8px 10px;border-radius:8px;background:var(--sunk)}
.res{border-radius:var(--r);padding:12px 14px;border:1px solid var(--line);background:var(--surface)}
.res .big{font-family:var(--f-display);font-size:1.6rem;font-weight:800}
.res.good{border-color:var(--good)} .res.mid{border-color:var(--warn)} .res.low{border-color:var(--bad)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.ctl .grpc{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:6px 8px}
.ctl .lbl{font-size:.8rem;color:var(--muted);font-weight:600;margin-right:2px}
.stp{display:inline-flex;align-items:center;gap:4px}
.stp .v{min-width:78px;text-align:center;font-family:var(--f-mono);font-weight:600;background:#10180F;color:#7CFF9A;border-radius:6px;padding:5px 8px;font-size:.95rem}
.stp button{min-width:36px;min-height:34px;border-radius:7px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.note{font-size:.84rem;color:var(--muted);margin-top:8px;line-height:1.4}
.clock{font-family:var(--f-mono);font-weight:600;background:#111;color:#FFB347;border-radius:6px;padding:5px 9px;min-width:84px;text-align:center}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:9px;font-size:.9rem;z-index:50;max-width:min(92vw,520px);text-align:center}
.tbl{border-collapse:collapse;font-size:.86rem;width:100%}
.tbl td,.tbl th{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
.tbl th{background:var(--sunk);font-weight:600}
.tbl td.hi{color:var(--bad);font-weight:600}
.tbl td.lo{color:var(--info);font-weight:600}
.tblw{overflow-x:auto}
svg text{font-family:var(--f-body)}
.clk{cursor:pointer}
.clk:hover{filter:brightness(1.07)}
.sel-ring{stroke:#F2B705!important;stroke-width:3!important}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:.86rem;min-height:36px}
.chip.on{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.chart{border-collapse:collapse;font-size:.78rem;margin-top:8px}
.chart td,.chart th{padding:3px;border:1px solid var(--line);text-align:center}
.chart th{background:var(--sunk);text-align:left;white-space:nowrap;padding:3px 6px}
.chart button.sw{width:38px;height:24px;border-radius:4px;border:1px solid rgba(0,0,0,.25);padding:0}
.chart button.sw.on{outline:3px solid var(--accent);outline-offset:1px}
.chart .lv{font-size:.68rem;color:var(--muted);display:block;line-height:1.1;margin-top:2px}
.lcd{font-family:var(--f-mono);background:#C9D7B5;color:#1D2A12;border-radius:6px;padding:8px 10px;font-size:.84rem;line-height:1.45;min-height:70px;border:2px solid #7E8B6C;white-space:pre-wrap}
.next-bar{display:flex;justify-content:flex-end;margin-top:12px;gap:8px;flex-wrap:wrap}
.gate{margin-top:14px;padding:12px 14px;border-radius:9px;border:1px dashed var(--accent);background:var(--accent-soft)}
</style>

<script>
"use strict";
/* ===== Yordamchilar ===== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const NS="http://www.w3.org/2000/svg";
function el(tag,attrs={},...kids){const e=document.createElement(tag);for(const k in attrs){if(k==="html")e.innerHTML=attrs[k];else if(k.startsWith("on"))e.addEventListener(k.slice(2),attrs[k]);else if(attrs[k]!==false&&attrs[k]!=null)e.setAttribute(k,attrs[k]===true?"":attrs[k]);}for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(c));}return e;}
function svgEl(html,w,h){const d=document.createElement("div");d.innerHTML=`<svg xmlns="${NS}" viewBox="0 0 ${w} ${h}" class="sv">${html}</svg>`;return d.firstChild;}
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const r1=(x,d=1)=>Math.round(x*10**d)/10**d;
const fx=(x,d=1)=>(+x).toFixed(d);
const num=s=>{if(s==null)return NaN;s=String(s).trim().replace(/\s/g,"").replace(",",".");if(s==="")return NaN;return Number(s);};
const near=(v,t,rel=0.03,abs=0)=>Number.isFinite(v)&&Math.abs(v-t)<=Math.max(Math.abs(t)*rel,abs);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const md=s=>String(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
function toast(t){const o=$(".toast");if(o)o.remove();const d=el("div",{class:"toast"},t);document.body.append(d);setTimeout(()=>d.remove(),2800);}
const store={get(k,d){try{const v=localStorage.getItem("tq:bkm:"+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem("tq:bkm:"+k,JSON.stringify(v));}catch(e){}}};
const mmss=t=>{t=Math.max(0,Math.floor(t));return String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0");};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

/* ===== Simulyatsiya soati: 1 real soniya = speed simulyatsiya soniyasi ===== */
function makeClock(onTick){
  const c={t:0,speed:1,run:false,last:0,raf:0,
    start(){if(c.run)return;c.run=true;c.last=performance.now();c.raf=requestAnimationFrame(c.loop);},
    stop(){c.run=false;cancelAnimationFrame(c.raf);},
    loop(now){if(!c.run)return;const dt=Math.min(0.25,(now-c.last)/1000)*c.speed*(window.__TS||1);c.last=now;c.t+=dt;onTick&&onTick(c.t,dt);if(c.run)c.raf=requestAnimationFrame(c.loop);},
    reset(){c.stop();c.t=0;}};
  return c;
}
/* Inkubatsiya / kutish taymeri: target — simulyatsiya soniyalarida */
function timerBox(ctx,{label,target,speed=60,onTick,onReach,startLabel="▶ Start",stopLabel="■ Remove"}){
  const disp=el("span",{class:"clock"},"00:00");
  const tgt=el("span",{class:"small muted"},"/ "+mmss(target));
  let reached=false;
  const clk=makeClock((t)=>{disp.textContent=mmss(t);onTick&&onTick(t);
    if(!reached&&t>=target){reached=true;disp.style.color="#7CFF9A";toast(label+": time is up");onReach&&onReach(t);}});
  clk.speed=speed;
  const bStart=el("button",{class:"btn sm pri",type:"button"},startLabel);
  const bStop=el("button",{class:"btn sm",type:"button",disabled:true},stopLabel);
  const sp=el("select",{class:"btn sm","aria-label":"Speed"},...[[speed,"×"+speed],[speed*4,"×"+speed*4]].map(([v,t])=>el("option",{value:v},t)));
  sp.onchange=()=>clk.speed=Number(sp.value);
  const box=el("div",{class:"grpc"},el("span",{class:"lbl"},label),disp,tgt,sp,bStart,bStop);
  const T={el:box,clk,get t(){return clk.t;},get reached(){return reached;},started:false,stopped:false,
    onStart:null,onStop:null,
    start(){if(T.started)return;T.started=true;bStart.disabled=true;bStop.disabled=false;clk.start();T.onStart&&T.onStart();},
    stop(){if(!T.started||T.stopped)return;T.stopped=true;clk.stop();bStop.disabled=true;T.onStop&&T.onStop(clk.t);}};
  bStart.onclick=()=>T.start();bStop.onclick=()=>T.stop();
  ctx.onClean(()=>clk.stop());
  return T;
}
function stepper({label,val,vals,fmt=v=>v,onChange}){
  // vals — ruxsat etilgan qiymatlar ro'yxati
  let i=Math.max(0,vals.indexOf(val));
  const v=el("span",{class:"v"});const show=()=>v.textContent=fmt(vals[i]);
  const mk=(d,t)=>el("button",{type:"button","aria-label":label+" "+t,onclick:()=>{const n=i+d;if(n<0||n>=vals.length)return;i=n;show();onChange&&onChange(vals[i]);}},t);
  const box=el("span",{class:"stp"},mk(-1,"−"),v,mk(1,"+"));show();
  box.get=()=>vals[i];box.set=x=>{const k=vals.indexOf(x);if(k>=0){i=k;show();}};
  return box;
}
function ctlGroup(label,...kids){return el("div",{class:"grpc"},el("span",{class:"lbl"},label),...kids);}
function table(head,rows,cls="tbl"){
  return el("div",{class:"tblw"},el("table",{class:cls},
    head?el("thead",{},el("tr",{},...head.map(h=>el("th",{html:h})))):null,
    el("tbody",{},...rows.map(r=>el("tr",{},...r.map(c=>{if(c&&typeof c==="object"&&!c.nodeType)return el("td",{class:c.cls||"",html:c.h});return el("td",{html:c==null?"":String(c)});}))))));
}
/* ===== Metabolik sxema chizgich ===== */
// nodes: [{id,x,y,t,k}] k: "m" metabolit, "d" kasallik/natija, "x" to'siq, "g" manba
// edges: [{a,b,t,blk,dash,c}] t — ferment nomi; blk — defekt (qizil ×)
function pathway(nodes,edges,w=720,h=300,cap=""){
  const N={};nodes.forEach(n=>N[n.id]=n);
  const col={m:["#FFF7E8","#A3600D"],d:["#FBE3E0","#B03A32"],g:["#E3F1E7","#2A7A4A"],x:["#E7EEF8","#1F5FA0"],n:["#F1EEE9","#6B5F51"]};
  let s=`<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5A4E40"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#B03A32"/></marker></defs>`;
  s+=`<rect width="${w}" height="${h}" fill="#FCFBF8"/>`;
  const bw=n=>(n.w||Math.max(70,n.t.replace(/<[^>]+>/g,"").length*6.7+18)),bh=n=>n.h||(n.t.includes("|")?42:28);
  edges.forEach(e=>{const A=N[e.a],B=N[e.b];
    // chegaradan chegaraga
    const dx=B.x-A.x,dy=B.y-A.y;const L=Math.hypot(dx,dy)||1;
    const cut=(n,ux,uy)=>{const hw=bw(n)/2+3,hh=bh(n)/2+3;const tx=ux?hw/Math.abs(ux):1e9,ty=uy?hh/Math.abs(uy):1e9;return Math.min(tx,ty);};
    const ux=dx/L,uy=dy/L;const ca=cut(A,ux,uy),cb=cut(B,ux,uy);
    const x1=A.x+ux*ca,y1=A.y+uy*ca,x2=B.x-ux*cb,y2=B.y-uy*cb;
    const c=e.blk?"#B03A32":(e.c||"#5A4E40");
    s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${e.blk?2.4:1.8}" ${e.dash?'stroke-dasharray="5 4"':""} marker-end="url(#${e.blk?"ahr":"ah"})"/>`;
    const mx=(x1+x2)/2,my=(y1+y2)/2;
    if(e.t){const off=e.off||[Math.abs(uy)>0.5?8:0,Math.abs(uy)>0.5?0:-7];
      const anchor=Math.abs(uy)>0.5?"start":"middle";
      e.t.split("|").forEach((ln,i)=>{s+=`<text x="${mx+off[0]}" y="${my+off[1]+i*12}" font-size="10.5" fill="${e.blk?"#B03A32":"#1F5FA0"}" text-anchor="${anchor}" font-style="italic">${ln}</text>`;});}
    if(e.blk)s+=`<g transform="translate(${mx},${my})"><circle r="9" fill="#fff" stroke="#B03A32" stroke-width="2"/><path d="M-4,-4L4,4M4,-4L-4,4" stroke="#B03A32" stroke-width="2.4"/></g>`;
  });
  nodes.forEach(n=>{const [f,st]=col[n.k||"m"];const W=bw(n),H=bh(n);
    s+=`<rect x="${n.x-W/2}" y="${n.y-H/2}" width="${W}" height="${H}" rx="7" fill="${f}" stroke="${st}" stroke-width="1.4"/>`;
    const ls=n.t.split("|");ls.forEach((ln,i)=>{s+=`<text x="${n.x}" y="${n.y+4+(i-(ls.length-1)/2)*13}" font-size="11.5" font-weight="${i===0?600:400}" fill="#211A12" text-anchor="middle">${ln}</text>`;});});
  const box=el("div",{class:"diag"});box.append(svgEl(s,w,h));if(cap)box.append(el("div",{class:"cap",html:cap}));
  return box;
}

function buildLab(ctx,sec){
  ctx.labBuilt=true;
  const {c,P}=ctx;
  const insts=c.lab(P);
  ctx.steps=[];insts.forEach(I=>{I.base=ctx.steps.length;ctx.steps.push(...I.steps);});

  const stage=el("div",{class:"stage"});
  const finBox=el("div");
  ctx.msg=(t,k="")=>{const d=el("div",{class:k,html:t});logBox.append(d);logBox.scrollTop=logBox.scrollHeight;};
  ctx.err=t=>{if(ctx.checked)return;ctx.errs.push(t);ctx.msg("✗ "+t,"err");toast(t);};
  ctx.ok=t=>ctx.msg("✓ "+t,"ok");
  ctx.info=t=>ctx.msg(t,"pt");

    ctx.steps.forEach((s,i)=>stepsOl.append(el("li",{class:ctx.stepDone[i]?"done":(i===cur?"cur":"")},s)));};
  ctx.done=i=>{if(!ctx.stepDone[i]){ctx.stepDone[i]=true;ctx.renderSteps();}};
  ctx.isDone=i=>ctx.stepDone[i];
  ctx.need=(i,silent)=>{for(let k=0;k<i;k++)if(!ctx.stepDone[k]){if(!silent)ctx.err(`First complete the step “${ctx.steps[k]}”`);return false;}return true;};
  const lay=el("div",{class:"lay"});
  const panel=el("div",{class:"panel"},
    el("div",{class:"card steps"},el("h3",{},"Procedure"),stepsOl),
    el("div",{class:"card"},el("h3",{},"Lab notebook"),logBox),finBox);

  const mountNext=()=>{
    if(k>=insts.length){
      ctx.labFinished=true;ctx.unlock(3);ctx.markTab(2);

      finBox.innerHTML="";

        el("h3",{},"Laboratory work completed"),
        el("p",{class:"small",style:"margin:6px 0 10px"},miss.length?`Steps not completed: ${miss.length}. They count as errors.`:"All results have been recorded in the lab notebook. Now calculate and interpret them."),
        el("button",{class:"btn pri",type:"button",style:"width:100%",onclick:()=>ctx.go(3)},"Go to result and conclusion →")));

  });

    m.opts.forEach((o,i)=>b.append(el("label",{},el("input",{type:"radio",name:"mc"+mi,value:String(i)}),el("span",{html:md(o)}))));
    left.append(b);return b;});
  const btn=el("button",{class:"btn pri",type:"button",style:"margin-top:12px;width:100%"},"Check result");
  jr.append(btn);

  btn.onclick=()=>{

    const empty=fields.filter(f=>f.inp.value==="");

    if(empty.length||unans.length){toast("Fill in all fields and answer the questions");return;}
    let got=0;const tot=fields.length+mcs.length;
    fields.forEach(f=>{const v=f.type==="sel"?Number(f.inp.value):num(f.inp.value);
      let r;try{r=f.check(v,ctx);}catch(e){r=[false,"could not be checked"];}
      const [ok,right]=r;if(ok)got++;

    mcs.forEach((m,mi)=>{const b=mcBoxes[mi];const sel=Number($("input:checked",b).value);
      $$("label",b).forEach((l,i)=>{if(i===m.ans)l.classList.add("ok");else if(i===sel)l.classList.add("no");$("input",l).disabled=true;});
      if(sel===m.ans)got++;

    ctx.checked=true;
    ctx.steps.forEach((s,i)=>{if(!ctx.stepDone[i])ctx.errs.push("Step not completed: “"+s+"”");});
    const pen=Math.min(0.5,0.08*ctx.errs.length);
    const pct=Math.max(0,Math.round(100*(got/tot)*(1-pen)));

    btn.disabled=true;ctx.markTab(3);

      el("div",{class:"big"},pct+" %"),
      el("div",{class:"small"},`Correct answers: ${got} / ${tot}. Procedure errors: ${ctx.errs.length}${ctx.errs.length?" (each reduces the result by 8%, at most 50%)":""}.`),
      ctx.errs.length?el("ul",{class:"small",style:"margin:8px 0 0;padding-left:18px"},...ctx.errs.map(e=>el("li",{html:e}))):null,

    resBox.scrollIntoView({behavior:"smooth",block:"nearest"});
  };

/* Probirka chizish (SVG satri): x,y — yuqori markaz, layers: [{h,c}] pastdan yuqoriga (h — 0..1) */
function tubeSvg(x,y,{w=26,h=110,layers=[],cap=null,label="",sel=false,id="",cls=""}={}){
  let s=`<g ${id?`id="${id}"`:""} class="${cls}">`;
  const r=w/2;const by=y+h-r;
  // suyuqlik
  let acc=0;const clipId="cl"+Math.random().toString(36).slice(2,8);
  s+=`<clipPath id="${clipId}"><path d="M${x-r},${y} V${by} A${r},${r} 0 0 0 ${x+r},${by} V${y} Z"/></clipPath>`;
  layers.forEach(L=>{const lh=L.h*(h-4);const top=y+h-acc-lh;s+=`<rect x="${x-r}" y="${top}" width="${w}" height="${lh+1}" fill="${L.c}" clip-path="url(#${clipId})"/>`;acc+=lh;});
  s+=`<path d="M${x-r},${y} V${by} A${r},${r} 0 0 0 ${x+r},${by} V${y}" fill="none" stroke="${sel?"#F2B705":"#6E7780"}" stroke-width="${sel?3:1.6}"/>`;
  s+=`<path d="M${x-r+4},${y+6} V${by-2}" stroke="#fff" stroke-width="2.4" opacity=".55"/>`;
  if(cap)s+=`<rect x="${x-r-3}" y="${y-12}" width="${w+6}" height="14" rx="3" fill="${cap}" stroke="#333" stroke-width=".8"/>`;
  else s+=`<path d="M${x-r-3},${y} H${x+r+3}" stroke="#6E7780" stroke-width="2"/>`;
  if(label)s+=`<text x="${x}" y="${y+h+16}" font-size="11" text-anchor="middle" fill="#3A3127">${label}</text>`;
  return s+"</g>";
}
const mixColor=(c1,c2,t)=>{const p=c=>[1,3,5].map(i=>parseInt(c.slice(i,i+2),16));const a=p(c1),b=p(c2);t=clamp(t,0,1);return "#"+a.map((v,i)=>Math.round(v+(b[i]-v)*t).toString(16).padStart(2,"0")).join("");};

function centrifugeInst({what="serum",citrate=false,rpm=3000,min=10,cap=null,desc=null}={}){
  const isPl=citrate||/plasma/.test(what);
  return {steps:[`Centrifuge the blood to separate ${what} (${rpm} rpm, ${min} min)`],
  mount(ctx,box,base,next){
    const tubeCap=cap||(citrate?"#5AA0E0":"#C8372D");
    box.append(el("h3",{},"Centrifuge"),el("p",{class:"small muted",style:"margin-bottom:8px"},desc||(citrate?"Blood was collected into a tube containing 3.2% sodium citrate (light-blue cap) at a 9:1 ratio. Centrifuge to separate plasma.":"Blood was collected into a tube with a clot activator (red cap) and left at room temperature for 30 minutes to clot. Centrifuge to separate serum.")));
    const draw=(state,ang=0)=>{
      let s=`<rect x="0" y="0" width="720" height="250" fill="#F5F3EF"/>`;
      // sentrifuga korpusi
      s+=`<rect x="40" y="70" width="330" height="150" rx="18" fill="#E9ECEF" stroke="#8D959C" stroke-width="2"/>`;
      s+=`<ellipse cx="205" cy="80" rx="135" ry="28" fill="${state.open?"#C9CED3":"#D8DDE2"}" stroke="#8D959C" stroke-width="2"/>`;
      if(state.open){s+=`<g transform="translate(205,80) rotate(${ang}) scale(1,0.21)"><circle r="110" fill="#9AA3AB"/><circle r="22" fill="#6E7780"/>`;
        for(let i=0;i<8;i++){const a=i*Math.PI/4;const has=(i===0&&state.loaded)||(i===4&&state.balance);s+=`<circle cx="${Math.cos(a)*80}" cy="${Math.sin(a)*80}" r="13" fill="${has?tubeCap:"#4B535B"}"/>`;}s+=`</g>`;}
      else s+=`<g transform="translate(205,80) rotate(${ang}) scale(1,0.21)"><path d="M-60,0H60M0,-60V60" stroke="#B7BEC5" stroke-width="10" opacity="${state.run?0.6:0.3}"/></g>`;
      s+=`<rect x="80" y="140" width="250" height="52" rx="6" fill="#1D2A12"/><text x="95" y="172" font-family="IBM Plex Mono" font-size="20" fill="#7CFF9A">${state.rpm} rpm  ${String(state.min).padStart(2,"0")}:00</text>`;
      s+=`<text x="205" y="240" text-anchor="middle" font-size="12" fill="#3A3127">Laboratory centrifuge</text>`;
      // probirka holati
      const sep=state.sep;
      const layers=sep>=1?[{h:.45,c:"#7A1712"},{h:.04,c:"#E8DCC8"},{h:.33,c:citrate?"#F1D98A":"#EBC75A"}]:sep>0?[{h:.45,c:"#8A1D16"},{h:.37,c:mixColor("#8A1D16",citrate?"#F1D98A":"#EBC75A",sep*0.7)}]:[{h:.82,c:"#8A1D16"}];
      s+=tubeSvg(520,70,{h:140,w:30,layers,cap:tubeCap,label:sep>=1?(isPl?"plasma / erythrocytes":"serum / clot"):"patient blood"});
      if(state.balance)s+=tubeSvg(610,70,{h:140,w:30,layers:[{h:.82,c:"#CFE3F2"}],cap:"#888",label:"balance (water)"});
      return s;};
    const st={open:true,loaded:false,balance:false,run:false,sep:0,rpm:2000,min:5};
    const holder=el("div");const redraw=(a=0)=>{holder.innerHTML="";holder.append(svgEl(draw(st,a),720,250));};redraw();
    const rpmS=stepper({label:"Rotation",val:2000,vals:[1000,1500,2000,3000,4000,5000],fmt:v=>v+" rpm",onChange:v=>{st.rpm=v;redraw();}});
    const minS=stepper({label:"Time",val:5,vals:[2,5,10,15,20],fmt:v=>v+" min",onChange:v=>{st.min=v;redraw();}});
    const bLoad=el("button",{class:"btn sm",type:"button"},"Place the tube in the rotor");
    const bBal=el("button",{class:"btn sm",type:"button"},"Balance tube in the opposite slot");
    const bRun=el("button",{class:"btn sm pri",type:"button"},"Close the lid and start");

      for(let v=0;v<=25;v++){const y=by+8+v/25*(bh-16);s+=`<line x1="${bx-9}" y1="${y}" x2="${bx-9+(v%5?5:9)}" y2="${y}" stroke="#333" stroke-width=".8"/>${v%5===0?`<text x="${bx+14}" y="${y+4}" font-size="9" fill="#333">${v}</text>`:""}`;}

      // kolba
      const fc=color();const fx0=bx,fy=300;
      s+=`<path d="M${fx0-14},${fy-62} V${fy-30} L${fx0-55},${fy+30} Q${fx0-58},${fy+38} ${fx0-48},${fy+38} H${fx0+48} Q${fx0+58},${fy+38} ${fx0+55},${fy+30} L${fx0+14},${fy-30} V${fy-62}" fill="#F7FBFF" stroke="#6E7780" stroke-width="1.6"/>`;
      if(fc)s+=`<path d="M${fx0-36},${fy+2} L${fx0-55},${fy+30} Q${fx0-58},${fy+38} ${fx0-48},${fy+38} H${fx0+48} Q${fx0+58},${fy+38} ${fx0+55},${fy+30} L${fx0+36},${fy+2}Z" fill="${fc}"/>`;
      // lupa
      const zx=430,zy=40;s+=`<rect x="${zx}" y="${zy}" width="250" height="200" rx="10" fill="#fff" stroke="#8D959C"/><text x="${zx+12}" y="${zy+22}" font-size="12" font-weight="600" fill="#3A3127">Burette scale (magnified)</text>`;
      const c0=Math.max(0,st.V-1.2);
      for(let k=0;k<=24;k++){const v=Math.round((Math.floor(c0*10)/10+k*0.1)*10)/10;const y=zy+40+(v-c0)*60;if(y>zy+195)break;if(y<zy+32)continue;
        const major=Math.abs(v-Math.round(v))<1e-6,half=Math.abs(v*2-Math.round(v*2))<1e-6;
        s+=`<line x1="${zx+70}" y1="${y}" x2="${zx+70+(major?60:half?40:24)}" y2="${y}" stroke="#222" stroke-width="${major?1.6:1}"/>${major?`<text x="${zx+140}" y="${y+4}" font-size="13" font-family="IBM Plex Mono" fill="#222">${v}</text>`:""}`;}
      if(st.filled){const y=zy+40+(st.V-c0)*60;s+=`<path d="M${zx+60},${y-5} Q${zx+100},${y+6} ${zx+140},${y-5}" stroke="#1F5FA0" stroke-width="2.5" fill="none"/><rect x="${zx+60}" y="${y-5}" width="80" height="${zy+196-y}" fill="#1F5FA0" opacity=".08"/>`;}
      s+=`<text x="${zx+12}" y="${zy+194}" font-size="10" fill="#6B5F51">Read from the bottom of the meniscus</text>`;
      s+=`<text x="${fx0+70}" y="${fy+20}" font-size="11" text-anchor="start" fill="#3A3127">${cfg.flask||"Titration flask"}</text>`;
      holder.innerHTML="";holder.append(svgEl(s,720,360));}
    draw();
    // boshqaruv
    const volS=stepper({label:"Volume",val:2,vals:[1,2,5,10,20],fmt:v=>v+" ml"});
    const bPour=el("button",{class:"btn sm",type:"button"},`Measure and pour ${cfg.sampleName}`);
    bPour.onclick=()=>{if(st.vol)return;st.vol=volS.get();if(st.vol!==cfg.sampleVol)ctx.err(`${st.vol} mL taken — the method requires ${cfg.sampleVol} mL (the calculation formula is set up for ${cfg.sampleVol} mL)`);else ctx.ok(`${st.vol} mL of ${cfg.sampleName} was poured into the flask.`);ctx.done(base);bPour.disabled=true;draw();};
    const chips=el("div",{class:"chips"});const chosen=new Set();
    cfg.adds.forEach((a,i)=>{const c=el("button",{class:"chip",type:"button"},a.n);c.onclick=()=>{if(st.adds.length)return;chosen.has(i)?chosen.delete(i):chosen.add(i);c.classList.toggle("on");};chips.append(c);});
    const bAdd=el("button",{class:"btn sm",type:"button"},"Add");
    bAdd.onclick=()=>{if(st.adds.length)return;if(!ctx.need(base+1))return;if(!chosen.size)return toast("Select the substance to add");
      st.adds=[...chosen];const need=cfg.adds.map((a,i)=>a.ok?i:-1).filter(i=>i>=0);
      need.forEach(i=>{if(!chosen.has(i))ctx.err(`“${cfg.adds[i].n}” was not added`);});
      st.adds.forEach(i=>{if(!cfg.adds[i].ok)ctx.err(`“${cfg.adds[i].n}” is not added in this method${cfg.adds[i].why?": "+cfg.adds[i].why:""}`);});
      if(need.every(i=>chosen.has(i))&&st.adds.every(i=>cfg.adds[i].ok))ctx.ok("The required substances were added.");
      ctx.done(base+1);bAdd.disabled=true;draw();};
    const bFill=el("button",{class:"btn sm",type:"button"},"Fill the burette and bring it to “0”");
    bFill.onclick=()=>{if(st.filled)return;if(!ctx.need(base+2))return;st.filled=true;ctx.ok("Burette filled, meniscus at the “0” mark, air bubble at the tip removed.");ctx.done(base+2);bFill.disabled=true;draw();};
    const add=v=>{if(!st.filled)return toast("First fill the burette");if(!ctx.need(base+3))return;if(st.ei>=cfg.ends.length)return;
      st.V=Math.round((st.V+v)*100)/100;
      if(cfg.flash){const Ve=cfg.ends[st.ei].V*scale();if(st.V<Ve){st.flash=1;draw();setTimeout(()=>{st.flash=0;draw();},700);}}
      draw();};
    const bDrop=el("button",{class:"btn sm",type:"button"},"1 drop (0.05 mL)");bDrop.onclick=()=>add(0.05);
    const bHalf=el("button",{class:"btn sm",type:"button"},"0.5 mL");bHalf.onclick=()=>add(0.5);
    const bTwo=el("button",{class:"btn sm",type:"button"},"2 mL stream");bTwo.onclick=()=>add(2);
    const bMark=el("button",{class:"btn sm pri",type:"button"},"Color changed — record the volume");
    bMark.onclick=()=>{if(st.ei>=cfg.ends.length)return;if(!st.filled||!ctx.need(base+3+st.ei))return;
      const e=cfg.ends[st.ei];const Ve=e.V*scale();
      if(st.V<Ve-0.051){ctx.err(`${e.n}: the color has not changed yet (${fx(st.V,2)} mL) — continue titrating`);return;}
      if(st.V>Ve+0.31)ctx.err(`${e.n}: the end point was overshot (${fx(st.V,2)} mL). Titrate dropwise when approaching the end point`);
      st.rec.push(st.V);ctx.rec[cfg.id]=st.rec.slice();
      ctx.msg(`${e.n}: burette reading <b>${fx(st.V,2)} mL</b>`);ctx.done(base+3+st.ei);st.ei++;
      if(st.ei>=cfg.ends.length){ctx.ok("Titration completed.");[bDrop,bHalf,bTwo,bMark].forEach(b=>b.disabled=true);setTimeout(next,300);}};
    box.append(el("div",{class:"ctl"},ctlGroup("Graduated cylinder/pipette",volS,bPour)),
      el("div",{class:"ctl"},ctlGroup(cfg.addsLabel||"Indicators",chips,bAdd),bFill),
      el("div",{class:"ctl"},ctlGroup("Burette stopcock",bDrop,bHalf,bTwo),bMark),
      ...(cfg.persistNote?[el("p",{class:"note",html:md(cfg.persistNote)})]:[]));
  }};
}

/* ---------- Ko'p parametrli test-chiziq ----------
 cfg: {id,title,sample,pads:[{n,lv:[[label,color]],ans}],readAt (s), late (s)}
*/
function stripInst(cfg){
  const steps=[`Collect the ${cfg.sample} sample in a clean container and mix`,"Dip the test strip for 1–2 s until all zones are immersed","Blot excess urine by touching the strip to the edge of the container",`After ${cfg.readAt} s, compare the zones with the color chart`];
  return {steps,cfg,mount(ctx,box,base,next){
    const st={mixed:false,dipT:null,dipping:false,blotted:false,t:0,started:false,sel:cfg.pads.map(()=>null),done:false};
    box.append(el("h3",{},cfg.title));
    const holder=el("div");box.append(holder);
    const clk=makeClock(t=>{st.t=t;disp.textContent=mmss(t);drawStrip();});clk.speed=1;ctx.onClean(()=>clk.stop());
    const disp=el("span",{class:"clock"},"00:00");
    function padCol(p){const base=p.lv[0][1];const tgt=p.lv[p.ans][1];if(!st.started)return "#F4F4EE";
      const f=clamp(st.t/cfg.readAt,0,1);let c=mixColor(base,tgt,Math.pow(f,0.7));
      if(st.t>cfg.readAt+cfg.late&&p.drift)c=mixColor(c,p.drift,clamp((st.t-cfg.readAt-cfg.late)/90,0,0.6));return c;}
    function drawStrip(){
      let s=`<rect width="720" height="170" fill="#F5F3EF"/>`;
      s+=`<path d="M40,30 h80 v120 h-80z" fill="#F6E9A8" stroke="#9A8A3A" stroke-width="1.4"/><text x="80" y="165" font-size="11" text-anchor="middle" fill="#3A3127">${cfg.sample}</text>`;
      s+=`<rect x="150" y="70" width="${cfg.pads.length*44+60}" height="30" rx="3" fill="#FFFFFF" stroke="#999"/>`;
      cfg.pads.forEach((p,i)=>{const x=200+i*44;s+=`<rect x="${x}" y="74" width="30" height="22" rx="2" fill="${padCol(p)}" stroke="#888" stroke-width=".7"/><text x="${x+15}" y="118" font-size="9.5" text-anchor="middle" fill="#3A3127">${p.short||p.n}</text>`;});
      s+=`<text x="160" y="60" font-size="11" fill="#3A3127">Test strip (${cfg.pads.length} zones)</text>`;
      holder.innerHTML="";holder.append(svgEl(s,Math.max(720,cfg.pads.length*44+260),170));}
    drawStrip();
    const bMix=el("button",{class:"btn sm",type:"button"},"Take the sample and mix");
    bMix.onclick=()=>{if(st.mixed)return;st.mixed=true;ctx.ok(`Fresh (${cfg.fresh||"Not older than 2 hours"}) ${cfg.sample.toLowerCase()} was mixed.`);ctx.done(base);bMix.disabled=true;};
    const bDip=el("button",{class:"btn sm pri",type:"button"},"Dip");
    let dip0=0;
    bDip.onclick=()=>{if(!ctx.need(base+1))return;
      if(!st.dipping&&st.dipT==null){st.dipping=true;dip0=performance.now();bDip.textContent="Remove";return;}
      if(st.dipping){st.dipping=false;st.dipT=(performance.now()-dip0)/1000;bDip.disabled=true;bDip.textContent="Dipped";
        if(st.dipT>3.5)ctx.err(`Strip dipped for ${fx(st.dipT,1)} s — longer than 1–2 s: reagents are washed out`);
        else if(st.dipT<0.5)ctx.err("Strip dipped too briefly: the zones were not fully wetted");else ctx.ok(`Strip dipped for ${fx(st.dipT,1)} s.`);
        ctx.done(base+1);st.started=true;clk.start();}};
    const bBlot=el("button",{class:"btn sm",type:"button"},"Touch to the edge to remove the excess");
    bBlot.onclick=()=>{if(st.blotted)return;if(st.dipT==null)return toast("First dip the strip");st.blotted=true;bBlot.disabled=true;
      if(st.t>15)ctx.err("Excess urine was removed late: drops may run into neighboring zones and the colors may mix");else ctx.ok("Excess urine removed, strip held horizontally.");ctx.done(base+2);};
    // rang shkalasi
    const chart=el("table",{class:"chart"});
    cfg.pads.forEach((p,i)=>{const tr=el("tr",{},el("th",{},p.n));
      p.lv.forEach(([l,c],j)=>{const b=el("button",{class:"sw",type:"button",style:`background:${c}`,"aria-label":p.n+" "+l});
        b.onclick=()=>{if(st.done)return;st.sel[i]=j;$$("button.sw",tr).forEach((x,k)=>x.classList.toggle("on",k===j));};
        tr.append(el("td",{},b,el("span",{class:"lv"},l)));});
      chart.append(tr);});
    const bRead=el("button",{class:"btn sm pri",type:"button"},"Record the readings");
    bRead.onclick=()=>{if(st.done)return;if(!st.started)return toast("First dip the strip");
      if(st.sel.some(v=>v==null))return toast("Select the color from the chart for each zone");
      if(!st.blotted)ctx.err("Excess urine was not removed");
      if(st.t<cfg.readAt*0.9)ctx.err(`Result read at ${Math.round(st.t)} s — colors have not fully developed (wait ${cfg.readAt} s)`);
      if(st.t>cfg.readAt+cfg.late)ctx.err(`Result read late (${Math.round(st.t)} s): the color keeps changing, the result is unreliable`);
      st.done=true;clk.stop();ctx.rec[cfg.id]=st.sel.slice();
      cfg.pads.forEach((p,i)=>{const sel=p.lv[st.sel[i]][0],right=p.lv[p.ans][0];
        if(st.sel[i]!==p.ans)ctx.err(`${p.n}: read as “${sel}”, actually “${right}”`);else ctx.msg(`${p.n}: <b>${sel}</b>`);});
      ctx.done(base+3);bRead.disabled=true;setTimeout(next,300);};
    box.append(el("div",{class:"ctl"},bMix,bDip,bBlot,ctlGroup("Stopwatch",disp)),
      el("p",{class:"note"},"Dipping: click “Dip” and after 1–2 seconds click “Remove”. The stopwatch starts from the moment the strip is removed."),
      el("div",{class:"tblw"},chart),el("div",{class:"ctl"},bRead));
  }};
}

/* ---------- Immunoxromatografik test (kasseta / chiziq) ----------
 cfg: {id,title,kind:'dip'|'drop',drops,sampleChoice:{q,opts,ans,why},waitMin,readMax,pos (bool),tInt (0..1),tAppear (s)}
*/
function cassetteInst(cfg){
  const steps=[];
  if(cfg.sampleChoice)steps.push("Select the correct sample for analysis");
  steps.push("Open the package and place the test on a dry, flat surface");
  steps.push(cfg.kind==="dip"?"Dip the test strip up to the MAX mark for 10–15 s":`Apply ${cfg.drops} drops to the sample well (S)`);
  steps.push(`Wait ${cfg.waitMin} minutes`);
  steps.push("Read the C and T zones and evaluate the result");
  return {steps,mount(ctx,box,base,next){
    let b=base;const st={choice:null,open:false,applied:false,t:0,run:false,done:false,factor:1,dipT:null};
    box.append(el("h3",{},cfg.title));
    const holder=el("div");box.append(holder);
    const lineAlpha=(which)=>{if(!st.applied)return 0;const t=st.t;if(which==="C")return clamp(t/50,0,1);
      if(!cfg.pos)return 0;return clamp((t-(cfg.tAppear||30))/120,0,1)*cfg.tInt*st.factor;};
    function draw(){
      let s=`<rect width="720" height="200" fill="#F5F3EF"/>`;
      if(cfg.kind==="dip"){s+=`<rect x="120" y="80" width="470" height="44" rx="4" fill="#FFFFFF" stroke="#9AA"/><rect x="120" y="80" width="90" height="44" fill="#C9E4F5"/><text x="165" y="107" font-size="11" text-anchor="middle" fill="#1F5FA0">MAX ↓</text><rect x="210" y="80" width="2" height="44" fill="#1F5FA0"/>`;
        s+=`<rect x="300" y="84" width="200" height="36" fill="#FBF7F0" stroke="#ccc"/>`;}
      else{s+=`<rect x="110" y="60" width="500" height="90" rx="22" fill="#FFFFFF" stroke="#8D959C" stroke-width="2"/><circle cx="175" cy="105" r="20" fill="#EEE" stroke="#999"/><text x="175" y="110" font-size="13" text-anchor="middle" fill="#555">S</text><rect x="300" y="88" width="200" height="34" rx="4" fill="#FBF7F0" stroke="#bbb"/>`;}
      const tA=lineAlpha("T"),cA=lineAlpha("C");
      s+=`<rect x="370" y="88" width="7" height="32" fill="#B5265B" opacity="${tA}"/><rect x="440" y="88" width="7" height="32" fill="#B5265B" opacity="${cA}"/>`;
      s+=`<text x="373" y="140" font-size="12" text-anchor="middle" fill="#333">T</text><text x="443" y="140" font-size="12" text-anchor="middle" fill="#333">C</text>`;
      if(st.applied&&st.t<120){const fr=clamp(st.t/120,0,1);s+=`<rect x="300" y="88" width="${200*fr}" height="34" fill="#D88FB0" opacity=".18"/>`;}
      s+=`<text x="360" y="185" font-size="11" text-anchor="middle" fill="#3A3127">${cfg.device||"Test cassette"}</text>`;
      holder.innerHTML="";holder.append(svgEl(s,720,200));}
    draw();
    const ctl=el("div",{class:"ctl"});box.append(ctl);
    if(cfg.sampleChoice){const sc=cfg.sampleChoice;const ch=el("div",{class:"chips"});
      sc.opts.forEach((o,i)=>{const c=el("button",{class:"chip",type:"button"},o);c.onclick=()=>{if(st.choice!=null)return;st.choice=i;c.classList.add("on");
        if(i!==sc.ans){ctx.err(sc.why);st.factor=sc.badFactor??0.15;}else ctx.ok(`Sample: ${o}`);ctx.done(b);};ch.append(c);});
      ctl.append(ctlGroup(sc.q,ch));}
    const bb=cfg.sampleChoice?base+1:base;
    const bOpen=el("button",{class:"btn sm",type:"button"},"Open the package");
    bOpen.onclick=()=>{if(st.open||!ctx.need(bb))return;st.open=true;bOpen.disabled=true;ctx.ok("The test was removed from the package (expiry date checked) and placed on a flat surface.");ctx.done(bb);};
    ctl.append(bOpen);
    const clk=makeClock(t=>{st.t=t;disp.textContent=mmss(t);draw();});clk.speed=30;ctx.onClean(()=>clk.stop());
    const disp=el("span",{class:"clock"},"00:00");
    if(cfg.kind==="dip"){
      const bDip=el("button",{class:"btn sm pri",type:"button"},"Dip");let t0=0,dipping=false;
      bDip.onclick=()=>{if(!ctx.need(bb+1))return;
        if(!dipping&&st.dipT==null){dipping=true;t0=performance.now();bDip.textContent="Remove";return;}
        if(dipping){dipping=false;st.dipT=(performance.now()-t0)/1000;bDip.disabled=true;bDip.textContent="Dipped";
          if(st.dipT<8){ctx.err(`Strip dipped for ${fx(st.dipT,1)} s — 10–15 s needed: the membrane did not absorb enough urine`);st.factor*=0.6;}
          else if(st.dipT>20)ctx.err(`Strip dipped for ${fx(st.dipT,1)} s — longer than 15 s: the conjugate may be washed away`);
          else ctx.ok(`Test strip dipped for ${fx(st.dipT,1)} s (not beyond the MAX mark).`);
          st.applied=true;ctx.done(bb+1);clk.start();}};
      ctl.append(bDip);
    }else{
      const dS=stepper({label:"Drops",val:1,vals:[1,2,3,4,5,6]});
      const bDrop=el("button",{class:"btn sm pri",type:"button"},"Apply drops");
      bDrop.onclick=()=>{if(st.applied||!ctx.need(bb+1))return;const n=dS.get();
        if(n<cfg.drops){ctx.err(`${n} drops is too few — ${cfg.drops} drops needed: the liquid does not reach the end of the membrane`);st.factor*=0.5;}
        else if(n>cfg.drops+1)ctx.err(`${n} drops is too many — ${cfg.drops} drops needed: excess liquid floods the result window`);
        else ctx.ok(`${n} drops were applied to well S.`);
        st.applied=true;bDrop.disabled=true;ctx.done(bb+1);clk.start();};
      ctl.append(ctlGroup(cfg.dropLabel||"Sample",dS,bDrop));
    }
    ctl.append(ctlGroup("Timer (×30)",disp));
    const res=el("div",{class:"chips"});let rsel=null;
    ["Positive (C and T lines)","Negative (C line only)","Invalid (no C line)"].forEach((o,i)=>{const c=el("button",{class:"chip",type:"button"},o);c.onclick=()=>{if(st.done)return;rsel=i;$$(".chip",res).forEach((x,k)=>x.classList.toggle("on",k===i));};res.append(c);});
    const bRead=el("button",{class:"btn sm pri",type:"button"},"Record the result");
    bRead.onclick=()=>{if(st.done)return;if(!st.applied)return toast("First place the sample");if(rsel==null)return toast("Select the result");
      const tm=st.t/60;
      if(tm<cfg.waitMin*0.9)ctx.err(`Result read at ${fx(tm,1)} minutes — ${cfg.waitMin} minutes of waiting needed (a faint T line may not be visible yet)`);
      if(cfg.readMax&&tm>cfg.readMax)ctx.err(`Result read at ${fx(tm,1)} minutes — a result after ${cfg.readMax} minutes is unreliable`);
      ctx.done(bb+2);
      const truth=lineAlpha("T")>0.12?0:0;const right=cfg.pos?0:1;
      ctx.rec[cfg.id]=rsel;
      if(rsel!==right)ctx.err(`Result was evaluated incorrectly: the correct answer is ${["positive","negative","invalid"][right]}`);else ctx.ok(`Result: ${["positive","negative","invalid"][rsel]}.`);
      st.done=true;clk.stop();ctx.done(bb+3);bRead.disabled=true;setTimeout(next,300);};
    box.append(el("div",{class:"ctl"},ctlGroup("Result",res),bRead));
  }};
}

      const W=560,H=300,L=60,T=20,R=20,Bm=46;const maxC=cal[cal.length-1];const maxOD=Math.max(...st.od)*1.1;

      for(let k=0;k<=5;k++){const c=maxC*k/5;s+=`<line x1="${X(c)}" y1="${T}" x2="${X(c)}" y2="${H-Bm}" stroke="#eee"/><text x="${X(c)}" y="${H-Bm+16}" font-size="10" text-anchor="middle">${fx(c,0)}</text>`;}
      for(let k=0;k<=5;k++){const o=maxOD*k/5;s+=`<line x1="${L}" y1="${Y(o)}" x2="${W-R}" y2="${Y(o)}" stroke="#eee"/><text x="${L-6}" y="${Y(o)+4}" font-size="10" text-anchor="end">${o.toFixed(2)}</text>`;}
      s+=`<text x="${(L+W-R)/2}" y="${H-8}" font-size="11" text-anchor="middle">${cfg.analyte}, ${cfg.unit}</text><text x="14" y="${(T+H-Bm)/2}" font-size="11" transform="rotate(-90 14 ${(T+H-Bm)/2})" text-anchor="middle">OD₄₅₀</text>`;
      // egri (kalibratorlar orqali bo'lakli chiziqli)
      let d="";cal.forEach((c,i)=>{d+=(i?"L":"M")+X(c)+","+Y(st.od[i]);});s+=`<path d="${d}" fill="none" stroke="#A3600D" stroke-width="2"/>`;
      cal.forEach((c,i)=>{s+=`<circle cx="${X(c)}" cy="${Y(st.od[i])}" r="4" fill="#A3600D"/>`;});
      const odP=st.od[wells.length-1];s+=`<line x1="${L}" y1="${Y(odP)}" x2="${W-R}" y2="${Y(odP)}" stroke="#1F5FA0" stroke-dasharray="5 4"/><text x="${W-R}" y="${Y(odP)-5}" font-size="10" text-anchor="end" fill="#1F5FA0">patient OD = ${odP.toFixed(3)}</text>`;
      if(st.pick!=null)s+=`<line x1="${X(st.pick)}" y1="${T}" x2="${X(st.pick)}" y2="${H-Bm}" stroke="#B03A32" stroke-width="1.5"/><text x="${X(st.pick)+4}" y="${T+12}" font-size="11" fill="#B03A32">${fx(st.pick,1)} ${cfg.unit}</text>`;

      const svg=svgEl(s,W,H);svg.style.maxWidth="560px";svg.style.cursor="crosshair";plot.append(svg);
      svg.addEventListener("click",e=>{if(st.fin)return;const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const p=pt.matrixTransform(svg.getScreenCTM().inverse());st.pick=clamp((p.x-L)/(W-L-R)*maxC,0,maxC);drawPlot();});
      plot.append(el("div",{class:"ctl"},B("Record the concentration",()=>{if(st.fin)return;if(st.pick==null)return toast("Click a point on the graph");st.fin=true;

        let ci=NaN;for(let i=1;i<cal.length;i++){if(odP<=st.od[i]&&odP>=st.od[i-1]){ci=cal[i-1]+(odP-st.od[i-1])/(st.od[i]-st.od[i-1])*(cal[i]-cal[i-1]);break;}}

function coagInst(cfg){
  const steps=["PT: warm 50 µL of plasma at 37 °C for 3 min","PT: add 100 µL of thromboplastin-calcium and record the clotting time","aPTT: 50 µL of plasma + 50 µL of activator, incubate at 37 °C for 3 min","aPTT: add 50 µL of CaCl₂ and record the clotting time","Mixing test: aPTT with patient + normal plasma (1 : 1)"];
  return {steps,mount(ctx,box,base,next){
    box.append(el("h3",{},"Coagulometer (optical/mechanical clot detector)"));
    const holder=el("div");box.append(holder);
    const st={clot:{},running:null};
    function draw(){let s=`<rect width="720" height="190" fill="#F5F3EF"/><rect x="60" y="30" width="600" height="140" rx="14" fill="#E9ECEF" stroke="#8D959C" stroke-width="2"/>`;
      s+=`<rect x="90" y="50" width="220" height="56" rx="5" fill="#1D2A12"/><text x="105" y="85" font-family="IBM Plex Mono" font-size="20" fill="#7CFF9A">${st.running?st.running.lbl+" "+fx(st.running.t,1)+" s":"READY 37.0 °C"}</text>`;
      for(let i=0;i<4;i++)s+=`<circle cx="${380+i*44}" cy="78" r="14" fill="#4B535B"/><text x="${380+i*44}" y="112" font-size="9" text-anchor="middle" fill="#333">incub.${i+1}</text>`;
      s+=`<rect x="560" y="60" width="60" height="40" rx="5" fill="#2B2F33"/><text x="590" y="120" font-size="9" text-anchor="middle" fill="#333">measuring channel</text>`;
      s+=`<text x="360" y="160" font-size="11" text-anchor="middle" fill="#3A3127">Coagulometer · citrated plasma</text>`;holder.innerHTML="";holder.append(svgEl(s,720,190));}
    draw();
    const B=(t,f,pri)=>{const b=el("button",{class:"btn sm"+(pri?" pri":""),type:"button"},t);b.onclick=f;return b;};
    function clotRun(lbl,target,i,cb){if(st.running)return;st.running={lbl,t:0};const t0=performance.now();
      const loop=now=>{const t=(now-t0)/1000*4*(window.__TS||1);st.running.t=Math.min(t,target);draw();
        if(t<target)requestAnimationFrame(loop);else{st.running=null;st.clot[lbl]=target;draw();ctx.msg(`${({PV:"PT",AChTV:"aPTT","AChTV (aralashma)":"aPTT (mixing)"})[lbl]||lbl}: clot formed — <b>${fx(target,1)} s</b>`);ctx.done(i);cb&&cb();}};requestAnimationFrame(loop);}
    const t1=timerBox(ctx,{label:"PT pre-warming",target:180,speed:20});
    t1.onStop=t=>{if(t<150){ctx.err("Plasma was not warmed to 37 °C: the clotting time is falsely prolonged");st.ptCold=true;}ctx.done(base);};
    const bPT=B("Add thromboplastin-Ca (100 µL)",()=>{if(st.clot.PV||!ctx.need(base+1))return;bPT.disabled=true;const v=cfg.PT*(st.ptCold?1.12:1)*(1+(Math.random()-0.5)*0.02);clotRun("PV",+v.toFixed(1),base+1);});
    const t2=timerBox(ctx,{label:"aPTT incubation",target:180,speed:20});
    t2.onStart=()=>{if(!ctx.isDone(base+1))ctx.err("First complete the PT step");};
    t2.onStop=t=>{if(t<150){ctx.err("Incubation with the activator was shorter than 3 minutes: contact activation is incomplete");st.aCold=true;}ctx.done(base+2);};
    const bA=B("Add CaCl₂ (50 µL)",()=>{if(st.clot.AChTV||!ctx.need(base+3))return;bA.disabled=true;const v=cfg.APTT*(st.aCold?1.15:1)*(1+(Math.random()-0.5)*0.02);clotRun("AChTV",+v.toFixed(1),base+3);});
    const bM=B("aPTT with the mixture (1 : 1)",()=>{if(st.clot["AChTV (aralashma)"]||!ctx.need(base+4))return;bM.disabled=true;const v=cfg.mixAPTT*(1+(Math.random()-0.5)*0.02);
      ctx.info("The patient's plasma was mixed 1 : 1 with normal donor plasma and incubated with the activator for 3 minutes.");
      clotRun("AChTV (aralashma)",+v.toFixed(1),base+4,()=>{ctx.rec[cfg.id]=Object.assign({},st.clot);setTimeout(next,300);});});
    box.append(el("div",{class:"ctl"},t1.el,bPT),el("div",{class:"ctl"},t2.el,bA),el("div",{class:"ctl"},bM));
  }};
}

function nomogramInst({id,hours,conc}){
  const steps=["Place the patient's point on the nomogram (time and concentration)","Assess the point relative to the treatment line"];
  return {steps,mount(ctx,box,base,next){
    box.append(el("h3",{},"Rumack–Matthew nomogram (paracetamol)"),el("p",{class:"small muted",style:"margin-bottom:6px"},"On the graph, click where the time after ingestion (hours) and the blood paracetamol concentration (mg/L) intersect. The y-axis is logarithmic."));
    const W=600,H=360,L=60,T=20,R=20,Bm=46;const X=h=>L+(h-4)/(24-4)*(W-L-R);const ly=v=>Math.log10(v);const Y=v=>T+(ly(500)-ly(v))/(ly(500)-ly(5))*(H-T-Bm);
    const line=(c4)=>{let d="";for(let h=4;h<=24;h+=0.5){const v=c4*Math.pow(2,-(h-4)/4);d+=(h===4?"M":"L")+X(h)+","+Y(v);}return d;};
    const st={pt:null,fin:false};const holder=el("div");box.append(holder);
    function draw(){let s=`<rect width="${W}" height="${H}" fill="#fff"/>`;
      [4,8,12,16,20,24].forEach(h=>{s+=`<line x1="${X(h)}" y1="${T}" x2="${X(h)}" y2="${H-Bm}" stroke="#eee"/><text x="${X(h)}" y="${H-Bm+16}" font-size="10" text-anchor="middle">${h}</text>`;});
      [5,10,20,50,100,200,500].forEach(v=>{s+=`<line x1="${L}" y1="${Y(v)}" x2="${W-R}" y2="${Y(v)}" stroke="#eee"/><text x="${L-6}" y="${Y(v)+4}" font-size="10" text-anchor="end">${v}</text>`;});
      s+=`<path d="${line(200)}" stroke="#B03A32" stroke-width="2" fill="none"/><text x="${X(5)}" y="${Y(200*Math.pow(2,-0.25))-6}" font-size="10" fill="#B03A32">“probable hepatotoxicity” (200 mg/L, 4 h)</text>`;
      s+=`<path d="${line(150)}" stroke="#A3600D" stroke-width="2.2" stroke-dasharray="7 4" fill="none"/><text x="${X(12)}" y="${Y(150*Math.pow(2,-2))+16}" font-size="10" fill="#A3600D">treatment line (150 mg/L, 4 h)</text>`;
      s+=`<text x="${(L+W-R)/2}" y="${H-8}" font-size="11" text-anchor="middle">Time after ingestion, h</text><text x="14" y="${(T+H-Bm)/2}" font-size="11" transform="rotate(-90 14 ${(T+H-Bm)/2})" text-anchor="middle">Paracetamol, mg/L</text>`;
      if(st.pt)s+=`<circle cx="${X(st.pt.h)}" cy="${Y(st.pt.v)}" r="6" fill="#1F5FA0"/><text x="${X(st.pt.h)+8}" y="${Y(st.pt.v)-6}" font-size="11" fill="#1F5FA0">${fx(st.pt.h,1)} h; ${fx(st.pt.v,0)} mg/L</text>`;
      holder.innerHTML="";const svg=svgEl(s,W,H);svg.style.maxWidth="600px";svg.style.cursor="crosshair";holder.append(svg);
      svg.addEventListener("click",e=>{if(st.fin)return;const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const p=pt.matrixTransform(svg.getScreenCTM().inverse());
        const h=clamp(4+(p.x-L)/(W-L-R)*20,4,24);const v=Math.pow(10,ly(500)-(p.y-T)/(H-T-Bm)*(ly(500)-ly(5)));st.pt={h,v:clamp(v,5,500)};draw();});}
    draw();
    const ch=el("div",{class:"chips"});let sel=null;
    ["The point is above the treatment line — N-acetylcysteine is required","The point is below the line — no antidote is needed"].forEach((o,i)=>{const c=el("button",{class:"chip",type:"button"},o);c.onclick=()=>{if(st.fin)return;sel=i;$$(".chip",ch).forEach((x,k)=>x.classList.toggle("on",k===i));};ch.append(c);});
    const bOk=el("button",{class:"btn sm pri",type:"button"},"Record the assessment");
    bOk.onclick=()=>{if(st.fin)return;if(!st.pt)return toast("Place the point on the graph");if(sel==null)return toast("Select the assessment");
      const C=typeof conc==="function"?conc(ctx):conc;
      if(Math.abs(st.pt.h-hours)>0.8||Math.abs(ly(st.pt.v)-ly(C))>0.08)ctx.err(`The point was placed incorrectly: needed — ${hours} h and ${fx(C,0)} mg/L`);else ctx.ok("The point was placed correctly.");
      ctx.done(base);const lineV=150*Math.pow(2,-(hours-4)/4);const above=C>=lineV?0:1;
      if(sel!==above)ctx.err(`The assessment is incorrect: at ${hours} h the treatment line is ≈ ${fx(lineV,0)} mg/L, the patient has ${fx(C,0)} mg/L`);else ctx.ok(`The assessment is correct: the threshold value at ${hours} h is ≈ ${fx(lineV,0)} mg/L.`);
      ctx.rec[id]={sel,lineV};st.fin=true;ctx.done(base+1);bOk.disabled=true;setTimeout(next,300);};
    box.append(el("div",{class:"ctl"},ctlGroup("Conclusion",ch),bOk));
  }};
}

CASES.push({id:"volg",no:2,sem:3,topic:2,instr:"tubes (serial dilution)",

  gen(){const p=person(pick(["m","f"]),38,60);const end=pick([8,9]);return {p,end,act:2*2**end};},
  patient(P){return {head:`Patient ${P.p.name}, ${P.p.age} years old, ${sexW(P.p.sex)}`,rows:[

  task:["Determine α-amylase (diastase) activity in the urine by the **Wohlgemuth method**.","Calculate the activity in Wohlgemuth units and compare it with the reference range.","Explain the mechanism of the rise of enzyme activity in the blood and its diagnostic significance."],
  theory:{title:"α-Amylase and enzyme diagnostics",blocks:[
    {h:"Biochemical basis"},
    {p:"**α-Amylase** (hydrolase class) hydrolyzes the internal **α-1,4-glycosidic bonds** in starch and glycogen: starch → dextrins → maltose. Activator — **Cl⁻ ions**, cofactor — Ca²⁺. Main sources: the salivary glands and the pancreas. Because the molecule is small (≈ 50 kDa), it is filtered in the renal glomeruli and appears in the urine (**diastase**)."},
    {p:"**In acute pancreatitis**, trypsinogen is activated prematurely inside the gland; trypsin activates other proenzymes (proelastase, prophospholipase A₂, chymotrypsinogen) — **autolytic digestion** begins. Amylase and lipase pass from the damaged acinar cells into the blood and then into the urine."},
    {fig:()=>pathway([
      {id:"a",x:100,y:50,t:"Trypsinogen"},{id:"b",x:330,y:50,t:"Trypsin"},{id:"c",x:590,y:50,t:"Proelastase, prophospholipase A₂,|chymotrypsinogen → active",w:230},
      {id:"d",x:580,y:150,t:"Autolysis (necrosis)|of gland tissue",k:"d",w:170},{id:"e",x:330,y:150,t:"Acinar cell|damage",k:"d"},
      {id:"f",x:100,y:240,t:"Blood amylase, lipase ↑",k:"x"},{id:"g",x:420,y:240,t:"Urinary diastase ↑ (Wohlgemuth)",k:"x",w:220}],
      [{a:"a",b:"b",t:"activation inside the gland"},{a:"b",b:"c"},{a:"c",b:"d"},{a:"d",b:"e"},{a:"e",b:"f",t:"release of enzymes"},{a:"f",b:"g",t:"renal filtration",off:[0,-8]}],720,280,"Normally, trypsinogen is activated only in the duodenum by enteropeptidase.")},
    {h:"Principle of the method (Wohlgemuth)"},
    {p:"The urine is serially diluted two-fold and the same amount of **starch** is added to each tube. After 30 minutes at 38 °C it is tested with **iodine**: starch — **blue**, dextrins — **violet-red**, maltose — no color (the **yellow** color of iodine remains). The tube with the **highest dilution** in which starch is completely digested is found."},
    {eq:"Activity (A) = mL of 0.1% starch solution digested by 1 mL of undiluted urine in 30 minutes at 38 °C\nA = 2 mL × D   (D — dilution of the highest-dilution tube with yellow color)\nFor example, if the last yellow tube is 1 : 32: A = 2 × 32 = 64 units"},
    {h:"Reference values"},
    {tbl:[["Parameter","Reference range"],[["Urinary diastase (Wohlgemuth)","16–64 units"],["Salivary amylase (Wohlgemuth)","160–320 units"],["Serum α-amylase (kinetic)","28–100 IU/L"],["Serum lipase","< 60 IU/L"]]]},
    {h:"Procedure"},
    {ol:["Pour 1 mL of saline (0.9% NaCl — Cl⁻ activates amylase) into each of the 10 tubes.","Add 1 mL of urine to tube 1, mix, and transfer 1 mL to tube 2; continue in this way up to tube 10, and discard 1 mL from tube 10. Dilutions: 1 : 2, 1 : 4 … 1 : 1024.","Add 2 mL of 0.1% starch to each and place them in a 38 °C thermostat for 30 minutes.","Cool (the reaction stops), add 1 drop of 0.1% iodine to each and assess the colors."]},
    {tip:"If the dilution sequence is broken (for example, a tube is skipped during transfer), all subsequent dilution levels will be wrong. Mix the tube before each transfer."}]},
  ready:{q:"What does the yellow color after adding iodine indicate in the Wohlgemuth method?",opts:["Starch is not digested","Starch is partially digested to dextrins","Starch is completely digested (to maltose) — the color of the iodine itself","Amylase is inhibited"],ans:2,why:"Maltose gives no color with iodine, so the yellow color of the iodine solution remains. Blue — starch, violet-red — dextrins."},
  lab:P=>[benchInst({id:"vb",title:"Wohlgemuth method: 10 tubes",intro:"Select a reagent, set the amount and click a tube. For serial dilution, cancel the reagent selection, mark the tube and click the “Transfer 1 mL to the next” button.",maxVol:4,
    tubes:Array.from({length:10},(_,i)=>({label:`1:${2**(i+1)}`})),
    reag:[{k:"N",n:"0.9% NaCl",amts:[1,2],unit:"ml"},{k:"U",n:"Urine",amts:[1,2],unit:"ml"},{k:"K",n:"0.1% starch",amts:[2,1],unit:"ml"},{k:"I",n:"0.1% iodine",amts:[1,2,3],unit:"drop(s)"}],
    heat:[{k:"t38",n:"All tubes: 38 °C, 30 min",all:true,done:"Incubated at 38 °C for 30 minutes"}],
    extra:[{n:"Transfer 1 mL to the next",run:(S,ctx)=>{const i=S.sel;if(i==null)return toast("Mark a tube");S.nx=S.nx||0;
      if(i!==S.nx){ctx.err(`Transfer order violated: next — tube ${S.nx+1}`);}
      const t=S.tubes[i];const tot=Object.values(t.c).reduce((a,b)=>a+b,0);if(tot<1.5){ctx.err(`Tube ${i+1} does not have enough liquid to transfer`);return;}
      const part={};for(const k in t.c){part[k]=t.c[k]/tot;t.c[k]-=part[k];}
      if(i<9){const n=S.tubes[i+1];for(const k in part)n.c[k]=(n.c[k]||0)+part[k];ctx.info(`1 mL of the mixture was transferred from tube ${i+1} to tube ${i+2}`);}
      else ctx.info("1 mL was discarded from tube 10");
      S.nx=i+1;if(S.nx===10)S.serial=true;S.sel=i<9?i+1:null;}}],
    validate(a,S){if(a.type==="add"&&a.k==="K"&&!S.serial)return "Starch was added before the dilution was finished";if(a.type==="add"&&a.k==="I"&&!S.tubes[a.tube].h.t38)return "Iodine was added before incubation — amylase had no time to act";if(a.type==="add"&&a.k==="U"&&a.tube!==0)return "Urine is added only to tube 1";return null;},
    steps:[{t:"Pour 1 mL of 0.9% NaCl into each tube",ok:S=>S.tubes.every(t=>(t.c.N||0)>=0.99)},
      {t:"Add 1 mL of urine to tube 1",ok:S=>(S.tubes[0].c.U||0)>0.4||S.serial},
      {t:"Serial dilution (1 → 10), discard 1 mL from tube 10",ok:S=>!!S.serial},
      {t:"Add 2 mL of 0.1% starch to each",ok:S=>S.tubes.every(t=>(t.c.K||0)>=1.99)},
      {t:"Incubate at 38 °C for 30 minutes",ok:S=>S.tubes.every(t=>t.h.t38)},
      {t:"Cool and add 1 drop of iodine to each",ok:S=>S.tubes.every(t=>(t.c.I||0)>0)}],
    color(t,S){const P=CUR.P;const U=t.c.U||0;const tot=Object.values(t.c).reduce((a,b)=>a+b,0);if(!tot)return null;
      const base=mixColor("#F7F6EE","#F1E39A",clamp(U/tot*2,0,1));if(!t.c.I)return base;
      if(!t.c.K)return "#F0D98A";const r=t.h.t38?P.act*U/Math.max(t.c.K,0.01):0.02;
      if(r>=0.97)return "#EFD27A";if(r>=0.47)return "#A44A78";if(r>=0.24)return "#4B3F9A";return "#25327F";},
    obs:{q:"Which is the **highest-dilution** tube in which starch is completely digested (yellow)?",opts:Array.from({length:10},(_,i)=>`1 : ${2**(i+1)}`),ans:P.end-1,why:`The yellow color persisted up to 1 : ${2**P.end}; in the next tube it is violet-red (dextrins).`,step:"Identify the highest-dilution yellow tube"}})],
  results(ctx){const P=ctx.P;const ch=ctx.rec.vb;const D=ch!=null?2**(ch+1):NaN;
    return [["Last yellow tube",ch!=null?"1 : "+D:"—","—"],rrow("Urinary diastase (Wohlgemuth)",2*D,"16–64 units",16,64,0),rrow("Serum α-amylase",ri(640,980),"28–100 IU/L",28,100,0),rrow("Serum lipase",ri(900,1600),"< 60 IU/L",null,60,0),rrow("Glucose",r1(rnd(7.6,9.4)),"3.9–6.1 mmol/L",3.9,6.1,1),rrow("Calcium (total)",r1(rnd(1.86,2.05),2),"2.15–2.55 mmol/L",2.15,2.55,2)];},
  journal(ctx){return [fNum("Urinary diastase activity (A = 2 × D)","units",()=>2*2**ctx.P.end,0.001,0,0),
    fSel("Assess the result",["Normal (16–64)","Sharply increased","Decreased"],1)];},
  mc:()=>[{q:"Why does amylase rise in the urine in pancreatitis while lipase is hardly excreted?",opts:["Lipase is synthesized in the kidney","The amylase molecule is small (≈ 50 kDa) and is filtered in the glomeruli; lipase, once filtered, is reabsorbed and broken down in the tubules","Amylase is active only in the urine","Lipase is rapidly broken down in the blood and is not found at all"],ans:1,why:"That is why diastase rises after blood amylase and stays elevated longer; lipase stays elevated in the blood for a long time (7–14 days) and is more specific for pancreatitis."},
    {q:"What is the decrease in the patient's calcium related to?",opts:["Loss of calcium in the urine","Fatty acids released by lipase form insoluble soaps with Ca²⁺ (fat necrosis)","Increased parathyroid hormone synthesis","Vitamin D excess"],ans:1,why:"Calcium soaps are deposited in foci of necrosis in the peripancreatic fat tissue — hypocalcemia is a sign of a severe course."}],
  explain:ctx=>`Urinary diastase is ${2*2**ctx.P.end} units — several times above the reference range. The clinical picture (girdle-like pain, vomiting, fatty food and alcohol, gallstone disease) and the sharp rise of amylase and lipase in the blood confirm **acute pancreatitis**.`
});

CASES.push({id:"scd",no:11,sem:4,topic:18,instr:"PCR–RFLP, gel electrophoresis",

  task:["Cut the PCR products with the **MstII** restriction enzyme and run **agarose gel electrophoresis**.","Determine the genotype of the patient, the parents and the sibling.","Determine the type of mutation and the probability of the disease in the next child."],
  theory:{title:"Point mutation and RFLP",blocks:[
    {h:"Biochemical basis"},
    {p:"**HbS** — a **GAG → GTG** substitution (A → T transversion) in codon 6 of the β-globin gene: **valine** instead of glutamate (Glu6Val) — a **missense mutation**. In deoxygenated HbS, the hydrophobic valine binds to the hydrophobic “pocket” of the neighboring molecule and forms long **polymer fibers**; the erythrocyte takes a sickle shape, becomes fragile (hemolysis) and blocks capillaries (vaso-occlusive crises)."},
    {p:"The **MstII** restriction enzyme recognizes the sequence **CCTNAGG**. In the normal β-globin gene, the codon 6 region is **CCTGAGG** — a cut site is present. The mutation (CCT**G**T**G**G) destroys this site. Therefore the normal allele is cut by MstII into two fragments (**1.15** and **0.2 kb**), whereas the HbS allele gives a single long (**1.35 kb**) fragment — **restriction fragment length polymorphism (RFLP)**."},
    {fig:()=>pathway([
      {id:"a",x:120,y:60,t:"Normal: …CCT GAG G…|(Glu6)",k:"g",w:190},{id:"b",x:420,y:60,t:"MstII cuts",k:"x"},{id:"c",x:615,y:60,t:"1.15 + 0.2 kb",k:"g",w:160},
      {id:"d",x:120,y:175,t:"HbS: …CCT GTG G…|(Val6)",k:"d",w:190},{id:"e",x:420,y:175,t:"No cut site",k:"d"},{id:"f",x:615,y:175,t:"1.35 kb",k:"d"},
      {id:"g",x:360,y:270,t:"Heterozygote (AS): 1.35 + 1.15 + 0.2",k:"n",w:280}],
      [{a:"a",b:"b"},{a:"b",b:"c"},{a:"d",b:"e"},{a:"e",b:"f"}],720,300,"DNA is negatively charged due to its phosphate residues and moves toward the anode (+) in the gel; smaller fragments move faster and farther.")},
    {h:"Steps of the method"},
    {ol:["Isolate DNA and amplify the β-globin gene fragment by PCR (ready).","Add MstII and buffer; restriction at 37 °C for 60 minutes.","Place the 1.2% agarose gel in the chamber so that the **wells are on the cathode (−) side**, and add TAE buffer.","Load the marker (fragments of known size) and the samples.","Run electrophoresis at 100 V for ≈ 40 minutes.","Genotype on the UV transilluminator by comparing the fragments with the marker."]},
    {tbl:[["Genotype","MstII fragments","Clinical condition"],[["HbAA","1.15 + 0.2 kb","healthy"],["HbAS","1.35 + 1.15 + 0.2","carrier (relative resistance to malaria)"],["HbSS","1.35","sickle cell anemia"]]]},
    {tip:"If restriction is incomplete, the normal allele also leaves a 1.35 kb fragment — a healthy person appears to be a false carrier. Observe the incubation time."}]},
  ready:{q:"Which electrode do DNA fragments move toward during electrophoresis?",opts:["Toward the cathode (−), because DNA is positively charged","Toward the anode (+), because DNA is negatively charged due to its phosphate residues","Uncharged — only diffusion","In different directions depending on fragment size"],ans:1,why:"That is why the wells must be on the cathode side; otherwise the samples run out of the gel into the buffer."},
  lab:P=>[gelInst({id:"gel",enzyme:"MstII",ladder:[2.0,1.5,1.0,0.75,0.5,0.25,0.1],lanes:[
    {n:"Father",frags:[1.35,1.15,0.2],geno:1},{n:"Mother",frags:[1.35,1.15,0.2],geno:1},{n:"Patient",frags:[1.35],geno:2},
    P.sib?{n:"Sibling",frags:[1.15,0.2],geno:0}:{n:"Sibling",frags:[1.35,1.15,0.2],geno:1}]})],
  results(ctx){return [rrow("Hemoglobin",ri(64,78),"110–140 g/L",110,140,0),rrow("Reticulocytes",r1(rnd(9,15)),"0.5–1.5 %",0.5,1.5,1),["Hb electrophoresis (patient)",{h:"HbS ≈ 88%, HbF ≈ 10%, no HbA",cls:"hi"},"HbA > 95%"],rrow("Indirect bilirubin",ri(38,56),"< 17 µmol/L",null,17,0),rrow("LDH",ri(420,560),"< 250 IU/L",null,250,0),["Haptoglobin",{h:"decreased",cls:"lo"},"0.3–2.0 g/L"]];},
  journal(ctx){return [fSel("Type of mutation",["Synonymous (silent) mutation","Missense mutation (Glu → Val)","Nonsense mutation","Frameshift (deletion)"],1),
    fSel("Probability of the disease (HbSS) in these parents' next child",["0 %","25 %","50 %","100 %"],1)];},
  mc:()=>[{q:"Why does HbS polymerize only in the deoxygenated state?",opts:["Oxygen oxidizes valine","In the deoxy-Hb (T-form) conformation, a hydrophobic “pocket” (Phe85, Leu88) in the β-chain opens, and the Val6 residue of the neighboring molecule binds to it","Oxygen immediately dissolves the polymer","Heme is released during deoxygenation"],ans:1,why:"That is why hypoxia, acidosis (Bohr effect) and dehydration (hemoglobin concentration rises) trigger crises; HbF hinders polymerization (hydroxyurea raises HbF)."},
    {q:"What is the RFLP method based on?",opts:["On reading the complete DNA sequence","On a change in fragment length when a mutation destroys or creates a restriction enzyme recognition site","On a change in protein charge","On the amount of mRNA"],ans:1,why:"Not every mutation can be detected by RFLP — only those that alter a restriction site; for others, allele-specific PCR or sequencing is used."}],
  explain:ctx=>"The patient has only the 1.35 kb fragment — **HbSS (homozygote)**; the parents have 1.35 + 1.15 + 0.2 — **HbAS carriers**. Autosomal recessive inheritance: for each subsequent child the risk of disease is 25% and of being a carrier is 50%. Prenatal diagnosis can be done by this method using chorionic villus DNA."

  ready:{q:"Which structure of a protein does the biuret reaction detect?",opts:["Aromatic amino acids","Peptide bonds (complex with Cu²⁺ in alkaline medium)","Disulfide bonds","Free amino groups"],ans:1,why:"Any peptide with at least two peptide bonds gives a violet color — that is why the method measures total protein."},
  lab:P=>[centrifugeInst({}),analyzerInst({menu:ANMENU,tests:[

  theory:{title:"Plasma hemostasis",blocks:[

    {h:"Principles of the methods"},
    {ul:["**PT:** thromboplastin (TF + phospholipid) and CaCl₂ are added to citrated plasma warmed to 37 °C; the clot formation time is recorded.","**aPTT:** plasma is incubated with a contact activator (kaolin/ellagic acid) and phospholipid for 3 minutes, then CaCl₂ is added and the time is measured.","**Mixing test:** the patient's plasma is mixed 1 : 1 with normal plasma. If the aPTT **normalizes** — a factor **deficiency**; if it does not normalize — an **inhibitor** (lupus anticoagulant, antibodies to factor VIII)."]},
    {eq:"INR = (patient PT / mean normal PT)^ISI\nIn this laboratory: mean normal PT = 12.5 s;  thromboplastin ISI = 1.10"},
    {h:"Reference values"},

    {h:"Principles of the methods"},
    {eq:"CK (kinetic, NADPH formation, 340 nm — A increases):\ncreatine phosphate + ADP → (CK) → creatine + ATP\nATP + glucose → (hexokinase) → ADP + glucose-6-phosphate\nglucose-6-phosphate + NADP⁺ → (G6PD) → 6-phosphogluconate + NADPH\n\nActivity (IU/L) = ΔA/min × 8095\nCK-MB fraction (%) = CK-MB / total CK × 100   (> 6% — myocardial source)"},
    {p:"**Troponin I test** — sandwich immunochromatography: labeled anti-cTnI antibodies form a complex with troponin, and the second antibodies in the **T** zone capture it; the **C** zone shows that the test worked."},

    {tbl:[["Parameter","Reference range"],[["Total CK","men < 190; women < 170 IU/L"],["KFK-MB","< 25 IU/L (< 6% of total)"],["Troponin I (high-sensitivity)","< 0.04 ng/mL (99th percentile)"]]]},

  ready:{q:"Which marker is still elevated in a patient who presents 7 days after the infarction?",opts:["Myoglobin","Total CK","Troponin I/T","Glucose"],ans:2,why:"Myoglobin normalizes within 24 hours and CK-MB in 2–3 days; troponins stay elevated for 7–14 days."},
  lab:P=>[centrifugeInst({}),analyzerInst({menu:ANMENU,tests:[{id:"ck",short:"CK",name:"Creatine kinase (CK, kinetic)",method:"IFCC, based on NADPH formation (coupled with HK/G6PD), NAC-activated",nm:340,mode:"kinUp",inc:2,reagV:1000,sampV:20,unit:"IU/L",C:P.ck,factor:8095,c0:"#F4F2EC",c1:"#F4F2EC",reagName:"Working reagent (CP, ADP, NADP⁺, HK, G6PD, NAC)"}]}),

    {p:"Bilirubin forms red-violet **azobilirubin** with **diazotized sulfanilic acid**. Direct (water-soluble) bilirubin reacts without an accelerator; indirect bilirubin needs a **caffeine-benzoate** accelerator to be released from albumin — with it, **total** bilirubin is determined."},
    {eq:"C = (A sample / A calibrator) × 85.5 µmol/L\nIndirect bilirubin = total − direct\nDirect fraction (%) = direct / total × 100"},
