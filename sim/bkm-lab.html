<!doctype html>
<html lang="uz"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Biokimyo laboratoriyasi</title>
<meta name="description" content="Biokimyo: 20 ta klinik-laboratoriya holati — avval bemor va nazariya, so'ng asboblar bilan tahlil, oxirida natijani talqin qilish">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F3F0EA; --surface:#FFFFFF; --sunk:#ECE7DE; --ink:#211A12; --muted:#6B5F51; --line:#D8CFC2;
  --accent:#A3600D; --accent-soft:#F6E7CF; --on-accent:#FFFFFF;
  --bad:#B03A32; --bad-soft:#F7E1DE; --good:#2A7A4A; --good-soft:#DDF0E3; --warn:#8A6200; --warn-soft:#F6ECD2;
  --info:#1F5FA0; --info-soft:#DCE8F5;
  --bench:#DCD8D0; --bench2:#CBC6BC;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15120E; --surface:#1F1A14; --sunk:#110E0B; --ink:#EDE5DA; --muted:#AA9C8A; --line:#3A3127;
  --accent:#E6A64A; --accent-soft:#3A2A14; --on-accent:#1A1004;
  --bad:#EA8A80; --bad-soft:#3A1F1C; --good:#73C99A; --good-soft:#163222; --warn:#E3B651; --warn-soft:#352A12;
  --info:#6FA8E3; --info-soft:#193049;
  --bench:#2A251F; --bench2:#221E19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15120E; --surface:#1F1A14; --sunk:#110E0B; --ink:#EDE5DA; --muted:#AA9C8A; --line:#3A3127;
  --accent:#E6A64A; --accent-soft:#3A2A14; --on-accent:#1A1004;
  --bad:#EA8A80; --bad-soft:#3A1F1C; --good:#73C99A; --good-soft:#163222; --warn:#E3B651; --warn-soft:#352A12;
  --info:#6FA8E3; --info-soft:#193049;
  --bench:#2A251F; --bench2:#221E19; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.55}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(1.6rem,4vw,2.3rem);font-weight:800}
h2{font-size:1.3rem;font-weight:800}
h3{font-size:1.02rem;font-weight:600}
p{margin:0}
sub,sup{line-height:0}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-left,0px)) 40px max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono)}
.small{font-size:.86rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:7px 14px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:.93rem;line-height:1.2;text-align:center}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.sm{min-height:34px;padding:5px 10px;font-size:.86rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.on{background:var(--accent-soft);border-color:var(--accent);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
/* bosh sahifa */
.hero{padding:6px 0 14px}
.hero p{max-width:780px;margin-top:6px}
.flow{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.flow span{font-size:.82rem;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:3px 11px}
.grp{margin-top:20px}
.grp h2{font-size:1.02rem;margin-bottom:8px;color:var(--muted);font-family:var(--f-body);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.case{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;width:100%}
.case:hover{border-color:var(--accent)}
.case .no{flex:0 0 auto;width:38px;height:38px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-family:var(--f-mono)}
.case .t{font-weight:600;line-height:1.3}
.case .s{font-size:.84rem;color:var(--muted);margin-top:3px;line-height:1.35}
.case .tp{font-size:.76rem;color:var(--muted);margin-top:4px;font-family:var(--f-mono)}
.case .sc{font-size:.8rem;margin-top:5px;font-weight:600}
.case .sc.ok{color:var(--good)} .case .sc.mid{color:var(--warn)}
/* holat sahifasi */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.top h1{font-size:clamp(1.15rem,3vw,1.55rem);flex:1 1 300px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{flex:1 1 150px;display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:.9rem;text-align:left;min-height:44px}
.tab b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--sunk);font-size:.8rem;flex:0 0 auto}
.tab.cur{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.tab.cur b{background:var(--accent);color:var(--on-accent)}
.tab.ok b{background:var(--good);color:#fff}
.tab:disabled{opacity:.5;cursor:not-allowed}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;max-width:900px}
.sheet h2{margin:2px 0 10px}
.sheet h3{margin:16px 0 6px;color:var(--accent)}
.sheet p{margin:6px 0}
.sheet ul,.sheet ol{margin:6px 0;padding-left:22px}
.sheet li{margin:3px 0}
.pt-grid{display:grid;grid-template-columns:150px 1fr;gap:4px 12px;font-size:.93rem}
.pt-grid dt{color:var(--muted);font-weight:500}
.pt-grid dd{margin:0}
@media (max-width:560px){.pt-grid{grid-template-columns:1fr}.pt-grid dt{margin-top:6px}}
.task{background:var(--info-soft);border-radius:9px;padding:10px 14px;margin-top:12px}
.task b{color:var(--info)}
.eq{font-family:var(--f-mono);font-size:.86rem;background:var(--sunk);border-radius:8px;padding:8px 10px;margin:6px 0;overflow-x:auto;white-space:pre-wrap;line-height:1.5}
.diag{margin:8px 0;border:1px solid var(--line);border-radius:9px;background:var(--surface);overflow:hidden}
.diag svg{display:block;width:100%;height:auto}
.diag .cap{font-size:.8rem;color:var(--muted);padding:6px 10px;border-top:1px solid var(--line)}
.tip{border-left:4px solid var(--warn);background:var(--warn-soft);padding:8px 12px;border-radius:0 8px 8px 0;margin:10px 0;font-size:.92rem}
.lay{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:14px;align-items:start}
@media (max-width:980px){.lay{grid-template-columns:minmax(0,1fr)}}
.stage{background:linear-gradient(180deg,var(--bench),var(--bench2));border:1px solid var(--line);border-radius:var(--r);padding:12px;min-width:0}
.stage .sv{display:block;width:100%;height:auto;background:#F5F3EF;border-radius:8px;border:1px solid #BDB6AA}
.stage h3{margin:0 0 8px}
.panel{display:flex;flex-direction:column;gap:12px;min-width:0}
.steps ol{margin:6px 0 0;padding:0;list-style:none;counter-reset:s}
.steps li{position:relative;padding:5px 0 5px 32px;font-size:.88rem;line-height:1.35;counter-increment:s}
.steps li::before{content:counter(s);position:absolute;left:0;top:4px;width:23px;height:23px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:.75rem;font-weight:600;color:var(--muted)}
.steps li.cur::before{border-color:var(--accent);color:var(--accent)}
.steps li.cur{font-weight:600}
.steps li.done{color:var(--muted)}
.steps li.done::before{content:"✓";background:var(--good);border-color:var(--good);color:#fff}
.log{max-height:230px;overflow:auto;font-size:.86rem;display:flex;flex-direction:column;gap:5px}
.log div{padding:6px 9px;border-radius:7px;background:var(--sunk);line-height:1.35}
.log .err{background:var(--bad-soft);color:var(--bad)}
.log .ok{background:var(--good-soft);color:var(--good)}
.log .pt{background:var(--warn-soft)}
.jr label{display:block;font-size:.88rem;margin:9px 0 3px;font-weight:500;line-height:1.3}
.jr .inp{display:flex;gap:6px;align-items:center}
.jr input,.jr select{width:100%;min-height:38px;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.jr input{max-width:160px;font-family:var(--f-mono)}
.jr .u{font-size:.85rem;color:var(--muted);white-space:nowrap}
.jr .fb{font-size:.82rem;margin-top:3px;line-height:1.35}
.jr .fb.ok{color:var(--good)} .jr .fb.no{color:var(--bad)}
.mc{margin-top:14px}
.mc .q{font-weight:600;margin-bottom:4px;line-height:1.35}
.mc label{display:flex;gap:8px;align-items:flex-start;font-weight:400;margin:6px 0;padding:7px 9px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:.92rem;line-height:1.35}
.mc input{width:auto;min-height:0;margin-top:3px}
.mc label.ok{border-color:var(--good);background:var(--good-soft)}
.mc label.no{border-color:var(--bad);background:var(--bad-soft)}
.mc .why{font-size:.85rem;margin-top:6px;padding:8px 10px;border-radius:8px;background:var(--sunk)}
.res{border-radius:var(--r);padding:12px 14px;border:1px solid var(--line);background:var(--surface)}
.res .big{font-family:var(--f-display);font-size:1.6rem;font-weight:800}
.res.good{border-color:var(--good)} .res.mid{border-color:var(--warn)} .res.low{border-color:var(--bad)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.ctl .grpc{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:6px 8px}
.ctl .lbl{font-size:.8rem;color:var(--muted);font-weight:600;margin-right:2px}
.stp{display:inline-flex;align-items:center;gap:4px}
.stp .v{min-width:78px;text-align:center;font-family:var(--f-mono);font-weight:600;background:#10180F;color:#7CFF9A;border-radius:6px;padding:5px 8px;font-size:.95rem}
.stp button{min-width:36px;min-height:34px;border-radius:7px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.note{font-size:.84rem;color:var(--muted);margin-top:8px;line-height:1.4}
.clock{font-family:var(--f-mono);font-weight:600;background:#111;color:#FFB347;border-radius:6px;padding:5px 9px;min-width:84px;text-align:center}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:9px;font-size:.9rem;z-index:50;max-width:min(92vw,520px);text-align:center}
.tbl{border-collapse:collapse;font-size:.86rem;width:100%}
.tbl td,.tbl th{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
.tbl th{background:var(--sunk);font-weight:600}
.tbl td.hi{color:var(--bad);font-weight:600}
.tbl td.lo{color:var(--info);font-weight:600}
.tblw{overflow-x:auto}
svg text{font-family:var(--f-body)}
.clk{cursor:pointer}
.clk:hover{filter:brightness(1.07)}
.sel-ring{stroke:#F2B705!important;stroke-width:3!important}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:.86rem;min-height:36px}
.chip.on{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.chart{border-collapse:collapse;font-size:.78rem;margin-top:8px}
.chart td,.chart th{padding:3px;border:1px solid var(--line);text-align:center}
.chart th{background:var(--sunk);text-align:left;white-space:nowrap;padding:3px 6px}
.chart button.sw{width:38px;height:24px;border-radius:4px;border:1px solid rgba(0,0,0,.25);padding:0}
.chart button.sw.on{outline:3px solid var(--accent);outline-offset:1px}
.chart .lv{font-size:.68rem;color:var(--muted);display:block;line-height:1.1;margin-top:2px}
.lcd{font-family:var(--f-mono);background:#C9D7B5;color:#1D2A12;border-radius:6px;padding:8px 10px;font-size:.84rem;line-height:1.45;min-height:70px;border:2px solid #7E8B6C;white-space:pre-wrap}
.next-bar{display:flex;justify-content:flex-end;margin-top:12px;gap:8px;flex-wrap:wrap}
.gate{margin-top:14px;padding:12px 14px;border-radius:9px;border:1px dashed var(--accent);background:var(--accent-soft)}
</style>

<script>
"use strict";
/* ===== Yordamchilar ===== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const NS="http://www.w3.org/2000/svg";
function el(tag,attrs={},...kids){const e=document.createElement(tag);for(const k in attrs){if(k==="html")e.innerHTML=attrs[k];else if(k.startsWith("on"))e.addEventListener(k.slice(2),attrs[k]);else if(attrs[k]!==false&&attrs[k]!=null)e.setAttribute(k,attrs[k]===true?"":attrs[k]);}for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(c));}return e;}
function svgEl(html,w,h){const d=document.createElement("div");d.innerHTML=`<svg xmlns="${NS}" viewBox="0 0 ${w} ${h}" class="sv">${html}</svg>`;return d.firstChild;}
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const r1=(x,d=1)=>Math.round(x*10**d)/10**d;
const fx=(x,d=1)=>(+x).toFixed(d).replace(".",",");
const num=s=>{if(s==null)return NaN;s=String(s).trim().replace(/\s/g,"").replace(",",".");if(s==="")return NaN;return Number(s);};
const near=(v,t,rel=0.03,abs=0)=>Number.isFinite(v)&&Math.abs(v-t)<=Math.max(Math.abs(t)*rel,abs);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const md=s=>String(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
function toast(t){const o=$(".toast");if(o)o.remove();const d=el("div",{class:"toast"},t);document.body.append(d);setTimeout(()=>d.remove(),2800);}
const store={get(k,d){try{const v=localStorage.getItem("tq:bkm:"+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem("tq:bkm:"+k,JSON.stringify(v));}catch(e){}}};
const mmss=t=>{t=Math.max(0,Math.floor(t));return String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0");};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

/* ===== Simulyatsiya soati: 1 real soniya = speed simulyatsiya soniyasi ===== */
function makeClock(onTick){
  const c={t:0,speed:1,run:false,last:0,raf:0,
    start(){if(c.run)return;c.run=true;c.last=performance.now();c.raf=requestAnimationFrame(c.loop);},
    stop(){c.run=false;cancelAnimationFrame(c.raf);},
    loop(now){if(!c.run)return;const dt=Math.min(0.25,(now-c.last)/1000)*c.speed*(window.__TS||1);c.last=now;c.t+=dt;onTick&&onTick(c.t,dt);if(c.run)c.raf=requestAnimationFrame(c.loop);},
    reset(){c.stop();c.t=0;}};
  return c;
}
/* Inkubatsiya / kutish taymeri: target — simulyatsiya soniyalarida */
function timerBox(ctx,{label,target,speed=60,onTick,onReach,startLabel="▶ Boshlash",stopLabel="■ Olish"}){
  const disp=el("span",{class:"clock"},"00:00");
  const tgt=el("span",{class:"small muted"},"/ "+mmss(target));
  let reached=false;
  const clk=makeClock((t)=>{disp.textContent=mmss(t);onTick&&onTick(t);
    if(!reached&&t>=target){reached=true;disp.style.color="#7CFF9A";toast(label+": vaqt tugadi");onReach&&onReach(t);}});
  clk.speed=speed;
  const bStart=el("button",{class:"btn sm pri",type:"button"},startLabel);
  const bStop=el("button",{class:"btn sm",type:"button",disabled:true},stopLabel);
  const sp=el("select",{class:"btn sm","aria-label":"Tezlik"},...[[speed,"×"+speed],[speed*4,"×"+speed*4]].map(([v,t])=>el("option",{value:v},t)));
  sp.onchange=()=>clk.speed=Number(sp.value);
  const box=el("div",{class:"grpc"},el("span",{class:"lbl"},label),disp,tgt,sp,bStart,bStop);
  const T={el:box,clk,get t(){return clk.t;},get reached(){return reached;},started:false,stopped:false,
    onStart:null,onStop:null,
    start(){if(T.started)return;T.started=true;bStart.disabled=true;bStop.disabled=false;clk.start();T.onStart&&T.onStart();},
    stop(){if(!T.started||T.stopped)return;T.stopped=true;clk.stop();bStop.disabled=true;T.onStop&&T.onStop(clk.t);}};
  bStart.onclick=()=>T.start();bStop.onclick=()=>T.stop();
  ctx.onClean(()=>clk.stop());
  return T;
}
function stepper({label,val,vals,fmt=v=>v,onChange}){
  // vals — ruxsat etilgan qiymatlar ro'yxati
  let i=Math.max(0,vals.indexOf(val));
  const v=el("span",{class:"v"});const show=()=>v.textContent=fmt(vals[i]);
  const mk=(d,t)=>el("button",{type:"button","aria-label":label+" "+t,onclick:()=>{const n=i+d;if(n<0||n>=vals.length)return;i=n;show();onChange&&onChange(vals[i]);}},t);
  const box=el("span",{class:"stp"},mk(-1,"−"),v,mk(1,"+"));show();
  box.get=()=>vals[i];box.set=x=>{const k=vals.indexOf(x);if(k>=0){i=k;show();}};
  return box;
}
function ctlGroup(label,...kids){return el("div",{class:"grpc"},el("span",{class:"lbl"},label),...kids);}
function table(head,rows,cls="tbl"){
  return el("div",{class:"tblw"},el("table",{class:cls},
    head?el("thead",{},el("tr",{},...head.map(h=>el("th",{html:h})))):null,
    el("tbody",{},...rows.map(r=>el("tr",{},...r.map(c=>{if(c&&typeof c==="object"&&!c.nodeType)return el("td",{class:c.cls||"",html:c.h});return el("td",{html:c==null?"":String(c)});}))))));
}
/* ===== Metabolik sxema chizgich ===== */
// nodes: [{id,x,y,t,k}] k: "m" metabolit, "d" kasallik/natija, "x" to'siq, "g" manba
// edges: [{a,b,t,blk,dash,c}] t — ferment nomi; blk — defekt (qizil ×)
function pathway(nodes,edges,w=720,h=300,cap=""){
  const N={};nodes.forEach(n=>N[n.id]=n);
  const col={m:["#FFF7E8","#A3600D"],d:["#FBE3E0","#B03A32"],g:["#E3F1E7","#2A7A4A"],x:["#E7EEF8","#1F5FA0"],n:["#F1EEE9","#6B5F51"]};
  let s=`<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5A4E40"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#B03A32"/></marker></defs>`;
  s+=`<rect width="${w}" height="${h}" fill="#FCFBF8"/>`;
  const bw=n=>(n.w||Math.max(70,n.t.replace(/<[^>]+>/g,"").length*6.7+18)),bh=n=>n.h||(n.t.includes("|")?42:28);
  edges.forEach(e=>{const A=N[e.a],B=N[e.b];
    // chegaradan chegaraga
    const dx=B.x-A.x,dy=B.y-A.y;const L=Math.hypot(dx,dy)||1;
    const cut=(n,ux,uy)=>{const hw=bw(n)/2+3,hh=bh(n)/2+3;const tx=ux?hw/Math.abs(ux):1e9,ty=uy?hh/Math.abs(uy):1e9;return Math.min(tx,ty);};
    const ux=dx/L,uy=dy/L;const ca=cut(A,ux,uy),cb=cut(B,ux,uy);
    const x1=A.x+ux*ca,y1=A.y+uy*ca,x2=B.x-ux*cb,y2=B.y-uy*cb;
    const c=e.blk?"#B03A32":(e.c||"#5A4E40");
    s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${e.blk?2.4:1.8}" ${e.dash?'stroke-dasharray="5 4"':""} marker-end="url(#${e.blk?"ahr":"ah"})"/>`;
    const mx=(x1+x2)/2,my=(y1+y2)/2;
    if(e.t){const off=e.off||[Math.abs(uy)>0.5?8:0,Math.abs(uy)>0.5?0:-7];
      const anchor=Math.abs(uy)>0.5?"start":"middle";
      e.t.split("|").forEach((ln,i)=>{s+=`<text x="${mx+off[0]}" y="${my+off[1]+i*12}" font-size="10.5" fill="${e.blk?"#B03A32":"#1F5FA0"}" text-anchor="${anchor}" font-style="italic">${ln}</text>`;});}
    if(e.blk)s+=`<g transform="translate(${mx},${my})"><circle r="9" fill="#fff" stroke="#B03A32" stroke-width="2"/><path d="M-4,-4L4,4M4,-4L-4,4" stroke="#B03A32" stroke-width="2.4"/></g>`;
  });
  nodes.forEach(n=>{const [f,st]=col[n.k||"m"];const W=bw(n),H=bh(n);
    s+=`<rect x="${n.x-W/2}" y="${n.y-H/2}" width="${W}" height="${H}" rx="7" fill="${f}" stroke="${st}" stroke-width="1.4"/>`;
    const ls=n.t.split("|");ls.forEach((ln,i)=>{s+=`<text x="${n.x}" y="${n.y+4+(i-(ls.length-1)/2)*13}" font-size="11.5" font-weight="${i===0?600:400}" fill="#211A12" text-anchor="middle">${ln}</text>`;});});
  const box=el("div",{class:"diag"});box.append(svgEl(s,w,h));if(cap)box.append(el("div",{class:"cap",html:cap}));
  return box;
}

function openCase(c){

  CUR=ctx;

function buildLab(ctx,sec){
  ctx.labBuilt=true;
  const {c,P}=ctx;
  const insts=c.lab(P);
  ctx.steps=[];insts.forEach(I=>{I.base=ctx.steps.length;ctx.steps.push(...I.steps);});
  ctx.stepDone=ctx.steps.map(()=>false);
  const stepsOl=el("ol");

  const stage=el("div",{class:"stage"});
  const finBox=el("div");
  ctx.msg=(t,k="")=>{const d=el("div",{class:k,html:t});logBox.append(d);logBox.scrollTop=logBox.scrollHeight;};
  ctx.err=t=>{if(ctx.checked)return;ctx.errs.push(t);ctx.msg("✗ "+t,"err");toast(t);};
  ctx.ok=t=>ctx.msg("✓ "+t,"ok");
  ctx.info=t=>ctx.msg(t,"pt");
  ctx.renderSteps=()=>{stepsOl.innerHTML="";const cur=ctx.stepDone.indexOf(false);
    ctx.steps.forEach((s,i)=>stepsOl.append(el("li",{class:ctx.stepDone[i]?"done":(i===cur?"cur":"")},s)));};
  ctx.done=i=>{if(!ctx.stepDone[i]){ctx.stepDone[i]=true;ctx.renderSteps();}};
  ctx.isDone=i=>ctx.stepDone[i];
  ctx.need=(i,silent)=>{for(let k=0;k<i;k++)if(!ctx.stepDone[k]){if(!silent)ctx.err(`Avval «${ctx.steps[k]}» bosqichini bajaring`);return false;}return true;};
  const lay=el("div",{class:"lay"});

    el("div",{class:"card"},el("h3",{},"Laboratoriya daftari"),logBox),finBox);
  lay.append(stage,panel);sec.append(lay);
  ctx.renderSteps();
  let k=0;
  const mountNext=()=>{
    if(k>=insts.length){
      ctx.labFinished=true;ctx.unlock(3);ctx.markTab(2);
      const miss=ctx.steps.filter((s,i)=>!ctx.stepDone[i]);
      finBox.innerHTML="";
      finBox.append(el("div",{class:"card",style:"border-color:var(--good)"},
        el("h3",{},"Laboratoriya ishi yakunlandi"),

    I.mount(ctx,box,I.base,()=>{mountNext();});
    if(k>1)box.scrollIntoView({behavior:"smooth",block:"start"});

  mountNext();
  window.scrollTo(0,0);
}

        el("button",{class:"btn sm",type:"button",onclick:()=>{location.hash="";}},"Holatlar ro'yxati"))));
    resBox.scrollIntoView({behavior:"smooth",block:"nearest"});
  };

/* Probirka chizish (SVG satri): x,y — yuqori markaz, layers: [{h,c}] pastdan yuqoriga (h — 0..1) */
function tubeSvg(x,y,{w=26,h=110,layers=[],cap=null,label="",sel=false,id="",cls=""}={}){
  let s=`<g ${id?`id="${id}"`:""} class="${cls}">`;
  const r=w/2;const by=y+h-r;
  // suyuqlik
  let acc=0;const clipId="cl"+Math.random().toString(36).slice(2,8);
  s+=`<clipPath id="${clipId}"><path d="M${x-r},${y} V${by} A${r},${r} 0 0 0 ${x+r},${by} V${y} Z"/></clipPath>`;
  layers.forEach(L=>{const lh=L.h*(h-4);const top=y+h-acc-lh;s+=`<rect x="${x-r}" y="${top}" width="${w}" height="${lh+1}" fill="${L.c}" clip-path="url(#${clipId})"/>`;acc+=lh;});
  s+=`<path d="M${x-r},${y} V${by} A${r},${r} 0 0 0 ${x+r},${by} V${y}" fill="none" stroke="${sel?"#F2B705":"#6E7780"}" stroke-width="${sel?3:1.6}"/>`;
  s+=`<path d="M${x-r+4},${y+6} V${by-2}" stroke="#fff" stroke-width="2.4" opacity=".55"/>`;
  if(cap)s+=`<rect x="${x-r-3}" y="${y-12}" width="${w+6}" height="14" rx="3" fill="${cap}" stroke="#333" stroke-width=".8"/>`;
  else s+=`<path d="M${x-r-3},${y} H${x+r+3}" stroke="#6E7780" stroke-width="2"/>`;
  if(label)s+=`<text x="${x}" y="${y+h+16}" font-size="11" text-anchor="middle" fill="#3A3127">${label}</text>`;
  return s+"</g>";
}
const mixColor=(c1,c2,t)=>{const p=c=>[1,3,5].map(i=>parseInt(c.slice(i,i+2),16));const a=p(c1),b=p(c2);t=clamp(t,0,1);return "#"+a.map((v,i)=>Math.round(v+(b[i]-v)*t).toString(16).padStart(2,"0")).join("");};

function centrifugeInst({what="zardob",citrate=false,rpm=3000,min=10,cap=null,desc=null}={}){
  const isPl=citrate||/plazma/.test(what);
  return {steps:[`Qonni sentrifugalab ${what} ajratish (${rpm} ayl/daq, ${min} daq)`],
  mount(ctx,box,base,next){
    const tubeCap=cap||(citrate?"#5AA0E0":"#C8372D");
    box.append(el("h3",{},"Sentrifuga"),el("p",{class:"small muted",style:"margin-bottom:8px"},desc||(citrate?"Qon 3,2 % li natriy sitrat (havorang qopqoq) solingan probirkaga 9 : 1 nisbatda olingan. Plazma ajratish uchun sentrifugalang.":"Qon ivish aktivatori bor probirkaga (qizil qopqoq) olingan va 30 daqiqa xona haroratida ivishga qo'yilgan. Zardob ajratish uchun sentrifugalang.")));
    const draw=(state,ang=0)=>{
      let s=`<rect x="0" y="0" width="720" height="250" fill="#F5F3EF"/>`;
      // sentrifuga korpusi
      s+=`<rect x="40" y="70" width="330" height="150" rx="18" fill="#E9ECEF" stroke="#8D959C" stroke-width="2"/>`;
      s+=`<ellipse cx="205" cy="80" rx="135" ry="28" fill="${state.open?"#C9CED3":"#D8DDE2"}" stroke="#8D959C" stroke-width="2"/>`;
      if(state.open){s+=`<g transform="translate(205,80) rotate(${ang}) scale(1,0.21)"><circle r="110" fill="#9AA3AB"/><circle r="22" fill="#6E7780"/>`;
        for(let i=0;i<8;i++){const a=i*Math.PI/4;const has=(i===0&&state.loaded)||(i===4&&state.balance);s+=`<circle cx="${Math.cos(a)*80}" cy="${Math.sin(a)*80}" r="13" fill="${has?tubeCap:"#4B535B"}"/>`;}s+=`</g>`;}
      else s+=`<g transform="translate(205,80) rotate(${ang}) scale(1,0.21)"><path d="M-60,0H60M0,-60V60" stroke="#B7BEC5" stroke-width="10" opacity="${state.run?0.6:0.3}"/></g>`;
      s+=`<rect x="80" y="140" width="250" height="52" rx="6" fill="#1D2A12"/><text x="95" y="172" font-family="IBM Plex Mono" font-size="20" fill="#7CFF9A">${state.rpm} ayl/daq  ${String(state.min).padStart(2,"0")}:00</text>`;
      s+=`<text x="205" y="240" text-anchor="middle" font-size="12" fill="#3A3127">Laboratoriya sentrifugasi</text>`;
      // probirka holati

      for(let r=0;r<3;r++)for(let q=0;q<4;q++)s+=`<rect x="${ax+14+q*24}" y="${120+r*22}" width="18" height="16" rx="3" fill="#B9BEC4"/>`;

    holder.innerHTML="";const svg=svgEl(s,W,H);holder.append(svg);
    $$("[data-take]",svg).forEach(g=>g.addEventListener("click",()=>take(g.dataset.take)));
    $$("[data-put]",svg).forEach(g=>g.addEventListener("click",()=>put(+g.dataset.put)));

}

/* ---------- Titrlash (byuretka) ----------
 cfg: {title, sampleName, sampleVol, flask:"kolba", titrant, adds:[{n,ok}], addsLabel, ends:[{n,V,mark}], colors:[...], flash, persistNote}
*/
function titrationInst(cfg){
  const steps=[`Kolbaga ${cfg.sampleVol} ml ${cfg.sampleName} o'lchab quyish`,cfg.addsStep||"Indikatorlarni qo'shish","Byuretkani titrant bilan to'ldirib, «0» belgisiga keltirish",...cfg.ends.map(e=>`Titrlash: ${e.n}`)];
  return {steps,mount(ctx,box,base,next){
    const st={vol:null,adds:[],filled:false,V:0,rec:[],flash:0,ei:0};
    box.append(el("h3",{},cfg.title),el("p",{class:"small muted",style:"margin-bottom:8px"},`Titrant: ${cfg.titrant}. Byuretka 25 ml, bo'linish qiymati 0,1 ml; bir tomchi ≈ 0,05 ml.`));
    const holder=el("div");box.append(holder);
    const scale=()=>st.vol?st.vol/cfg.sampleVol:1;
    function color(){const ends=cfg.ends.map(e=>e.V*scale());let i=0;while(i<ends.length&&st.V>=ends[i]-1e-9)i++;
      let c=cfg.colors[i];
      if(i<ends.length){const d=ends[i]-st.V;const band=cfg.band||0.25;if(d<band&&!cfg.flash)c=mixColor(cfg.colors[i],cfg.colors[i+1],(1-d/band)*0.55);}
      if(!st.vol)return null;if(!st.adds.length&&!cfg.selfInd)return "#F4EFD9";
      if(st.flash>0&&cfg.flash&&i<ends.length)c=mixColor(c,cfg.colors[i+1],st.flash);
      return c;}
    function draw(){
      let s=`<rect width="720" height="360" fill="#F5F3EF"/>`;
      // shtativ
      s+=`<rect x="120" y="340" width="230" height="12" rx="3" fill="#6E5A44"/><rect x="140" y="20" width="8" height="322" fill="#8D959C"/><rect x="146" y="80" width="84" height="7" fill="#8D959C"/>`;
      // byuretka
      const bx=232,by=20,bh=230;const lvl=by+8+(Math.min(st.V,25)/25)*(bh-16);
      s+=`<rect x="${bx-9}" y="${by}" width="18" height="${bh}" fill="#F7FBFF" stroke="#6E7780" stroke-width="1.3"/>`;
      if(st.filled)s+=`<rect x="${bx-7}" y="${lvl}" width="14" height="${by+bh-lvl}" fill="${cfg.titrColor||"#E6F2FB"}"/>`;
      for(let v=0;v<=25;v++){const y=by+8+v/25*(bh-16);s+=`<line x1="${bx-9}" y1="${y}" x2="${bx-9+(v%5?5:9)}" y2="${y}" stroke="#333" stroke-width=".8"/>${v%5===0?`<text x="${bx+14}" y="${y+4}" font-size="9" fill="#333">${v}</text>`:""}`;}
      s+=`<path d="M${bx-5},${by+bh} L${bx-2},${by+bh+40} L${bx+2},${by+bh+40} L${bx+5},${by+bh}Z" fill="#F7FBFF" stroke="#6E7780"/><rect x="${bx-12}" y="${by+bh+8}" width="24" height="8" rx="2" fill="#2F6FD0"/>`;
      // kolba
      const fc=color();const fx0=bx,fy=300;
      s+=`<path d="M${fx0-14},${fy-62} V${fy-30} L${fx0-55},${fy+30} Q${fx0-58},${fy+38} ${fx0-48},${fy+38} H${fx0+48} Q${fx0+58},${fy+38} ${fx0+55},${fy+30} L${fx0+14},${fy-30} V${fy-62}" fill="#F7FBFF" stroke="#6E7780" stroke-width="1.6"/>`;
      if(fc)s+=`<path d="M${fx0-36},${fy+2} L${fx0-55},${fy+30} Q${fx0-58},${fy+38} ${fx0-48},${fy+38} H${fx0+48} Q${fx0+58},${fy+38} ${fx0+55},${fy+30} L${fx0+36},${fy+2}Z" fill="${fc}"/>`;
      // lupa
      const zx=430,zy=40;s+=`<rect x="${zx}" y="${zy}" width="250" height="200" rx="10" fill="#fff" stroke="#8D959C"/><text x="${zx+12}" y="${zy+22}" font-size="12" font-weight="600" fill="#3A3127">Byuretka shkalasi (kattalashtirilgan)</text>`;
      const c0=Math.max(0,st.V-1.2);
      for(let k=0;k<=24;k++){const v=Math.round((Math.floor(c0*10)/10+k*0.1)*10)/10;const y=zy+40+(v-c0)*60;if(y>zy+195)break;if(y<zy+32)continue;
        const major=Math.abs(v-Math.round(v))<1e-6,half=Math.abs(v*2-Math.round(v*2))<1e-6;
        s+=`<line x1="${zx+70}" y1="${y}" x2="${zx+70+(major?60:half?40:24)}" y2="${y}" stroke="#222" stroke-width="${major?1.6:1}"/>${major?`<text x="${zx+140}" y="${y+4}" font-size="13" font-family="IBM Plex Mono" fill="#222">${v}</text>`:""}`;}
      if(st.filled){const y=zy+40+(st.V-c0)*60;s+=`<path d="M${zx+60},${y-5} Q${zx+100},${y+6} ${zx+140},${y-5}" stroke="#1F5FA0" stroke-width="2.5" fill="none"/><rect x="${zx+60}" y="${y-5}" width="80" height="${zy+196-y}" fill="#1F5FA0" opacity=".08"/>`;}
      s+=`<text x="${zx+12}" y="${zy+194}" font-size="10" fill="#6B5F51">Meniskning pastki chetidan o'qing</text>`;
      s+=`<text x="${fx0+70}" y="${fy+20}" font-size="11" text-anchor="start" fill="#3A3127">${cfg.flask||"Titrlash kolbasi"}</text>`;
      holder.innerHTML="";holder.append(svgEl(s,720,360));}
    draw();
    // boshqaruv
    const volS=stepper({label:"Hajm",val:2,vals:[1,2,5,10,20],fmt:v=>v+" ml"});
    const bPour=el("button",{class:"btn sm",type:"button"},`${cfg.sampleName}ni o'lchab quyish`);
    bPour.onclick=()=>{if(st.vol)return;st.vol=volS.get();if(st.vol!==cfg.sampleVol)ctx.err(`${st.vol} ml olindi — usul bo'yicha ${cfg.sampleVol} ml kerak (hisoblash formulasi ${cfg.sampleVol} ml uchun tuzilgan)`);else ctx.ok(`Kolbaga ${st.vol} ml ${cfg.sampleName} quyildi.`);ctx.done(base);bPour.disabled=true;draw();};
    const chips=el("div",{class:"chips"});const chosen=new Set();
    cfg.adds.forEach((a,i)=>{const c=el("button",{class:"chip",type:"button"},a.n);c.onclick=()=>{if(st.adds.length)return;chosen.has(i)?chosen.delete(i):chosen.add(i);c.classList.toggle("on");};chips.append(c);});
    const bAdd=el("button",{class:"btn sm",type:"button"},"Qo'shish");
    bAdd.onclick=()=>{if(st.adds.length)return;if(!ctx.need(base+1))return;if(!chosen.size)return toast("Qo'shiladigan moddani tanlang");
      st.adds=[...chosen];const need=cfg.adds.map((a,i)=>a.ok?i:-1).filter(i=>i>=0);
      need.forEach(i=>{if(!chosen.has(i))ctx.err(`«${cfg.adds[i].n}» qo'shilmadi`);});
      st.adds.forEach(i=>{if(!cfg.adds[i].ok)ctx.err(`«${cfg.adds[i].n}» bu usulda qo'shilmaydi${cfg.adds[i].why?": "+cfg.adds[i].why:""}`);});
      if(need.every(i=>chosen.has(i))&&st.adds.every(i=>cfg.adds[i].ok))ctx.ok("Kerakli moddalar qo'shildi.");
      ctx.done(base+1);bAdd.disabled=true;draw();};
    const bFill=el("button",{class:"btn sm",type:"button"},"Byuretkani to'ldirib «0» ga keltirish");
    bFill.onclick=()=>{if(st.filled)return;if(!ctx.need(base+2))return;st.filled=true;ctx.ok("Byuretka to'ldirildi, menisk «0» belgisida, uchidagi havo pufakchasi chiqarildi.");ctx.done(base+2);bFill.disabled=true;draw();};
    const add=v=>{if(!st.filled)return toast("Avval byuretkani to'ldiring");if(!ctx.need(base+3))return;if(st.ei>=cfg.ends.length)return;
      st.V=Math.round((st.V+v)*100)/100;
      if(cfg.flash){const Ve=cfg.ends[st.ei].V*scale();if(st.V<Ve){st.flash=1;draw();setTimeout(()=>{st.flash=0;draw();},700);}}
      draw();};
    const bDrop=el("button",{class:"btn sm",type:"button"},"1 tomchi (0,05 ml)");bDrop.onclick=()=>add(0.05);
    const bHalf=el("button",{class:"btn sm",type:"button"},"0,5 ml");bHalf.onclick=()=>add(0.5);
    const bTwo=el("button",{class:"btn sm",type:"button"},"2 ml oqim");bTwo.onclick=()=>add(2);
    const bMark=el("button",{class:"btn sm pri",type:"button"},"Rang o'zgardi — hajmni yozish");
    bMark.onclick=()=>{if(st.ei>=cfg.ends.length)return;if(!st.filled||!ctx.need(base+3+st.ei))return;
      const e=cfg.ends[st.ei];const Ve=e.V*scale();
      if(st.V<Ve-0.051){ctx.err(`${e.n}: rang hali o'zgarmagan (${fx(st.V,2)} ml) — titrlashni davom ettiring`);return;}
      if(st.V>Ve+0.31)ctx.err(`${e.n}: oxirgi nuqta o'tkazib yuborildi (${fx(st.V,2)} ml). Oxirgi nuqtaga yaqinlashganda tomchilab titrlash kerak`);
      st.rec.push(st.V);ctx.rec[cfg.id]=st.rec.slice();
      ctx.msg(`${e.n}: byuretka ko'rsatkichi <b>${fx(st.V,2)} ml</b>`);ctx.done(base+3+st.ei);st.ei++;
      if(st.ei>=cfg.ends.length){ctx.ok("Titrlash yakunlandi.");[bDrop,bHalf,bTwo,bMark].forEach(b=>b.disabled=true);setTimeout(next,300);}};
    box.append(el("div",{class:"ctl"},ctlGroup("O'lchov silindri/pipetka",volS,bPour)),
      el("div",{class:"ctl"},ctlGroup(cfg.addsLabel||"Indikatorlar",chips,bAdd),bFill),
      el("div",{class:"ctl"},ctlGroup("Byuretka jo'mragi",bDrop,bHalf,bTwo),bMark),
      ...(cfg.persistNote?[el("p",{class:"note",html:md(cfg.persistNote)})]:[]));
  }};
}

/* ---------- Ko'p parametrli test-chiziq ----------

function stripInst(cfg){
  const steps=[`${cfg.sample} namunasini toza idishga olish va aralashtirish`,"Test-chiziqni barcha zonalar botguncha 1–2 s botirish","Ortiqcha siydikni idish chetiga tegizib olish",`${cfg.readAt} s dan keyin zonalarni rang shkalasi bilan solishtirish`];

        else if(st.dipT<0.5)ctx.err("Chiziq juda qisqa botirildi: zonalar to'liq ho'llanmadi");else ctx.ok(`Chiziq ${fx(st.dipT,1)} s botirildi.`);

      if(st.t>cfg.readAt+cfg.late)ctx.err(`Natija kech o'qildi (${Math.round(st.t)} s): rang o'zgarishda davom etadi, natija ishonchsiz`);

    bRead.onclick=()=>{if(st.done)return;if(!st.applied)return toast("Avval namunani qo'ying");if(rsel==null)return toast("Natijani tanlang");

      ctx.rec[cfg.id]=rsel;

      st.done=true;clk.stop();ctx.done(bb+3);bRead.disabled=true;setTimeout(next,300);};
    box.append(el("div",{class:"ctl"},ctlGroup("Natija",res),bRead));
  }};
}

function glucometerInst({id="glm",value,code=25}){

      holder.innerHTML="";holder.append(svgEl(s,720,230));}
    draw();
    const B=(t,f,pri)=>{const b=el("button",{class:"btn sm"+(pri?" pri":""),type:"button"},t);b.onclick=f;return b;};
    const bWash=B("Qo'lni iliq suvda yuvib quritish",()=>{if(st.wash)return;st.wash=true;bWash.disabled=true;ctx.ok("Qo'l yuvildi va quritildi (iliq suv kapillyar qon oqimini yaxshilaydi).");ctx.done(base);});
    const alcClk=makeClock(t=>{st.alcT=t;if(t>=30&&ctx._alcWet){ctx._alcWet=false;draw();ctx.info("Spirt bug'landi.");}});alcClk.speed=1;ctx.onClean(()=>alcClk.stop());
    const bAlc=B("Spirtli salfetka bilan artish",()=>{if(st.alc||!ctx.need(base))return;st.alc=true;ctx._alcWet=true;bAlc.disabled=true;alcClk.speed=6;alcClk.start();ctx.info("Barmoq yumshog'i 70 % li spirt bilan artildi. Spirt to'liq bug'lanishini kuting (≈ 30 s).");ctx.done(base+1);draw();});

    const bStrip=B("Test-chiziqni kiritish",()=>{if(st.strip||!ctx.need(base+2))return;st.strip=true;st.code=codeS.get();bStrip.disabled=true;

    const bSq=B("Barmoqni qattiq siqish",()=>{if(!st.punct)return toast("Avval teshing");if(st.squeezed)return;st.squeezed=true;ctx.err("Barmoq qattiq siqildi: qonga to'qima suyuqligi aralashib, natijani pasaytiradi");});
    const bApply=B("Tomchini test-chiziqqa tekkizish",()=>{if(st.val!=null)return;if(!st.strip)return toast("Avval test-chiziqni kiriting");if(!st.punct)return toast("Avval teshing");

      if(st.code!==code)v*=1.12;
      v=Math.round(v*10)/10;let k=5;st.count=k;draw();bApply.disabled=true;
      const iv=setInterval(()=>{k--;st.count=k;if(k<=0){clearInterval(iv);st.count=null;st.val=v;draw();ctx.rec[id]=v;ctx.msg(`Glyukometr: <b>${fx(v,1)} mmol/l</b> (kapillyar qon)`);ctx.done(base+4);setTimeout(next,300);}else draw();},Math.max(120,500/(window.__TS||1)));
      ctx.onClean(()=>clearInterval(iv));});
    box.append(el("div",{class:"ctl"},bWash,bAlc),el("div",{class:"ctl"},ctlGroup("Glyukometr kodi",codeS),bStrip),el("div",{class:"ctl"},bPun,bWipe,bSq,bApply));
  }};
}

/* ---------- Probirkalar stoli (sifat reaksiyalari) ----------
 cfg: {id,title,intro,tubes:[{label,c:{}}],reag:[{k,n,amts,unit}],heat:[{k,n}],steps:[{t,ok:S=>bool}],color:(tube,S)=>hex,obs:{q,opts,ans,why},extra:[{n,run:(S,ctx)=>void}]}
 Probirka tarkibi: tube.c[k] = ml; tube.h = {kalit: soniya}
*/
function benchInst(cfg){
  const steps=cfg.steps.map(s=>s.t).concat(cfg.obs?[cfg.obs.step||"Natijani kuzatib, baholash"]:[]);
  return {steps,cfg,mount(ctx,box,base,next){
    const S={tubes:cfg.tubes.map(t=>({label:t.label,c:Object.assign({},t.c||{}),h:{},log:[]})),sel:null,reag:null,t:0,ctx};
    ctx[cfg.id+"_S"]=S;
    box.append(el("h3",{},cfg.title));if(cfg.intro)box.append(el("p",{class:"small muted",style:"margin-bottom:8px",html:md(cfg.intro)}));
    const holder=el("div");box.append(holder);
    let lastKey="";const n=S.tubes.length;const gap=Math.min(64,640/n);const W=Math.max(720,n*gap+120);
    function draw(){
      let s=`<rect width="${W}" height="250" fill="#F5F3EF"/>`;
      s+=`<rect x="30" y="150" width="${n*gap+40}" height="16" rx="3" fill="#B98A5A"/><rect x="30" y="214" width="${n*gap+40}" height="10" rx="3" fill="#A07448"/>`;
      S.tubes.forEach((t,i)=>{const x=60+i*gap;const vol=Object.values(t.c).reduce((a,b)=>a+b,0);
        const col=cfg.color(t,S);const layers=vol?[{h:Math.min(.85,vol/(cfg.maxVol||5)*0.85),c:col||"#EEF4F8"}]:[];
        if(t.ppt&&vol)layers.unshift({h:.07,c:t.ppt});
        s+=`<g class="clk" data-t="${i}">`+tubeSvg(x,40,{h:150,w:Math.min(26,gap-12),layers,label:t.label,sel:S.sel===i})+`<rect x="${x-gap/2+2}" y="28" width="${gap-4}" height="190" fill="transparent"/></g>`;});
      const key=s.replace(/cl[a-z0-9]{6}/g,"");if(key===lastKey)return;lastKey=key;holder.innerHTML="";const svg=svgEl(s,W,250);holder.append(svg);
      $$("[data-t]",svg).forEach(g=>g.addEventListener("click",()=>clickTube(+g.dataset.t)));}
    const evalSteps=()=>{cfg.steps.forEach((st,i)=>{if(!ctx.isDone(base+i)&&st.ok(S)){if(!ctx.need(base+i,true))ctx.err(`Tartib buzildi: «${st.t}» oldingi bosqichdan oldin bajarildi`);ctx.done(base+i);}});
      if(cfg.steps.every((x,i)=>ctx.isDone(base+i))&&obsBox.hidden){obsBox.hidden=false;obsBox.scrollIntoView({behavior:"smooth",block:"nearest"});}};
    function clickTube(i){
      if(S.reag){const r=S.reag;const amt=amtS.get();const v=r.unit==="tomchi"?amt*0.05:amt;
        if(cfg.validate){const e=cfg.validate({type:"add",k:r.k,amt,tube:i},S);if(e)ctx.err(e);}
        const t=S.tubes[i];t.c[r.k]=(t.c[r.k]||0)+v;t.log.push(r.k);
        ctx.info(`${t.label}: + ${fx(amt,amt<1?2:0)} ${r.unit} ${r.n}`);
        if(cfg.onAdd)cfg.onAdd(t,r.k,S);
        draw();evalSteps();return;}
      S.sel=S.sel===i?null:i;draw();}
    // reagentlar
    const chips=el("div",{class:"chips"});
    const amtS=stepper({label:"Miqdor",val:1,vals:[1],fmt:v=>v});
    const amtWrap=el("span");amtWrap.append(amtS);
    let curAmt=amtS;
    cfg.reag.forEach((r,i)=>{const c=el("button",{class:"chip",type:"button"},r.n);c.onclick=()=>{
      if(S.reag===r){S.reag=null;c.classList.remove("on");hint.textContent="Reagentni tanlang yoki probirkani belgilang.";return;}
      S.reag=r;$$(".chip",chips).forEach((x,k)=>x.classList.toggle("on",k===i));
      const ns=stepper({label:"Miqdor",val:r.amts[0],vals:r.amts,fmt:v=>fx(v,v<1?2:(v%1?1:0))+" "+r.unit});amtWrap.innerHTML="";amtWrap.append(ns);amtS.get=ns.get;
      hint.textContent=`${r.n}: miqdorni belgilab, probirkani bosing.`;};chips.append(c);});
    const hint=el("span",{class:"small muted"},"Reagentni tanlang yoki probirkani belgilang.");
    const ctlR=el("div",{class:"ctl"},ctlGroup("Reagentlar",chips),ctlGroup("Miqdor",amtWrap),hint);
    // qizdirish va boshqalar
    const ctlH=el("div",{class:"ctl"});
    (cfg.heat||[]).forEach(h=>{const b=el("button",{class:"btn sm",type:"button"},h.n);b.onclick=()=>{
      const targets=h.all?S.tubes.map((t,i)=>i):(S.sel!=null?[S.sel]:[]);
      if(!targets.length)return toast("Avval probirkani belgilang (reagent tanlovini bekor qilib, probirkani bosing)");
      targets.forEach(i=>{const t=S.tubes[i];if(cfg.validate){const e=cfg.validate({type:"heat",k:h.k,tube:i},S);if(e)ctx.err(e);}t.h[h.k]=(t.h[h.k]||0)+(h.dur||1);t.log.push("@"+h.k);});
      ctx.info(`${h.all?"Barcha probirkalar":S.tubes[targets[0]].label}: ${h.done||h.n}`);if(cfg.onHeat)cfg.onHeat(h.k,targets,S);draw();evalSteps();};ctlH.append(b);});
    (cfg.extra||[]).forEach(x=>{const b=el("button",{class:"btn sm",type:"button"},x.n);b.onclick=()=>{x.run(S,ctx);draw();evalSteps();};ctlH.append(b);});
    // kuzatuv savoli
    const obsBox=el("div",{class:"card",hidden:true,style:"margin-top:10px"});
    if(cfg.obs){const o=cfg.obs;obsBox.append(el("div",{class:"q",style:"font-weight:600",html:md(o.q)}));const ch=el("div",{class:"chips",style:"margin-top:8px"});let done=false;
      o.opts.forEach((t,i)=>{const c=el("button",{class:"chip",type:"button",html:md(t)});c.onclick=()=>{if(done)return;done=true;c.classList.add("on");ctx.rec[cfg.id]=i;
        if(i!==o.ans)ctx.err(`Kuzatuv noto'g'ri talqin qilindi. ${o.why}`);else ctx.ok(o.why);
        ctx.done(base+cfg.steps.length);setTimeout(next,300);};ch.append(c);});obsBox.append(ch);}
    box.append(ctlR,ctlH,obsBox);
    draw();
    if(cfg.timer){/* kutish soati: S.t */const clk=makeClock(t=>{S.t=t;tdisp.textContent=mmss(t);draw();evalSteps();});clk.speed=cfg.timer.speed||30;ctx.onClean(()=>clk.stop());
      const tdisp=el("span",{class:"clock"},"00:00");const bt=el("button",{class:"btn sm",type:"button"},cfg.timer.n);bt.onclick=()=>{clk.run?clk.stop():clk.start();bt.textContent=clk.run?"⏸ To'xtatish":cfg.timer.n;};
      ctlH.append(ctlGroup(cfg.timer.lbl||"Vaqt",tdisp,bt));S.clock=clk;}
  }};
}
/* ---------- PZR-RFLP: restriksiya va agaroza gel-elektroforez ----------

    box.append(el("h3",{},"PZR–RFLP tahlili: β-globin geni"),el("p",{class:"small muted",style:"margin-bottom:8px"},`PZR bilan ko'paytirilgan β-globin geni bo'lagi ${cfg.enzyme} restriktazasi bilan kesiladi; fragmentlar agaroza gelda o'lchami bo'yicha ajratiladi va etidiy bromid (yoki SYBR) bilan UB nurda ko'rinadi.`));
